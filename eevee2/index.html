// 오프스크린 캔버스로 스프라이트 틴트
const _tintCanvas = document.createElement("canvas");
const _tintCtx = _tintCanvas.getContext("2d");
function getTintCanvas(img, size, tint, dx, dy) {
    if (_tintCanvas.width !== size) { _tintCanvas.width = size; _tintCanvas.height = size; }
    _tintCtx.clearRect(0, 0, size, size);
    _tintCtx.globalCompositeOperation = "source-over";
    _tintCtx.drawImage(img, 0, 0, size, size);
    _tintCtx.globalCompositeOperation = "source-atop";
    _tintCtx.fillStyle = tint;
    _tintCtx.fillRect(0, 0, size, size);
    _tintCtx.globalCompositeOperation = "source-over";
    ctx.drawImage(_tintCanvas, dx, dy);
}

function drawMonsterAt(m) {
    if (m.hp <= 0) return;
    const sx = m.x, sy = m.y;
    const img = images[m.sprite];
    const size = m.isRaid ? 96 : (m.isBoss ? 72 : 56);
    let shake = m.hitAnim > 0 ? Math.sin(m.hitAnim * 4) * 4 : 0;
    let shakeY = 0;
    if (m.invading) {
        // 침입 컷신: 강하게 떨림
        shake += (Math.random() - 0.5) * 6;
        shakeY += (Math.random() - 0.5) * 6;
    }
    const breathe = Math.sin(frame * 0.04 + m.id * 2) * 1.5;

    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath();
    ctx.ellipse(sx, sy + size / 2 - 2, 14, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    if (img && img.complete) {
        ctx.save();
        if (m.hitAnim > 0) {
            ctx.globalAlpha = 0.6 + Math.sin(m.hitAnim * 5) * 0.4;
        }
        const drawX = sx - size / 2 + shake;
        const drawY = sy - size / 2 + breathe + shakeY;

        // 상태이상 색상 결정
        let tint = null;
        if (m.statuses) {
            const pulse = 0.4 + 0.2 * Math.sin(frame * 0.15);
            if (m.statuses.freeze)         tint = `rgba(100,200,255,${pulse + 0.1})`;
            else if (m.statuses.burn)      tint = `rgba(255,80,30,${pulse})`;
            else if (m.statuses.poison)    tint = `rgba(170,60,200,${pulse})`;
            else if (m.statuses.paralysis) tint = `rgba(255,235,59,${pulse})`;
            else if (m.statuses.sleep)     tint = `rgba(150,170,200,${pulse + 0.05})`;
            else if (m.statuses.defDown)   tint = `rgba(244,143,177,${pulse - 0.1})`;
        }

        if (tint) {
            // 오프스크린에 스프라이트만 그리고 source-atop으로 틴트
            getTintCanvas(img, size, tint, drawX, drawY);
        } else {
            ctx.drawImage(img, drawX, drawY, size, size);
        }
        ctx.restore();
    }

    const hpRatio = m.hp / m.maxHp;
    const barW = 38, barH = 5, barR = 2;
    const barX = sx - barW / 2, barY = sy - size / 2 - 8 + breathe;

    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.beginPath();
    ctx.roundRect(barX - 1, barY - 1, barW + 2, barH + 2, barR + 1);
    ctx.fill();

    ctx.fillStyle = "#333";
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW, barH, barR);
    ctx.fill();

    ctx.fillStyle = hpRatio > 0.5 ? "#4CAF50" : hpRatio > 0.2 ? "#FF9800" : "#F44336";
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW * hpRatio, barH, barR);
    ctx.fill();

    // 상태이상 아이콘 (몬스터 위)
    if (m.statuses) {
        const keys = Object.keys(m.statuses);
        let ix = sx - (keys.length * 8) / 2;
        const iy = barY - 10;
        for (const k of keys) {
            let icColor, icText;
            if (k === "burn")        { icColor = "#FF5722"; icText = "🔥"; }
            else if (k === "poison") { icColor = "#9C27B0"; icText = "☠"; }
            else if (k === "freeze") { icColor = "#4FC3F7"; icText = "❄"; }
            else if (k === "paralysis"){ icColor = "#FFEB3B"; icText = "⚡"; }
            else if (k === "sleep")  { icColor = "#90A4AE"; icText = "💤"; }
            else if (k === "defDown"){ icColor = "#F48FB1"; icText = "↓"; }
            ctx.fillStyle = icColor;
            ctx.beginPath();
            ctx.arc(ix + 4, iy, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#fff"; ctx.font = "bold 7px system-ui";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(icText, ix + 4, iy + 0.5);
            ix += 9;
        }
    }

    // 보스 표식
    if (m.isRaid) {
        const pulse = 0.7 + 0.3 * Math.sin(frame * 0.2);
        ctx.fillStyle = `rgba(233,30,99,${pulse})`; ctx.font = "bold 11px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("⚡ RAID ⚡", sx, barY - 18);
    } else if (m.isBoss) {
        ctx.fillStyle = "#FFD700"; ctx.font = "bold 9px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("★ BOSS ★", sx, barY - 18);
    }
}

function drawEeveeAt(ee) {
    const isDrag = ee === dragging;
    const sx = ee.x, sy = ee.y;
    const img = images[ee.sprite];
    const size = isDrag ? 44 : 38;
    const bounce = Math.sin(ee.animTimer * 0.06) * 2;

    // 부스트 버프 오라
    if (ee.boostBuff > 0) {
        const pulse = 0.5 + 0.5 * Math.sin(frame * 0.2);
        ctx.save();
        ctx.fillStyle = `rgba(255,215,0,${0.15 + pulse * 0.15})`;
        ctx.beginPath();
        ctx.ellipse(sx, sy + 5, 22, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = `rgba(255,235,59,${0.5 + pulse * 0.3})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
    }

    if (isDrag) {
        ctx.beginPath();
        ctx.ellipse(sx, sy, ee.range, ee.range * ISO_Y, 0, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(100,200,255,0.08)";
        ctx.fill();
        ctx.strokeStyle = "rgba(100,200,255,0.4)";
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.beginPath();
    ctx.ellipse(sx, sy + size / 2 - 3, 12, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    if (img && img.complete) {
        ctx.save();
        ctx.globalAlpha = isDrag ? 0.8 : 1;
        ctx.translate(sx, sy + (isDrag ? -8 : bounce));
        if (ee.facing < 0) ctx.scale(-1, 1);
        ctx.drawImage(img, -size / 2, -size / 2, size, size);
        ctx.restore();
    }

    // 레벨 배지
    if (ee.level > 1) {
        ctx.fillStyle = "rgba(255,193,7,0.95)";
        ctx.beginPath();
        ctx.arc(sx + 12, sy - size / 2 + 4, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.font = "bold 9px system-ui";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(`${ee.level}`, sx + 12, sy - size / 2 + 4);
    }

    if (!isDrag) {
        ctx.beginPath();
        ctx.ellipse(sx, sy, ee.range, ee.range * ISO_Y, 0, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(100,200,255,0.06)";
        ctx.lineWidth = 1;
        ctx.stroke();
    }
}

function drawEntities() {
    // Collect all entities for depth sorting
    const allEntities = [];
    for (const m of monsters) {
        if (m.hp <= 0) continue;
        allEntities.push({ type: "monster", obj: m, gameY: m.y });
    }
    for (const ee of eevees) {
        allEntities.push({ type: "eevee", obj: ee, gameY: ee.y });
    }
    // Sort by game Y (painters algorithm - farther back drawn first)
    allEntities.sort((a, b) => a.gameY - b.gameY);

    for (const ent of allEntities) {
        if (ent.type === "monster") drawMonsterAt(ent.obj);
        else drawEeveeAt(ent.obj);
    }
}

function drawProjectiles() {
    for (const p of projectiles) {
        const bt = BULLET_TYPES[p.bulletType] || BULLET_TYPES.normal;

        // Trail
        for (const t of p.trail) {
            if (t.life <= 0) continue;
            const alpha = t.life / 8 * 0.4;
            ctx.fillStyle = bt.trail;
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(t.x, t.y, bt.size * 0.6, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Glow
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);

        ctx.beginPath();
        ctx.arc(0, 0, bt.size + 3, 0, Math.PI * 2);
        ctx.fillStyle = bt.glow;
        ctx.globalAlpha = 0.3;
        ctx.fill();
        ctx.globalAlpha = 1;

        // Bullet body
        ctx.beginPath();
        ctx.ellipse(0, 0, bt.size * 1.5, bt.size, 0, 0, Math.PI * 2);
        ctx.fillStyle = bt.color;
        ctx.fill();

        // Highlight
        ctx.beginPath();
        ctx.ellipse(-bt.size * 0.3, -bt.size * 0.2, bt.size * 0.5, bt.size * 0.3, 0, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.fill();

        ctx.restore();
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI * 2);
        ctx.fill();
    }
    for (const h of hitEffects) {
        const progress = 1 - h.life / h.maxLife;
        ctx.globalAlpha = (1 - progress) * 0.5;
        ctx.fillStyle = h.color;
        ctx.beginPath();
        ctx.arc(h.x, h.y, 8 + progress * 15, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawRocks() {
    for (const r of rocks) {
        // 버프 오라
        ctx.save();
        const buffR = getRockBuffRadius(r.type);
        const auraColor = r.type === "moss" ? "rgba(120,200,80,"
            : r.type === "metal" ? "rgba(180,200,210,"
            : "rgba(140,210,255,";
        ctx.fillStyle = auraColor + "0.08)";
        ctx.beginPath();
        ctx.ellipse(r.x, r.y, buffR, buffR * ISO_Y, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = auraColor + "0.3)";
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.ellipse(r.x, r.y, buffR, buffR * ISO_Y, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();

        // 그림자
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath();
        ctx.ellipse(r.x, r.y + 8, 18, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // 바위 본체
        if (r.type === "moss") {
            // 이끼바위 - 회색 + 초록 이끼
            ctx.fillStyle = "#6B6258";
            ctx.beginPath();
            ctx.ellipse(r.x, r.y, 18, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#5A4F45";
            ctx.beginPath();
            ctx.ellipse(r.x, r.y + 4, 18, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#4E8A38";
            ctx.beginPath();
            ctx.ellipse(r.x - 6, r.y - 6, 8, 4, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(r.x + 7, r.y - 4, 9, 4, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(r.x + 2, r.y - 9, 6, 3, 0, 0, Math.PI * 2);
            ctx.fill();
        } else if (r.type === "metal") {
            // 강철바위 - 메탈 광택
            ctx.fillStyle = "#90A4AE";
            ctx.beginPath();
            ctx.ellipse(r.x, r.y, 18, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#607D8B";
            ctx.beginPath();
            ctx.ellipse(r.x, r.y + 4, 18, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            // 광택
            ctx.fillStyle = "#CFD8DC";
            ctx.beginPath();
            ctx.ellipse(r.x - 5, r.y - 4, 7, 3, -0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(r.x + 5, r.y - 7, 5, 2, 0.4, 0, Math.PI * 2);
            ctx.fill();
            // 볼트
            ctx.fillStyle = "#37474F";
            ctx.beginPath(); ctx.arc(r.x - 10, r.y + 4, 1.8, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(r.x + 10, r.y + 4, 1.8, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(r.x, r.y + 8, 1.8, 0, Math.PI * 2); ctx.fill();
        } else {
            // 얼음바위 - 푸른 결정
            ctx.fillStyle = "#A8D8F0";
            ctx.beginPath();
            ctx.moveTo(r.x, r.y - 14);
            ctx.lineTo(r.x + 16, r.y);
            ctx.lineTo(r.x + 8, r.y + 10);
            ctx.lineTo(r.x - 8, r.y + 10);
            ctx.lineTo(r.x - 16, r.y);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = "#7AB8E0";
            ctx.beginPath();
            ctx.moveTo(r.x, r.y - 14);
            ctx.lineTo(r.x - 16, r.y);
            ctx.lineTo(r.x - 8, r.y + 10);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,0.6)";
            ctx.beginPath();
            ctx.moveTo(r.x, r.y - 14);
            ctx.lineTo(r.x + 4, r.y - 4);
            ctx.lineTo(r.x - 2, r.y);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#5599C8"; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(r.x, r.y - 14);
            ctx.lineTo(r.x + 16, r.y);
            ctx.lineTo(r.x + 8, r.y + 10);
            ctx.lineTo(r.x - 8, r.y + 10);
            ctx.lineTo(r.x - 16, r.y);
            ctx.closePath();
            ctx.stroke();
        }
    }
}

function drawSkillEffects() {
    for (const e of skillEffects) {
        const t = e.life / e.maxLife;
        const a = t;
        ctx.save();
        if (e.type === "burst") {
            // 확장 링 + 글로우
            const r = e.radius * (1 - t) + 4;
            ctx.globalAlpha = a;
            ctx.shadowColor = e.color; ctx.shadowBlur = 12 * SHADOW_BLUR_MUL;
            ctx.strokeStyle = e.color;
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.ellipse(e.x, e.y, r, r * ISO_Y, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.shadowBlur = 0;
            // 안쪽 채움
            ctx.globalAlpha = a * 0.4;
            ctx.fillStyle = e.color;
            ctx.beginPath();
            ctx.ellipse(e.x, e.y, r * 0.6, r * 0.6 * ISO_Y, 0, 0, Math.PI * 2);
            ctx.fill();
            // 흰색 코어
            ctx.globalAlpha = a * 0.8;
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.ellipse(e.x, e.y, r * 0.25, r * 0.25 * ISO_Y, 0, 0, Math.PI * 2);
            ctx.fill();
        } else if (e.type === "shockwave") {
            // 충격파 - 빠르게 확장하는 얇은 링
            const r = e.radius * (1.4 - t * 0.4);
            ctx.globalAlpha = a * 0.6;
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2 * a + 0.5;
            ctx.beginPath();
            ctx.ellipse(e.x, e.y, r, r * ISO_Y, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = a * 0.5;
            ctx.strokeStyle = e.color;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.ellipse(e.x, e.y, r + 2, (r + 2) * ISO_Y, 0, 0, Math.PI * 2);
            ctx.stroke();
        } else if (e.type === "aoe") {
            // 광역 - 큰 원형 + 그라데이션 + 방사선
            const r = e.radius * (1.3 - t * 0.5);
            const grd = ctx.createRadialGradient(e.x, e.y, 5, e.x, e.y, r);
            grd.addColorStop(0, e.color + "");
            grd.addColorStop(0.6, e.color);
            grd.addColorStop(1, "rgba(0,0,0,0)");
            ctx.globalAlpha = a * 0.6;
            ctx.fillStyle = grd;
            ctx.beginPath();
            ctx.ellipse(e.x, e.y, r, r * ISO_Y, 0, 0, Math.PI * 2);
            ctx.fill();
            // 외곽 링
            ctx.globalAlpha = a;
            ctx.strokeStyle = e.color;
            ctx.lineWidth = 3.5;
            ctx.shadowColor = e.color; ctx.shadowBlur = 10 * SHADOW_BLUR_MUL;
            ctx.beginPath();
            ctx.ellipse(e.x, e.y, r, r * ISO_Y, 0, 0, Math.PI * 2);
            ctx.stroke();
            // 방사선
            ctx.globalAlpha = a * 0.5;
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 8; i++) {
                const ang = (i / 8) * Math.PI * 2 + frame * 0.02;
                ctx.beginPath();
                ctx.moveTo(e.x + Math.cos(ang) * r * 0.3, e.y + Math.sin(ang) * r * 0.3 * ISO_Y);
                ctx.lineTo(e.x + Math.cos(ang) * r * 0.95, e.y + Math.sin(ang) * r * 0.95 * ISO_Y);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
        } else if (e.type === "line") {
            // 체인 번개 - 두꺼운 외곽 + 흰 내부
            ctx.globalAlpha = a;
            ctx.shadowColor = e.color; ctx.shadowBlur = 12 * SHADOW_BLUR_MUL;
            // 외곽 (색상)
            ctx.strokeStyle = e.color;
            ctx.lineWidth = 5 * a + 2;
            ctx.beginPath();
            ctx.moveTo(e.x, e.y);
            const segments = 6;
            const points = [{x:e.x, y:e.y}];
            for (let i = 1; i < segments; i++) {
                const tt = i / segments;
                const lx = e.x + (e.x2 - e.x) * tt + (Math.random() - 0.5) * 12;
                const ly = e.y + (e.y2 - e.y) * tt + (Math.random() - 0.5) * 12;
                points.push({x:lx, y:ly});
            }
            points.push({x:e.x2, y:e.y2});
            for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.stroke();
            // 내부 (흰색 코어)
            ctx.shadowBlur = 0;
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2 * a + 0.5;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.stroke();
        } else if (e.type === "beam") {
            // 시전자→타겟 광선
            ctx.globalAlpha = a * 0.8;
            ctx.strokeStyle = e.color;
            ctx.lineWidth = 4 * a + 1;
            ctx.shadowColor = e.color; ctx.shadowBlur = 10 * SHADOW_BLUR_MUL;
            ctx.beginPath();
            ctx.moveTo(e.x, e.y);
            ctx.lineTo(e.x2, e.y2);
            ctx.stroke();
            // 흰 코어
            ctx.shadowBlur = 0;
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 1.5 * a + 0.3;
            ctx.beginPath();
            ctx.moveTo(e.x, e.y);
            ctx.lineTo(e.x2, e.y2);
            ctx.stroke();
        } else if (e.type === "bite") {
            // 이빨 마크 (X 형태 송곳니 두 쌍)
            ctx.globalAlpha = a;
            ctx.shadowColor = e.color; ctx.shadowBlur = 8 * SHADOW_BLUR_MUL;
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 3 * a + 1;
            const r = 14 * (1 + (1 - t) * 0.3);
            // 위 송곳니
            ctx.beginPath();
            ctx.moveTo(e.x - r * 0.6, e.y - r * 0.5);
            ctx.lineTo(e.x - r * 0.3, e.y);
            ctx.moveTo(e.x + r * 0.6, e.y - r * 0.5);
            ctx.lineTo(e.x + r * 0.3, e.y);
            // 아래 송곳니
            ctx.moveTo(e.x - r * 0.6, e.y + r * 0.5);
            ctx.lineTo(e.x - r * 0.3, e.y);
            ctx.moveTo(e.x + r * 0.6, e.y + r * 0.5);
            ctx.lineTo(e.x + r * 0.3, e.y);
            ctx.stroke();
            // 색상 외곽
            ctx.strokeStyle = e.color;
            ctx.lineWidth = 5 * a + 2;
            ctx.globalAlpha = a * 0.5;
            ctx.beginPath();
            ctx.moveTo(e.x - r * 0.6, e.y - r * 0.5);
            ctx.lineTo(e.x - r * 0.3, e.y);
            ctx.moveTo(e.x + r * 0.6, e.y - r * 0.5);
            ctx.lineTo(e.x + r * 0.3, e.y);
            ctx.moveTo(e.x - r * 0.6, e.y + r * 0.5);
            ctx.lineTo(e.x - r * 0.3, e.y);
            ctx.moveTo(e.x + r * 0.6, e.y + r * 0.5);
            ctx.lineTo(e.x + r * 0.3, e.y);
            ctx.stroke();
            ctx.shadowBlur = 0;
        } else if (e.type === "dashTrail") {
            // 잔상 라인 - 흐릿한 두꺼운 띠
            ctx.globalAlpha = a * 0.6;
            ctx.strokeStyle = e.color;
            ctx.lineWidth = 8 * a;
            ctx.lineCap = "round";
            ctx.shadowColor = e.color; ctx.shadowBlur = 10 * SHADOW_BLUR_MUL;
            ctx.beginPath();
            ctx.moveTo(e.x, e.y);
            ctx.lineTo(e.x2, e.y2);
            ctx.stroke();
            ctx.globalAlpha = a;
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2 * a + 0.5;
            ctx.beginPath();
            ctx.moveTo(e.x, e.y);
            ctx.lineTo(e.x2, e.y2);
            ctx.stroke();
            ctx.lineCap = "butt";
            ctx.shadowBlur = 0;
        } else if (e.type === "cast") {
            // 시전 차징 (이브이 위)
            const r = 6 + (1 - t) * 6;
            ctx.globalAlpha = a;
            ctx.fillStyle = e.color;
            ctx.shadowColor = e.color; ctx.shadowBlur = 8 * SHADOW_BLUR_MUL;
            ctx.beginPath();
            ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = a * 0.6;
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(e.x, e.y, r * 0.4, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }
    ctx.globalAlpha = 1;
}

function drawCoinTexts() {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const ct of coinTexts) {
        ctx.globalAlpha = Math.min(1, ct.life / 20);
        ctx.fillStyle = ct.color || "#FFD700";
        ctx.font = "bold 13px system-ui";
        ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
        ctx.strokeText(ct.text, ct.x, ct.y);
        ctx.fillText(ct.text, ct.x, ct.y);
    }
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;
}

function drawSelectedHighlight() {
    if (!selectedEevee) return;
    const sx = selectedEevee.x, sy = selectedEevee.y;
    // 선택 링
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(sx, sy + 12, 18, 7, 0, 0, Math.PI * 2);
    ctx.strokeStyle = "#FFD54F";
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 3]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
}

function drawShopItemIcon(item, cx, cy) {
    // 진화 돌, 바위, 친밀도(하트), 리본을 직접 그리기
    if (item.type === "stone") {
        // 진화 돌 (마름모 보석)
        let main, light, dark;
        if (item.id === "water_stone")        { main="#4FC3F7"; light="#B3E5FC"; dark="#0288D1"; }
        else if (item.id === "thunder_stone") { main="#FFEB3B"; light="#FFF59D"; dark="#FBC02D"; }
        else if (item.id === "fire_stone")    { main="#FF5722"; light="#FFAB91"; dark="#D84315"; }
        else if (item.id === "giga_stone")    { main="#FF6F00"; light="#FFAB40"; dark="#BF360C"; }
        else if (item.id === "mega_stone")    { main="#9C27B0"; light="#CE93D8"; dark="#4A148C"; }
        else                                   { main="#888"; light="#ccc"; dark="#444"; }
        ctx.fillStyle = dark;
        ctx.beginPath();
        ctx.moveTo(cx, cy - 14);
        ctx.lineTo(cx + 12, cy);
        ctx.lineTo(cx, cy + 14);
        ctx.lineTo(cx - 12, cy);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = main;
        ctx.beginPath();
        ctx.moveTo(cx, cy - 11);
        ctx.lineTo(cx + 9, cy);
        ctx.lineTo(cx, cy + 11);
        ctx.lineTo(cx - 9, cy);
        ctx.closePath();
        ctx.fill();
        // 하이라이트
        ctx.fillStyle = light;
        ctx.beginPath();
        ctx.moveTo(cx - 3, cy - 7);
        ctx.lineTo(cx + 1, cy - 9);
        ctx.lineTo(cx - 1, cy + 1);
        ctx.lineTo(cx - 5, cy - 1);
        ctx.closePath();
        ctx.fill();
        // 외곽선
        ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx, cy - 14);
        ctx.lineTo(cx + 12, cy);
        ctx.lineTo(cx, cy + 14);
        ctx.lineTo(cx - 12, cy);
        ctx.closePath();
        ctx.stroke();
    } else if (item.type === "rock") {
        // 바위 (이끼/얼음/강철)
        const isMoss = item.id === "moss_rock";
        const isMetal = item.id === "metal_rock";
        // 바위 본체
        ctx.fillStyle = isMetal ? "#90A4AE" : "#6B6258";
        ctx.beginPath();
        ctx.ellipse(cx, cy + 2, 13, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = isMetal ? "#607D8B" : "#5A4F45";
        ctx.beginPath();
        ctx.ellipse(cx, cy + 5, 13, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        if (isMetal) {
            // 강철 광택
            ctx.fillStyle = "#CFD8DC";
            ctx.beginPath();
            ctx.ellipse(cx - 4, cy - 3, 5, 2, -0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 4, cy - 5, 4, 1.5, 0.4, 0, Math.PI * 2);
            ctx.fill();
            // 볼트
            ctx.fillStyle = "#37474F";
            ctx.beginPath(); ctx.arc(cx - 7, cy + 3, 1.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + 7, cy + 3, 1.5, 0, Math.PI * 2); ctx.fill();
        } else if (isMoss) {
            ctx.fillStyle = "#4E8A38";
            ctx.beginPath();
            ctx.ellipse(cx - 4, cy - 4, 6, 3, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 5, cy - 3, 6, 3, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 1, cy - 7, 4, 2, 0, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // 얼음 결정
            ctx.fillStyle = "#A8D8F0";
            ctx.beginPath();
            ctx.moveTo(cx, cy - 12);
            ctx.lineTo(cx + 8, cy - 2);
            ctx.lineTo(cx + 4, cy + 4);
            ctx.lineTo(cx - 4, cy + 4);
            ctx.lineTo(cx - 8, cy - 2);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.beginPath();
            ctx.moveTo(cx, cy - 12);
            ctx.lineTo(cx + 3, cy - 5);
            ctx.lineTo(cx - 1, cy - 1);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#5599C8"; ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(cx, cy - 12);
            ctx.lineTo(cx + 8, cy - 2);
            ctx.lineTo(cx + 4, cy + 4);
            ctx.lineTo(cx - 4, cy + 4);
            ctx.lineTo(cx - 8, cy - 2);
            ctx.closePath();
            ctx.stroke();
        }
    } else if (item.type === "friend") {
        // 친밀도 = 하트 (낮: 노랑, 밤: 보라)
        const day = isDayWave();
        ctx.fillStyle = day ? "#FFD54F" : "#7E57C2";
        ctx.beginPath();
        ctx.moveTo(cx, cy + 10);
        ctx.bezierCurveTo(cx - 14, cy - 2, cx - 8, cy - 13, cx, cy - 5);
        ctx.bezierCurveTo(cx + 8, cy - 13, cx + 14, cy - 2, cx, cy + 10);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.6)";
        ctx.beginPath();
        ctx.ellipse(cx - 4, cy - 5, 3, 2, -0.5, 0, Math.PI * 2);
        ctx.fill();
        // 작은 표식 (낮 ☀ / 밤 ☾)
        ctx.fillStyle = "#fff"; ctx.font = "bold 9px system-ui";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(day ? "☀" : "☾", cx, cy + 1);
    } else if (item.type === "ribbon") {
        // 리본 (분홍 나비매듭)
        ctx.fillStyle = "#F48FB1";
        // 왼쪽 루프
        ctx.beginPath();
        ctx.ellipse(cx - 7, cy, 7, 5, -0.3, 0, Math.PI * 2);
        ctx.fill();
        // 오른쪽 루프
        ctx.beginPath();
        ctx.ellipse(cx + 7, cy, 7, 5, 0.3, 0, Math.PI * 2);
        ctx.fill();
        // 중앙 매듭
        ctx.fillStyle = "#EC407A";
        ctx.fillRect(cx - 3, cy - 4, 6, 8);
        // 꼬리
        ctx.fillStyle = "#F48FB1";
        ctx.beginPath();
        ctx.moveTo(cx - 3, cy + 4);
        ctx.lineTo(cx - 5, cy + 12);
        ctx.lineTo(cx - 1, cy + 10);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx + 3, cy + 4);
        ctx.lineTo(cx + 5, cy + 12);
        ctx.lineTo(cx + 1, cy + 10);
        ctx.closePath();
        ctx.fill();
        // 하이라이트
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.beginPath();
        ctx.ellipse(cx - 9, cy - 1, 2, 1, 0, 0, Math.PI * 2);
        ctx.fill();
    } else {
        // 기타(팬메이드 진화 아이템) - 진화체 스프라이트로 표현
        const img = item.sprite ? images[item.sprite] : null;
        if (img && img.complete) {
            ctx.drawImage(img, cx - 14, cy - 14, 28, 28);
        }
    }
}

function drawHUD() {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";

    // === 상단: 웨이브 + 타이머 ===
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.beginPath();
    ctx.roundRect(CW / 2 - 60, 10, 120, 30, 15);
    ctx.fill();
    ctx.fillStyle = "#FFD54F"; ctx.font = "bold 16px system-ui";
    ctx.fillText(`WAVE ${wave}`, CW / 2, 25);

    // 낮/밤 배지 (상단 좌측)
    const day = isDayWave();
    ctx.fillStyle = day ? "rgba(255,193,7,0.85)" : "rgba(40,53,147,0.85)";
    ctx.beginPath();
    ctx.roundRect(10, 10, 70, 30, 15);
    ctx.fill();
    ctx.strokeStyle = day ? "#FFC107" : "#3F51B5"; ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.font = "bold 14px system-ui";
    ctx.fillText(day ? "☀ 낮" : "☾ 밤", 45, 25);

    // 인벤토리 (낮/밤 배지 아래, 좌측)
    if (inventory.size > 0) {
        const itemSize = 26;
        const itemGap = 4;
        let ix = 10, iy = 48;
        for (const it of ITEMS) {
            if (!inventory.has(it.id)) continue;
            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.beginPath();
            ctx.roundRect(ix, iy, itemSize, itemSize, 4);
            ctx.fill();
            ctx.strokeStyle = "rgba(255,215,0,0.5)"; ctx.lineWidth = 1;
            ctx.stroke();
            const img = images[it.sprite];
            if (img && img.complete) ctx.drawImage(img, ix + 2, iy + 2, itemSize - 4, itemSize - 4);
            ix += itemSize + itemGap;
            if (ix > CW - 130) { ix = 10; iy += itemSize + itemGap; }
        }
    }

    // 리더보드 버튼 (상단 우측, 코인 옆)
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.beginPath();
    ctx.roundRect(LB_BTN.x, LB_BTN.y, LB_BTN.w, LB_BTN.h, 8);
    ctx.fill();
    ctx.strokeStyle = "#FFD700"; ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.fillStyle = "#FFD700"; ctx.font = "bold 14px system-ui";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🏆", LB_BTN.x + LB_BTN.w / 2, LB_BTN.y + LB_BTN.h / 2);

    // 코인 (상단 우측)
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.beginPath();
    ctx.roundRect(CW - 130, 10, 120, 30, 15);
    ctx.fill();
    // 코인 아이콘
    const coinX = CW - 110, coinY = 25;
    ctx.fillStyle = "#FFD700";
    ctx.beginPath(); ctx.arc(coinX, coinY, 9, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#B8860B"; ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#B8860B"; ctx.font = "bold 11px system-ui";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("$", coinX, coinY + 1);
    // 금액
    ctx.fillStyle = "#FFD700"; ctx.font = "bold 15px system-ui";
    ctx.textAlign = "left";
    ctx.fillText(`${coins}`, coinX + 14, coinY);
    ctx.textAlign = "center";

    if (gameState === "playing") {
        const remain = Math.max(0, Math.ceil(waveTimer / 60));
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath();
        ctx.roundRect(CW / 2 - 35, 44, 70, 28, 14);
        ctx.fill();
        ctx.fillStyle = remain < 10 ? "#F44336" : "#fff";
        ctx.font = "bold 20px system-ui";
        ctx.fillText(`${remain}s`, CW / 2, 58);

        const aliveCount = monsters.filter(m => m.hp > 0).length;
        const queuedCount = waveSpawnQueue.length;
        // 필드 몬스터/제한 (50 고정)
        const fieldColor = aliveCount >= OVERFLOW_LIMIT ? "#F44336"
            : aliveCount >= OVERFLOW_LIMIT - 8 ? "#FF9800"
            : "rgba(255,255,255,0.6)";
        ctx.fillStyle = fieldColor; ctx.font = "bold 12px system-ui";
        ctx.fillText(`필드 ${aliveCount} / 50`, CW / 2, 82);
        // 잔여 (스폰 대기 + 필드)
        ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.font = "10px system-ui";
        ctx.fillText(`잔여 ${aliveCount + queuedCount}`, CW / 2, 96);

        // 라운드 클리어 시 - 화면 전체가 탭 영역, 중앙에 안내 텍스트만
        if (isRoundClear()) {
            const pulse = 0.6 + 0.4 * Math.sin(frame * 0.1);
            // 살짝 어둡게 (탭 가능한 상태 표시)
            ctx.fillStyle = `rgba(0,0,0,${pulse * 0.18})`;
            ctx.fillRect(0, 0, CW, CH);
            // 안내 텍스트
            ctx.fillStyle = `rgba(255,255,255,${pulse})`;
            ctx.font = "bold 22px system-ui";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.strokeStyle = "rgba(0,0,0,0.7)"; ctx.lineWidth = 4;
            const msg = "▶ 화면을 탭하여 다음 라운드";
            ctx.strokeText(msg, CW / 2, CH / 2);
            ctx.fillText(msg, CW / 2, CH / 2);
        }
    }

    // === 하단 바 ===
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(0, BAR_Y, CW, BAR_H);
    ctx.strokeStyle = "rgba(255,255,255,0.1)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, BAR_Y); ctx.lineTo(CW, BAR_Y); ctx.stroke();

    // 이브이 추가 버튼
    const cost = getEeveeCost();
    const maxSlots = getEeveeMaxSlots();
    const slotFull = eevees.length >= maxSlots;
    const canBuy = coins >= cost && !slotFull;
    ctx.fillStyle = canBuy ? "rgba(76,175,80,0.8)" : "rgba(100,100,100,0.6)";
    ctx.beginPath();
    ctx.roundRect(BUY_BTN.x, BUY_BTN.y, BUY_BTN.w, BUY_BTN.h, 8);
    ctx.fill();
    ctx.strokeStyle = canBuy ? "#66BB6A" : "#666";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = canBuy ? "#fff" : "#999";
    ctx.font = "bold 13px system-ui";
    if (slotFull) {
        ctx.fillText(`슬롯 가득참`, BUY_BTN.x + BUY_BTN.w / 2, BUY_BTN.y + BUY_BTN.h / 2);
    } else {
        ctx.fillText(`+ 이브이 (${cost})`, BUY_BTN.x + BUY_BTN.w / 2, BUY_BTN.y + BUY_BTN.h / 2);
    }

    // 이브이 수 표시 (현재/최대)
    ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.font = "11px system-ui";
    ctx.textAlign = "left";
    ctx.fillText(`이브이: ${eevees.length} / ${maxSlots}`, 15, BAR_Y + 30);
    ctx.textAlign = "center";

    // === 액션 패널 (선택된 이브이가 있을 때 - 레벨업 버튼) ===
    if (selectedEevee) {
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.beginPath();
        ctx.roundRect(ACTION_PANEL.x, ACTION_PANEL.y, ACTION_PANEL.w, ACTION_PANEL.h, 8);
        ctx.fill();
        ctx.strokeStyle = "rgba(255,215,0,0.3)"; ctx.lineWidth = 1;
        ctx.stroke();

        // Lv 표시
        ctx.fillStyle = "#FFD54F"; ctx.font = "bold 13px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(`Lv. ${selectedEevee.level}`, ACTION_PANEL.x + ACTION_PANEL.w / 2, ACTION_PANEL.y + 12);

        // 친밀도 표시 (기본 이브이만)
        if (selectedEevee.sprite === "이브이.png") {
            ctx.fillStyle = "#F48FB1"; ctx.font = "10px system-ui";
            ctx.fillText(`♥ ${selectedEevee.friendship}`, ACTION_PANEL.x + ACTION_PANEL.w / 2, ACTION_PANEL.y + 24);
        }

        // 레벨업 버튼
        const lvCost = getLevelUpCost(selectedEevee);
        const canLvl = coins >= lvCost;
        ctx.fillStyle = canLvl ? "rgba(255,193,7,0.85)" : "rgba(100,100,100,0.6)";
        ctx.beginPath();
        ctx.roundRect(LVL_BTN.x, LVL_BTN.y, LVL_BTN.w, LVL_BTN.h, 6);
        ctx.fill();
        ctx.strokeStyle = canLvl ? "#FFB300" : "#666"; ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.fillStyle = canLvl ? "#fff" : "#999";
        ctx.font = "bold 12px system-ui";
        ctx.fillText(`▲ 레벨업 (${lvCost})`, LVL_BTN.x + LVL_BTN.w / 2, LVL_BTN.y + LVL_BTN.h / 2);
    }

    // === 상점 패널 (선택된 이브이가 기본 이브이일 때) ===
    if (selectedEevee && selectedEevee.sprite === "이브이.png") {
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.beginPath();
        ctx.roundRect(10, EVO_PANEL_Y, CW - 20, EVO_PANEL_H, 10);
        ctx.fill();
        ctx.strokeStyle = "rgba(255,215,0,0.3)"; ctx.lineWidth = 1;
        ctx.stroke();

        // 정식 8종 모두 진화했으면 팬메이드 상점, 아니면 정식 상점
        const baseAllDone = [0,1,2,3,4,5,6,7].every(i => isEvolutionTaken(i));
        const tier = baseAllDone ? "fan" : "base";

        ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.font = "10px system-ui";
        const tierLabel = baseAllDone ? "★ 팬메이드 ★" : "상점";
        ctx.fillText(`${tierLabel}  |  ${isDayWave() ? "☀ 낮" : "☾ 밤"}`, CW / 2, EVO_PANEL_Y + 10);

        // 현재 티어 + 보유 안한 진화만
        const visibleShop = SHOP_ITEMS.filter(item => {
            if (item.tier !== tier) return false;
            const targetEvoIdx = getEvoIdxFromItem(item);
            return !isEvolutionTaken(targetEvoIdx);
        });
        currentVisibleShop = visibleShop;

        // 동적 아이콘 폭 (많은 슬롯 수용)
        const iconW = Math.min(EVO_ICON_W, Math.floor((CW - 40) / Math.max(1, visibleShop.length)));
        const totalW = visibleShop.length * iconW;
        const startX = CW / 2 - totalW / 2;

        for (let i = 0; i < visibleShop.length; i++) {
            const item = visibleShop[i];
            const ex = startX + i * iconW + iconW / 2;
            const ey = EVO_PANEL_Y + 35;

            const canAfford = coins >= item.cost;
            const condOk = checkShopItemConditions(selectedEevee, item);
            const canBuyItem = canAfford && condOk;

            // 아이콘 배경
            ctx.fillStyle = canBuyItem ? "rgba(255,255,255,0.12)" : "rgba(0,0,0,0.35)";
            ctx.beginPath();
            ctx.roundRect(ex - iconW/2 + 2, ey - 18, iconW - 4, 46, 6);
            ctx.fill();
            if (canBuyItem) {
                ctx.strokeStyle = tier === "fan" ? "rgba(255,100,255,0.6)" : "rgba(255,215,0,0.5)";
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // 아이콘
            ctx.save();
            if (!canBuyItem) ctx.globalAlpha = 0.35;
            drawShopItemIcon(item, ex, ey - 4);
            ctx.restore();

            // 이름 + 비용
            ctx.fillStyle = canBuyItem ? "#fff" : "#666";
            ctx.font = "8px system-ui";
            ctx.fillText(item.name, ex, ey + 14);
            ctx.fillStyle = canAfford ? "#FFD700" : "#888";
            ctx.font = "bold 9px system-ui";
            ctx.fillText(`${item.cost}`, ex, ey + 24);

            // 조건 미충족 표시 (간단)
            if (!condOk) {
                let hint = "";
                if (item.reqLevel && selectedEevee.level < item.reqLevel) hint = `Lv${item.reqLevel}`;
                else if (item.reqFriend && selectedEevee.friendship < item.reqFriend) hint = `♥${item.reqFriend}`;
                else if (item.type === "buddy") hint = "메탈리아";
                else if (item.type === "bossKill") hint = `보스${item.reqBossKills}`;
                else if (item.type === "timed") hint = item.reqDay ? "낮" : "밤";
                else if (item.type === "killCount") hint = `처치${item.reqKills}`;
                else if (item.type === "specificKill") hint = item.reqKillName;
                else if (item.type === "itemHeld") hint = "울퉁불퉁멧";
                if (hint) {
                    ctx.fillStyle = "#F44336"; ctx.font = "7px system-ui";
                    ctx.fillText(hint, ex, ey - 22);
                }
            }
        }
    } else if (selectedEevee && selectedEevee.sprite !== "이브이.png") {
        // 진화체 정보 + 스킬
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.beginPath();
        ctx.roundRect(10, EVO_PANEL_Y, CW - 20, EVO_PANEL_H, 10);
        ctx.fill();
        ctx.strokeStyle = "rgba(255,215,0,0.3)"; ctx.lineWidth = 1;
        ctx.stroke();

        const img = images[selectedEevee.sprite];
        if (img && img.complete) ctx.drawImage(img, 18, EVO_PANEL_Y + 10, 50, 50);

        ctx.textAlign = "left";
        ctx.fillStyle = "#fff"; ctx.font = "bold 11px system-ui";
        ctx.fillText(`${selectedEevee.type} · ${selectedEevee.category === "phys" ? "물리" : "특수"}`, 78, EVO_PANEL_Y + 14);
        ctx.fillStyle = "#FFD54F"; ctx.font = "10px system-ui";
        ctx.fillText(`ATK ${selectedEevee.atk}  spATK ${selectedEevee.spAtk}  RNG ${selectedEevee.range}`, 78, EVO_PANEL_Y + 28);

        // 스킬 게이지 (Lv5/10 해금)
        if (selectedEevee.skill1) {
            const s1 = selectedEevee.skill1;
            const unlocked1 = selectedEevee.level >= 5;
            const r1 = unlocked1 ? 1 - selectedEevee.skill1Cd / s1.cd : 0;
            ctx.fillStyle = "rgba(255,255,255,0.15)";
            ctx.fillRect(78, EVO_PANEL_Y + 38, 200, 8);
            ctx.fillStyle = unlocked1 ? s1.color : "rgba(100,100,100,0.5)";
            ctx.fillRect(78, EVO_PANEL_Y + 38, 200 * Math.min(1, r1), 8);
            ctx.fillStyle = unlocked1 ? "#fff" : "#888"; ctx.font = "9px system-ui";
            ctx.fillText(unlocked1 ? `Ⓟ ${s1.name}` : `Ⓟ ${s1.name} (Lv5)`, 282, EVO_PANEL_Y + 42);
        }
        if (selectedEevee.skill2) {
            const s2 = selectedEevee.skill2;
            const unlocked2 = selectedEevee.level >= 10;
            const r2 = unlocked2 ? 1 - selectedEevee.skill2Cd / s2.cd : 0;
            ctx.fillStyle = "rgba(255,255,255,0.15)";
            ctx.fillRect(78, EVO_PANEL_Y + 50, 200, 8);
            ctx.fillStyle = unlocked2 ? s2.color : "rgba(100,100,100,0.5)";
            ctx.fillRect(78, EVO_PANEL_Y + 50, 200 * Math.min(1, r2), 8);
            ctx.fillStyle = unlocked2 ? "#fff" : "#888"; ctx.font = "9px system-ui";
            ctx.fillText(unlocked2 ? `Ⓢ ${s2.name}` : `Ⓢ ${s2.name} (Lv10)`, 282, EVO_PANEL_Y + 54);
        }
        ctx.textAlign = "center";
    }

    // === 선택된 몬스터 정보 ===
    if (selectedMonster && selectedMonster.hp > 0) {
        const m = selectedMonster;
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.beginPath();
        ctx.roundRect(10, EVO_PANEL_Y, CW - 20, EVO_PANEL_H, 10);
        ctx.fill();
        ctx.strokeStyle = "rgba(244,67,54,0.5)"; ctx.lineWidth = 1.5;
        ctx.stroke();

        const img = images[m.sprite];
        if (img && img.complete) ctx.drawImage(img, 18, EVO_PANEL_Y + 10, 50, 50);

        ctx.textAlign = "left";
        ctx.fillStyle = "#fff"; ctx.font = "bold 12px system-ui";
        const typeLabel = (m.types && m.types.length > 1) ? m.types.join(" / ") : (m.type || "");
        const tag = m.isRaid ? " ⚡RAID⚡" : (m.isBoss ? " ★" : "");
        ctx.fillText(`${m.name}${tag}  [${typeLabel}]`, 78, EVO_PANEL_Y + 14);

        // HP 바
        const hpRatio = m.hp / m.maxHp;
        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(78, EVO_PANEL_Y + 22, 200, 8);
        ctx.fillStyle = hpRatio > 0.5 ? "#4CAF50" : hpRatio > 0.2 ? "#FF9800" : "#F44336";
        ctx.fillRect(78, EVO_PANEL_Y + 22, 200 * hpRatio, 8);
        ctx.fillStyle = "#fff"; ctx.font = "9px system-ui";
        ctx.fillText(`HP ${Math.max(0, Math.ceil(m.hp))} / ${m.maxHp}`, 282, EVO_PANEL_Y + 28);

        ctx.fillStyle = "#FFD54F"; ctx.font = "10px system-ui";
        ctx.fillText(`mDef ${m.mDef}  sDef ${m.sDef}`, 78, EVO_PANEL_Y + 42);

        // 상태이상
        const statusList = m.statuses ? Object.keys(m.statuses) : [];
        if (statusList.length > 0) {
            const statusNames = { burn:"화상", poison:"독", freeze:"빙결", paralysis:"마비", sleep:"잠듦", defDown:"방어↓" };
            const statusColors = { burn:"#FF5722", poison:"#9C27B0", freeze:"#4FC3F7", paralysis:"#FFEB3B", sleep:"#90A4AE", defDown:"#F48FB1" };
            let sx2 = 78;
            for (const k of statusList) {
                const txt = statusNames[k] || k;
                ctx.fillStyle = statusColors[k] || "#fff";
                ctx.font = "9px system-ui";
                const w = ctx.measureText(txt).width + 8;
                ctx.fillStyle = `${statusColors[k]}33`;
                ctx.fillRect(sx2, EVO_PANEL_Y + 50, w, 12);
                ctx.fillStyle = statusColors[k];
                ctx.fillText(txt, sx2 + 4, EVO_PANEL_Y + 56);
                sx2 += w + 4;
            }
        } else {
            ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.font = "9px system-ui";
            ctx.fillText("상태이상 없음", 78, EVO_PANEL_Y + 56);
        }
        ctx.textAlign = "center";
    }

    // === 선택된 아이템 정보 ===
    if (selectedItem) {
        const it = ITEMS.find(i => i.id === selectedItem);
        if (it) {
            ctx.fillStyle = "rgba(0,0,0,0.75)";
            ctx.beginPath();
            ctx.roundRect(10, EVO_PANEL_Y, CW - 20, EVO_PANEL_H, 10);
            ctx.fill();
            ctx.strokeStyle = "rgba(255,215,0,0.5)"; ctx.lineWidth = 1.5;
            ctx.stroke();

            const img = images[it.sprite];
            if (img && img.complete) ctx.drawImage(img, 18, EVO_PANEL_Y + 10, 50, 50);

            ctx.textAlign = "left";
            ctx.fillStyle = "#FFD700"; ctx.font = "bold 14px system-ui";
            ctx.fillText(it.name, 78, EVO_PANEL_Y + 18);
            ctx.fillStyle = "#fff"; ctx.font = "11px system-ui";
            // 줄바꿈 처리 (자동)
            const desc = it.desc;
            ctx.fillText(desc, 78, EVO_PANEL_Y + 38);
            ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.font = "9px system-ui";
            ctx.fillText("글로벌 패시브 효과", 78, EVO_PANEL_Y + 56);
            ctx.textAlign = "center";
        }
    }

    // === 선택된 바위 정보 ===
    if (selectedRock) {
        const rt = selectedRock.type;
        const isMoss = rt === "moss";
        const isMetal = rt === "metal";
        const isIce = rt === "ice";
        ctx.fillStyle = "rgba(0,0,0,0.75)";
        ctx.beginPath();
        ctx.roundRect(10, EVO_PANEL_Y, CW - 20, EVO_PANEL_H, 10);
        ctx.fill();
        ctx.strokeStyle = isMoss ? "rgba(120,200,80,0.6)" : isMetal ? "rgba(180,200,210,0.7)" : "rgba(140,210,255,0.6)";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 바위 미니 아이콘
        ctx.save();
        const cx = 38, cy = EVO_PANEL_Y + 35;
        if (isMoss) {
            ctx.fillStyle = "#6B6258";
            ctx.beginPath(); ctx.ellipse(cx, cy, 18, 13, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#4E8A38";
            ctx.beginPath(); ctx.ellipse(cx - 6, cy - 6, 8, 4, -0.3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(cx + 7, cy - 4, 9, 4, 0.3, 0, Math.PI * 2); ctx.fill();
        } else if (isMetal) {
            ctx.fillStyle = "#90A4AE";
            ctx.beginPath(); ctx.ellipse(cx, cy, 18, 13, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#CFD8DC";
            ctx.beginPath(); ctx.ellipse(cx - 5, cy - 4, 7, 3, -0.4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#37474F";
            ctx.beginPath(); ctx.arc(cx - 10, cy + 4, 1.8, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + 10, cy + 4, 1.8, 0, Math.PI * 2); ctx.fill();
        } else {
            ctx.fillStyle = "#A8D8F0";
            ctx.beginPath();
            ctx.moveTo(cx, cy - 14); ctx.lineTo(cx + 16, cy);
            ctx.lineTo(cx + 8, cy + 10); ctx.lineTo(cx - 8, cy + 10);
            ctx.lineTo(cx - 16, cy); ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#5599C8"; ctx.lineWidth = 1; ctx.stroke();
        }
        ctx.restore();

        const name = isMoss ? "이끼바위" : isMetal ? "강철바위" : "얼음바위";
        const desc = isMoss ? "주변 이브이즈 이동속도 +50%"
            : isMetal ? "주변 이브이즈 평타 데미지 +10%"
            : "주변 몬스터 이동속도 -60% (빙결)";
        const color = isMoss ? "#9CCC65" : isMetal ? "#B0BEC5" : "#81D4FA";

        ctx.textAlign = "left";
        ctx.fillStyle = color; ctx.font = "bold 14px system-ui";
        ctx.fillText(name, 78, EVO_PANEL_Y + 18);
        ctx.fillStyle = "#fff"; ctx.font = "11px system-ui";
        ctx.fillText(desc, 78, EVO_PANEL_Y + 38);
        ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.font = "9px system-ui";
        ctx.fillText(`효과 반경 ${Math.round(getRockBuffRadius(rt))}px  |  드래그로 이동`, 78, EVO_PANEL_Y + 56);
        ctx.textAlign = "center";
    }

    // === 침입 카운트다운 ===
    if (overflowActive) {
        const sec = Math.max(0, Math.ceil(overflowTimer / 60));
        // 화면 가장자리 빨간 펄스
        const pulse = 0.3 + 0.2 * Math.sin(frame * 0.2);
        ctx.fillStyle = `rgba(244,67,54,${pulse * 0.15})`;
        ctx.fillRect(0, 0, CW, CH);
        // 중앙 카운트다운
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.beginPath();
        ctx.roundRect(CW / 2 - 110, 100, 220, 60, 12);
        ctx.fill();
        ctx.strokeStyle = "#F44336"; ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.font = "bold 14px system-ui";
        const warnMsg = overflowReason === "boss" ? "보스 다중 침입 경고!" : "농장 과포화 경고!";
        ctx.fillText(warnMsg, CW / 2, 118);
        ctx.fillStyle = "#F44336"; ctx.font = "bold 32px system-ui";
        ctx.fillText(`${sec}`, CW / 2, 145);
    }

    // === 컷신 오버레이 ===
    if (gameState === "cutscene") {
        const progress = (180 - cutsceneTimer) / 180;
        ctx.fillStyle = `rgba(100,0,0,${progress * 0.5})`;
        ctx.fillRect(0, 0, CW, CH);

        if (progress > 0.3) {
            ctx.fillStyle = "#fff"; ctx.font = "bold 26px system-ui";
            ctx.strokeStyle = "#000"; ctx.lineWidth = 4;
            ctx.strokeText("농장이 침입당했다!", CW / 2, CH / 2);
            ctx.fillText("농장이 침입당했다!", CW / 2, CH / 2);
        }
    }

    // Game over
    if (gameState === "gameover") {
        ctx.fillStyle = "rgba(0,0,0,0.75)";
        ctx.fillRect(0, 0, CW, CH);

        ctx.fillStyle = "#F44336"; ctx.font = "bold 36px system-ui";
        ctx.strokeStyle = "#000"; ctx.lineWidth = 3;
        ctx.strokeText("GAME OVER", CW / 2, CH / 2 - 30);
        ctx.fillText("GAME OVER", CW / 2, CH / 2 - 30);

        ctx.fillStyle = "#fff"; ctx.font = "16px system-ui";
        ctx.fillText(`Wave ${wave} 도달`, CW / 2, CH / 2 + 10);

        ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.font = "13px system-ui";
        ctx.fillText("터치하여 재시작", CW / 2, CH / 2 + 50);
    }
}

function drawSellZone() {
    if (!dragging || !eevees.includes(dragging)) return;
    const inZone = hitRect({x: dragging.x, y: dragging.y}, SELL_ZONE);
    const pulse = 0.6 + 0.4 * Math.sin(frame * 0.15);
    ctx.save();
    ctx.fillStyle = inZone ? `rgba(244,67,54,${pulse * 0.85})` : "rgba(0,0,0,0.6)";
    ctx.beginPath();
    ctx.roundRect(SELL_ZONE.x, SELL_ZONE.y, SELL_ZONE.w, SELL_ZONE.h, 12);

    ctx.strokeStyle = inZone ? "#FFEB3B" : "#F44336";
    ctx.lineWidth = inZone ? 3 : 2;
    ctx.setLineDash(inZone ? [] : [6, 4]);
    ctx.stroke();

function drawTutorialOverlay() {
    if (!tutorialActive) return;
    const step = TUTORIAL_STEPS[tutorialStep];
    if (!step) return;

    // 강조 펄스 (대상 위치)
    const pulse = 0.5 + 0.5 * Math.sin(frame * 0.1);

    // 단계별 강조 위치
    if (tutorialStep === 0 || tutorialStep === 1) {
        // 이브이 강조
        const ee = eevees[0];
        if (ee) {
            ctx.save();
            ctx.strokeStyle = `rgba(255,215,0,${0.6 + pulse * 0.4})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(ee.x, ee.y, 30 + pulse * 8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    } else if (tutorialStep === 3) {
        // 좌측 액션 패널 / 레벨업 버튼 강조
        ctx.save();
        ctx.strokeStyle = `rgba(255,215,0,${0.6 + pulse * 0.4})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(LVL_BTN.x - 4, LVL_BTN.y - 4, LVL_BTN.w + 8, LVL_BTN.h + 8, 8);
        ctx.stroke();
        ctx.restore();
    }

    // 메시지 박스 (상단)
    const boxY = 110, boxH = 80;
    ctx.fillStyle = "rgba(0,0,0,0.78)";
    ctx.beginPath();
    ctx.roundRect(20, boxY, CW - 40, boxH, 12);
    ctx.fill();
    ctx.strokeStyle = "#FFD700"; ctx.lineWidth = 2;
    ctx.stroke();

    // 단계 표시
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#FFD700"; ctx.font = "bold 11px system-ui";
    ctx.fillText(`STEP ${tutorialStep + 1} / ${TUTORIAL_STEPS.length}`, CW / 2, boxY + 16);

    // 메시지 (개행 지원)
    ctx.fillStyle = "#fff"; ctx.font = "bold 15px system-ui";
    const lines = step.msg.split("\n");
    let ty = boxY + 40;
    for (const ln of lines) {
        ctx.fillText(ln, CW / 2, ty);
        ty += 20;

    // 스킵 버튼
    ctx.fillStyle = "rgba(100,100,100,0.75)";
    ctx.beginPath();
    ctx.roundRect(CW - 80, CH - 50, 70, 32, 8);

    ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.font = "12px system-ui";
    ctx.fillText("스킵", CW - 45, CH - 34);
}

function draw() {
    ctx.clearRect(0, 0, CW, CH);
    if (gameState === "splash") {
        drawSplash();
        drawLeaderboardPopup();
        return;
    }
    drawBackground();
    drawOrbitPath();
    drawFarmPlatform();
    drawRocks();
    drawSelectedHighlight();
    drawEntities();
    drawParticles();
    drawProjectiles();
    drawSkillEffects();
    drawSellZone();
    // 밤이면 전체 색조 오버레이 (캐릭터 위)

    }

    drawTutorialOverlay();
    drawLeaderboardPopup();

}

function getSellPrice(ee) {
    // 기본 이브이는 구매가 절반, 진화체는 누적 투자가 일부 환불
    const isEvolved = ee.sprite !== "이브이.png";
    let price = 15; // 기본값 (이브이 30의 절반)
    if (isEvolved) {
        // 진화 비용 추정 (60~150) + 레벨업 비용 누적
        price = 50;
    }
    // 레벨업 비용 누적 환불 (50%)
    let lvlInvest = 0;
    for (let l = 1; l < ee.level; l++) {
        const tmp = { ...ee, level: l };
        lvlInvest += getLevelUpCost(tmp);
    }
    price += Math.floor(lvlInvest * 0.5);
    return price;
}

function sellEevee(ee) {
    const idx = eevees.indexOf(ee);
    if (idx < 0) return;
    coins += getSellPrice(ee);
    coinTexts.push({ x: ee.x, y: ee.y - 15, text: `+${getSellPrice(ee)}`, life: 50, color: "#FFD700" });
    eevees.splice(idx, 1);
    if (selectedEevee === ee) selectedEevee = null;
}

function isRoundClear() {
    return waveSpawnQueue.length === 0 && monsters.filter(m => m.hp > 0).length === 0;
}

function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = CW / rect.width, scaleY = CH / rect.height;
    const touch = e.touches ? e.touches[0] : e;
    return { x: (touch.clientX - rect.left) * scaleX, y: (touch.clientY - rect.top) * scaleY };
}

function hitRect(pos, r) {
    return pos.x >= r.x && pos.x <= r.x + r.w && pos.y >= r.y && pos.y <= r.y + r.h;
}

function buyEevee() {
    if (eevees.length >= getEeveeMaxSlots()) return;
    const cost = getEeveeCost();
    if (coins < cost) return;
    coins -= cost;
    eeveesBought++;
    spawnEevee("이브이.png", 5, 70, 110, "normal");
}

function applyEvolution(ee, evoIdx) {
    const evo = EVOLUTIONS[evoIdx];
    ee.sprite = evo.sprite;
    ee.atk = evo.atk;
    ee.spAtk = evo.spAtk;
    ee.atkSpeed = evo.atkSpeed;
    ee.range = evo.range;
    ee.bulletType = evo.bulletType;
    ee.type = evo.type;
    ee.category = evo.category;
    ee.baseAtk = evo.atk;
    ee.baseSpAtk = evo.spAtk;
    ee.baseAtkSpeed = evo.atkSpeed;
    ee.baseRange = evo.range;
    // 진화 시 레벨 1로 리셋
    ee.level = 1;
    // 스킬 초기화
    const sk = SKILLS[evo.sprite];
    if (sk) {
        ee.skill1 = sk.phys;
        ee.skill2 = sk.spec;
        ee.skill1Cd = Math.floor(sk.phys.cd * 0.5); // 첫 사용 빠르게
        ee.skill2Cd = Math.floor(sk.spec.cd * 0.5);
    }
    // 진화 이펙트
    for (let k = 0; k < 20; k++) {
        const a = Math.random() * Math.PI * 2;
        particles.push({
            x: ee.x, y: ee.y,
            vx: Math.cos(a) * 3, vy: Math.sin(a) * 3 - 2,
            color: "#FFFFFF", life: 40, maxLife: 40,
            size: 3 + Math.random() * 2,
        });
    }
}

function isEvolutionTaken(evoIdx) {
    const evo = EVOLUTIONS[evoIdx];
    if (!evo) return false;
    return eevees.some(e => e.sprite === evo.sprite);
}

// 상점 아이템 진화 조건 체크 (조건 충족 여부만, 골드 X)
function checkShopItemConditions(ee, item) {
    if (item.reqLevel && ee.level < item.reqLevel) return false;
    if (item.reqFriend && ee.friendship < item.reqFriend) return false;
    if (item.type === "buddy") {
        // 록키온: 메탈리아가 농장에 있어야
        if (!eevees.some(e => e.sprite === item.reqBuddySprite)) return false;
    }
    if (item.type === "bossKill") {
        if (bossKillCount < (item.reqBossKills || 0)) return false;
    }
    if (item.type === "timed") {
        if (item.reqDay !== undefined && isDayWave() !== item.reqDay) return false;
    }
    if (item.type === "killCount") {
        if ((ee.kills || 0) < (item.reqKills || 0)) return false;
    }
    if (item.type === "specificKill") {
        if (!ee.killNames || (ee.killNames[item.reqKillName] || 0) < 1) return false;
    }
    if (item.type === "itemHeld") {
        if (!hasItem(item.reqItemId)) return false;
    }
    return true;
}

function getEvoIdxFromItem(item) {
    if (item.type === "friend") return isDayWave() ? 3 : 4;
    return item.evoIdx;
}

function buyShopItem(ee, itemId) {
    if (ee.sprite !== "이브이.png") return;
    const item = SHOP_ITEMS.find(it => it.id === itemId);
    if (!item) return;
    if (coins < item.cost) return;
    if (!checkShopItemConditions(ee, item)) return;

    const targetEvoIdx = getEvoIdxFromItem(item);
    if (isEvolutionTaken(targetEvoIdx)) return;

    coins -= item.cost;

    if (item.type === "rock") {
        let rockType = "moss";
        if (item.id === "ice_rock") rockType = "ice";
        else if (item.id === "metal_rock") rockType = "metal";
        rocks.push({ type: rockType, x: ee.x, y: ee.y });
    }
    applyEvolution(ee, targetEvoIdx);
    selectedEevee = null;
}

function onDown(e) {
    e.preventDefault();
    const pos = getCanvasPos(e);
    downPos = { x: pos.x, y: pos.y };

    // 닉네임 입력 모달 열려있으면 무시 (키보드만)
    if (nicknameInputActive) { downPos = null; return; }

    // 스플래시 → (튜토리얼 안 봤으면) 인터랙티브 튜토리얼 → 게임 시작
    if (gameState === "splash") {
        if (!tutorialSeen) {
            startTutorial();
            downPos = null;
            return;
        }
        gameState = "wave_interval";
        waveIntervalTimer = 0;
        downPos = null;
        return;
    }

    // 튜토리얼: 마지막 단계 탭 또는 스킵 버튼
    if (gameState === "tutorial") {
        // 스킵 버튼 (우측 하단)
        if (hitRect(pos, { x: CW - 80, y: CH - 50, w: 70, h: 32 })) {
            endTutorial();
            downPos = null;
            return;
        }
        // 마지막 단계 탭
        if (tutorialStep === 4) {
            endTutorial();
            downPos = null;
            return;
        }
        // 그 외 단계는 평소 입력 처리 (이브이 선택/드래그 등)
    }

    if (gameState === "gameover") {
        // 닉네임 입력 모달이 떠있으면 무시
        if (nicknameInputActive) return;
        // 점수 미제출 시 닉네임 입력 모달 표시
        if (!scoreSubmitted && wave > 0) {
            nicknameInputActive = true;
            nicknameInput = "";
            return;
        }
        // 재시작
        monsters.length = 0; projectiles.length = 0; waveSpawnQueue.length = 0;
        particles.length = 0; hitEffects.length = 0; coinTexts.length = 0;
        eevees.length = 0; rocks.length = 0; skillEffects.length = 0;
        inventory.clear();
        coins = 50; eeveesBought = 0; bossKillCount = 0;
        selectedEevee = null; selectedMonster = null; selectedItem = null; selectedRock = null;
        wave = 0; gameState = "wave_interval"; waveIntervalTimer = WAVE_INTERVAL;
        overflowActive = false; overflowTimer = 0;
        scoreSubmitted = false;
        spawnEevee("이브이.png", 5, 70, 110, "normal");
        return;
    }

    // 바위 드래그 시작 (이브이보다 우선순위 낮음 - 이브이가 위에 있을 수 있음)
    // 이브이 드래그 시작 (선택도 같이)
    for (let i = eevees.length - 1; i >= 0; i--) {
        const ee = eevees[i];
        const d = Math.sqrt((pos.x - ee.x) ** 2 + (pos.y - ee.y) ** 2);
        if (d < 28) {
            dragging = ee;
            dragOffsetX = ee.x - pos.x;
            dragOffsetY = ee.y - pos.y;
            selectedEevee = ee;
            selectedMonster = null;
            selectedItem = null;
            // 튜토리얼 드래그 시작 위치 기록
            if (gameState === "tutorial") {
                tutorialDragStart = { x: ee.x, y: ee.y };
            }
            return;
        }
    }
    // 바위 드래그
    for (let i = rocks.length - 1; i >= 0; i--) {
        const r = rocks[i];
        const d = Math.sqrt((pos.x - r.x) ** 2 + (pos.y - r.y) ** 2);
        if (d < 25) {
            dragging = r;
            dragOffsetX = r.x - pos.x;
            dragOffsetY = r.y - pos.y;
            return;
        }
    }
}

function onMove(e) {
    e.preventDefault();
    if (!dragging) return;
    const pos = getCanvasPos(e);
    let nx = pos.x + dragOffsetX, ny = pos.y + dragOffsetY;

    // 판매 영역 위에 있으면 클램프 무시 (이브이만 판매 가능, 바위 제외)
    const isEevee = eevees.includes(dragging);
    const inSellZone = isEevee && hitRect({x: nx, y: ny}, SELL_ZONE);

    if (!inSellZone) {
        const dx = nx - FARM_CX, dy = ny - FARM_CY;
        const normDist = Math.sqrt((dx / FARM_RADIUS) ** 2 + (dy / (FARM_RADIUS * ISO_Y)) ** 2);
        if (normDist > 1) {
            const margin = 1 - 14 / FARM_RADIUS;
            const scale = margin / normDist;
            nx = FARM_CX + dx * scale;
            ny = FARM_CY + dy * scale;
        }
    }
    dragging.x = nx; dragging.y = ny;
}

function onUp(e) {
    const wasDragging = dragging;
    // 판매 영역 위에서 떨어졌는지 체크
    if (wasDragging && eevees.includes(wasDragging) && hitRect({x: wasDragging.x, y: wasDragging.y}, SELL_ZONE)) {
        sellEevee(wasDragging);
        dragging = null;
        downPos = null;
        return;
    }
    dragging = null;

    if (!downPos) return;
    const pos = getCanvasPos(e.changedTouches ? e : e);
    // 터치엔드는 좌표가 없을 수 있으므로 downPos 활용
    let upPos;
    try { upPos = e.changedTouches ? getCanvasPos({ touches: [], clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY, touches: [e.changedTouches[0]] }) : pos; }
    catch(_) { upPos = downPos; }

    const moveDist = Math.sqrt((upPos.x - downPos.x) ** 2 + (upPos.y - downPos.y) ** 2);
    downPos = null;
    if (moveDist > 12) return; // 드래그였음, 탭 아님
    // 짧게 움직인 드래그 → onDown에서 이미 선택됐으므로 토글하지 않고 유지
    if (wasDragging) return;

    // === 탭 처리 ===
    const tap = upPos;

    // 1. 상점 패널 클릭 (선택된 이브이가 기본 이브이일 때)
    if (selectedEevee && selectedEevee.sprite === "이브이.png" && tap.y >= EVO_PANEL_Y && tap.y <= EVO_PANEL_Y + EVO_PANEL_H) {
        const totalW = currentVisibleShop.length * EVO_ICON_W;
        const startX = CW / 2 - totalW / 2;
        const idx = Math.floor((tap.x - startX) / EVO_ICON_W);
        if (idx >= 0 && idx < currentVisibleShop.length) {
            buyShopItem(selectedEevee, currentVisibleShop[idx].id);
            return;
        }
    }

    // 2. 레벨업 버튼 (선택된 이브이가 있을 때)
    if (selectedEevee && hitRect(tap, LVL_BTN)) {
        levelUpEevee(selectedEevee);
        return;
    }

    // 3. 이브이 구매 버튼
    if (hitRect(tap, BUY_BTN)) {
        buyEevee();
        return;
    }

    // 3-0. 리더보드 버튼
    if (hitRect(tap, LB_BTN)) {
        showLeaderboard = !showLeaderboard;
        if (showLeaderboard) fetchRanking();
        return;
    }
    // 리더보드 팝업이 열려있으면 팝업 영역 외부 탭 시 닫기
    if (showLeaderboard) {
        const popX = CW / 2 - 170, popY = 80, popW = 340, popH = 480;
        if (!(tap.x >= popX && tap.x <= popX + popW && tap.y >= popY && tap.y <= popY + popH)) {
            showLeaderboard = false;
        }
        return;
    }

    // 3-1. 라운드 클리어 시 화면 아무데나 탭 → 즉시 다음 라운드
    if (isRoundClear() && tap.y < BAR_Y && tap.y > 50 && !hitRect(tap, BUY_BTN)) {
        waveTimer = 0;
        return;
    }

    // 4. 인벤토리 아이템 클릭 (좌측 상단)
    if (inventory.size > 0) {
        const itemSize = 26, itemGap = 4;
        let ix = 10, iy = 48;
        for (const it of ITEMS) {
            if (!inventory.has(it.id)) continue;
            if (hitRect(tap, { x: ix, y: iy, w: itemSize, h: itemSize })) {
                selectedItem = (selectedItem === it.id) ? null : it.id;
                selectedEevee = null; selectedMonster = null;
                return;
            }
            ix += itemSize + itemGap;
            if (ix > CW - 130) { ix = 10; iy += itemSize + itemGap; }
        }
    }

    // 5. 이브이 선택/해제
    let foundEe = null;
    for (let i = eevees.length - 1; i >= 0; i--) {
        const ee = eevees[i];
        const d = Math.sqrt((tap.x - ee.x) ** 2 + (tap.y - ee.y) ** 2);
        if (d < 28) { foundEe = ee; break; }
    }
    if (foundEe) {
        selectedEevee = (selectedEevee === foundEe) ? null : foundEe;
        selectedMonster = null; selectedItem = null;
        return;
    }

    // 6. 몬스터 선택
    let foundMon = null;
    for (let i = monsters.length - 1; i >= 0; i--) {
        const m = monsters[i];
        if (m.hp <= 0) continue;
        const d = Math.sqrt((tap.x - m.x) ** 2 + (tap.y - m.y) ** 2);
        if (d < 28) { foundMon = m; break; }
    }
    if (foundMon) {
        selectedMonster = (selectedMonster === foundMon) ? null : foundMon;
        selectedEevee = null; selectedItem = null; selectedRock = null;
        return;
    }

    // 7. 바위 선택
    let foundRock = null;
    for (let i = rocks.length - 1; i >= 0; i--) {
        const r = rocks[i];
        const d = Math.sqrt((tap.x - r.x) ** 2 + (tap.y - r.y) ** 2);
        if (d < 25) { foundRock = r; break; }
    }
    if (foundRock) {
        selectedRock = (selectedRock === foundRock) ? null : foundRock;
        selectedEevee = null; selectedMonster = null; selectedItem = null;
        return;
    }

    // 빈 곳 탭 → 모두 해제
    if (tap.y < BAR_Y) {
        selectedEevee = null;
        selectedMonster = null;
        selectedItem = null;
        selectedRock = null;
    }
}

function getUpPos(e) {
    if (e.changedTouches && e.changedTouches.length > 0) {
        const t = e.changedTouches[0];
        const rect = canvas.getBoundingClientRect();
        return { x: (t.clientX - rect.left) * CW / rect.width, y: (t.clientY - rect.top) * CH / rect.height };
    }
    return getCanvasPos(e);
}

canvas.addEventListener("mousedown", onDown);
canvas.addEventListener("mousemove", onMove);
canvas.addEventListener("mouseup", (e) => { onUp(e); });
canvas.addEventListener("touchstart", onDown, { passive: false });
canvas.addEventListener("touchmove", onMove, { passive: false });
canvas.addEventListener("touchend", (e) => { e.preventDefault(); onUp(e); });

// ═══════════════════════════════════════════
// 치트 (개발용)
// ═══════════════════════════════════════════
let cheatBuffer = "";
window.addEventListener("keydown", (e) => {
    // 닉네임 입력 모드
    if (nicknameInputActive) {
        e.preventDefault();
        if (e.key === "Enter") {
            if (nicknameInput.trim()) {
                const nick = nicknameInput.trim().slice(0, 12);
                submitScore(nick, wave, countEvolved());
                scoreSubmitted = true;
                nicknameInputActive = false;
            }
        } else if (e.key === "Escape") {
            nicknameInputActive = false;
        } else if (e.key === "Backspace") {
            nicknameInput = nicknameInput.slice(0, -1);
        } else if (e.key.length === 1 && nicknameInput.length < 12) {
            nicknameInput += e.key;
        }
        return;
    }

    cheatBuffer += e.key.toLowerCase();
    if (cheatBuffer.length > 20) cheatBuffer = cheatBuffer.slice(-20);

    // 단축키
    if (e.key === "g" || e.key === "G") {
        coins += 100;
        coinTexts.push({ x: CW / 2, y: 100, text: "+100", life: 50, color: "#FFD700" });
    } else if (e.key === "G".toLowerCase() && e.shiftKey) {
        coins += 1000;
        coinTexts.push({ x: CW / 2, y: 100, text: "+1000", life: 50, color: "#FFD700" });
    } else if (e.key === "n" || e.key === "N") {
        // 다음 라운드 강제
        waveTimer = 0;
    } else if (e.key === "k" || e.key === "K") {
        // 모든 몬스터 즉사
        for (const m of monsters) m.hp = 0;
    } else if (e.key === "l" || e.key === "L") {
        // 선택된 이브이 레벨업 무료
        if (selectedEevee) {
            selectedEevee.level++;
            selectedEevee.atk = Math.max(1, Math.floor(selectedEevee.baseAtk * lvAtkMul(selectedEevee.level)));
            if (selectedEevee.baseSpAtk) selectedEevee.spAtk = Math.max(1, Math.floor(selectedEevee.baseSpAtk * lvAtkMul(selectedEevee.level)));
            selectedEevee.atkSpeed = Math.max(8, Math.floor(selectedEevee.baseAtkSpeed * lvSpdMul(selectedEevee.level)));
            selectedEevee.range = Math.floor(selectedEevee.baseRange * lvRangeMul(selectedEevee.level));
        }
    } else if (e.key === "i" || e.key === "I") {
        // 모든 아이템 획득
        for (const it of ITEMS) inventory.add(it.id);
    } else if (e.key === "t" || e.key === "T") {
        // 튜토리얼 다시 보기
        try { localStorage.removeItem("eevee2_tutorial_seen"); } catch(_) {}
        tutorialSeen = false;
    }
});

// ═══════════════════════════════════════════
// 메인 루프
// ═══════════════════════════════════════════
// 60FPS 고정 루프 (고주사율 모니터에서도 동일 속도 보장)
const FRAME_DT = 1000 / 60;
let lastTime = performance.now();
let accumulator = 0;

function loop(now) {
    if (imagesLoaded < totalImages) {
        ctx.fillStyle = "#0a0f0a"; ctx.fillRect(0, 0, CW, CH);
        ctx.fillStyle = "#fff"; ctx.font = "16px system-ui";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(`로딩 중... ${imagesLoaded}/${totalImages}`, CW / 2, CH / 2);
        lastTime = now;
        requestAnimationFrame(loop); return;
    }

    const delta = Math.min(now - lastTime, 250); // 큰 갭 방지(탭 비활성 등)
    lastTime = now;
    accumulator += delta;

    let steps = 0;
    while (accumulator >= FRAME_DT && steps < 5) {
        update();
        accumulator -= FRAME_DT;
        steps++;
    }

    draw();
    requestAnimationFrame(loop);
}
fetchRanking();
requestAnimationFrame(loop);
</script>
