const ISO_SCALE_Y = 0.5;
const ISO_OFFSET_Y = -40; // shift farm up a bit so walls are visible

function toIso(gx, gy) {
    const dx = gx - FARM_CX;
    const dy = gy - FARM_CY;
    return {
        x: FARM_CX + (dx - dy) * 0.866,
        y: FARM_CY + (dx + dy) * 0.5 * ISO_SCALE_Y + ISO_OFFSET_Y
    };
}

function fromIso(sx, sy) {
    const rx = sx - FARM_CX;
    const ry = (sy - FARM_CY - ISO_OFFSET_Y) / ISO_SCALE_Y;
    return {
        x: FARM_CX + (rx / 0.866 + ry) / 2,
        y: FARM_CY + (ry - rx / 0.866) / 2
    };
}

// Convert a game-space circle to isometric diamond points
function isoCirclePoints(cx, cy, radius, segments) {
    const pts = [];
    for (let i = 0; i < segments; i++) {
        const a = (i / segments) * Math.PI * 2;
        const gx = cx + Math.cos(a) * radius;
        const gy = cy + Math.sin(a) * radius;
        pts.push(toIso(gx, gy));
    }
    return pts;
}

    let r = ee.range * (hasItem("wide") ? 1.15 : 1);

    return r;
}
function getEeveeAtkSpeed(ee) {
    let s = ee.atkSpeed * (hasItem("claw") ? 0.85 : 1);
    if (ee.boostBuff > 0) s *= 0.65;
    return Math.max(4, Math.floor(s));
}
function getEeveeAtk(ee) {
    let v = ee.atk;
    if (ee.boostBuff > 0) v *= 1.5;
    // 강철바위 주변 +10%
    const metalR = getRockBuffRadius("metal");
    for (const r of rocks) {
        if (r.type !== "metal") continue;
        const dx = ee.x - r.x, dy = (ee.y - r.y) / ISO_Y;
        if (dx * dx + dy * dy < metalR * metalR) { v *= 1.10; break; }
    }
    return v;
}
function getEeveeSpAtk(ee) {
    let s = (ee.spAtk || 0) * (hasItem("glasses") ? 1.25 : 1);
    if (ee.boostBuff > 0) s *= 1.5;
    return s;
}
// 바위 종류별 추가 반경 보너스 (리피아 → 이끼, 글레이시아 → 얼음, 메탈리아 → 강철)
function getRockExtraBonus(rockType) {
    let bonus = 0;
    let targetSprite;
    if (rockType === "moss") targetSprite = "리피아.png";
    else if (rockType === "ice") targetSprite = "글레이시아.png";
    else if (rockType === "metal") targetSprite = "이브이강철.png";
    if (!targetSprite) return 0;
    for (const ee of eevees) {
        if (ee.sprite === targetSprite) {
            bonus += (ee.level - 1) * 0.05;
        }
    }
    return bonus;
}
function getRockBuffRadius(rockType)  {
    let r = ROCK_BUFF_RADIUS * (hasItem("clay") ? 1.5 : 1);
    if (rockType) r *= (1 + getRockExtraBonus(rockType));
    return r;
}

function typeMul(atkType, defType) {
    if (!atkType || !defType) return 1;
    if (atkType === "normal" || defType === "normal") return 1; // 노멀은 항상 1배
    const row = TYPE_CHART[atkType];
    if (!row) return 1;
    const v = row[defType];
    if (v === undefined) return 1;
    if (v >= 2) return hasItem("belt") ? 1.4 : 1.2;   // 효과적 (달인의띠)
    if (v <= 0.5) return hasItem("focus") ? 1.0 : 0.8; // 별로 (초점렌즈로 무시)
    return 1;
}

// 듀얼 타입 종합 배율 (target.types 또는 target.type 사용)
function totalTypeMul(atkType, target) {
    if (!target) return 1;
    if (target.types && target.types.length > 0) {
        let m = 1;
        for (const t of target.types) m *= typeMul(atkType, t);
        return m;
    }
    return typeMul(atkType, target.type);
}

// 스킬 이펙트 (시각 효과)
const skillEffects = []; // {type, x, y, life, maxLife, color, radius}

function applySkillDamage(target, ee, skill, isSpec) {
    if (!target || target.hp <= 0) return;
    const baseAtk = isSpec ? getEeveeSpAtk(ee) : ee.atk;
    const defStat = getMonsterDef(target, isSpec);
    const baseDmg = Math.max(1, baseAtk * skill.mul - defStat * 0.3);
    const mul = totalTypeMul(ee.type, target);
    const dmg = Math.max(1, Math.round(baseDmg * mul));
    const wasAlive = target.hp > 0;
    target.hp -= dmg;
    if (wasAlive && target.hp <= 0 && ee) {
        ee.kills = (ee.kills || 0) + 1;
        ee.killNames = ee.killNames || {};
        ee.killNames[target.name] = (ee.killNames[target.name] || 0) + 1;
    }
    target.hitAnim = 8;

    // 스플래시 (single/melee/dash/chain만, aoe 제외)
    if (skill.effect !== "aoe" && skill.splashRadius !== 0) {
        const splashR = skill.splashRadius || 25;
        const splashMul = 0.4;
        for (const m of monsters) {
            if (m === target || m.hp <= 0) continue;
            const dx = m.x - target.x, dy = (m.y - target.y) / ISO_Y;
            if (dx * dx + dy * dy < splashR * splashR) {
                const sDef = getMonsterDef(m, isSpec);
                const sBase = Math.max(1, baseAtk * skill.mul * splashMul - sDef * 0.3);
                const sMul = totalTypeMul(ee.type, m);
                const sDmg = Math.max(1, Math.round(sBase * sMul));
                const sWasAlive = m.hp > 0;
                m.hp -= sDmg;
                m.hitAnim = 6;
                if (sWasAlive && m.hp <= 0 && ee) {
                    ee.kills = (ee.kills || 0) + 1;
                    ee.killNames = ee.killNames || {};
                    ee.killNames[m.name] = (ee.killNames[m.name] || 0) + 1;
                }
            }
        }
        // 작은 스플래시 링 이펙트
        skillEffects.push({ type:"shockwave", x: target.x, y: target.y, life: 14, maxLife: 14, color: skill.color, radius: splashR + 5 });
    }
    // 상태이상 발동 확률
    if (skill.status && Math.random() < (skill.statusChance || 0)) {
        applyStatus(target, skill.status, {
            duration: skill.statusDur || 120,
            dmg: skill.statusDmg || 0,
        });
    }
    // 효과 표시
    if (mul > 1) coinTexts.push({ x: target.x, y: target.y - 20, text: "효과적!", life: 35, color: "#FFEB3B" });
    else if (mul < 1) coinTexts.push({ x: target.x, y: target.y - 20, text: "별로...", life: 35, color: "#9E9E9E" });
    // 피격 파티클
    for (let k = 0; k < 4; k++) {
        const a = Math.random() * Math.PI * 2;
        particles.push({
            x: target.x, y: target.y,
            vx: Math.cos(a) * 2, vy: Math.sin(a) * 2 - 1,
            color: skill.color, life: 18, maxLife: 18,
            size: 2 + Math.random() * 2,
        });
    }
}

    const radius = 150;
    const buffDur = 600; // 10초
    let buffed = 0;
    for (const ee of eevees) {
        const dx = ee.x - caster.x, dy = (ee.y - caster.y) / ISO_Y;
        if (dx * dx + dy * dy < radius * radius) {
            // 스킬 쿨다운 초기화
            if (ee.skill1Cd) ee.skill1Cd = 0;
            if (ee.skill2Cd) ee.skill2Cd = 0;
            // 버프 적용
            ee.boostBuff = buffDur;
            buffed++;
        }

    // 시각 이펙트
    skillEffects.push({ type:"aoe", x: caster.x, y: caster.y, life: 50, maxLife: 50, color: "#FFD700", radius: radius });
    skillEffects.push({ type:"shockwave", x: caster.x, y: caster.y, life: 35, maxLife: 35, color: "#FFEB3B", radius: radius * 1.1 });

}

function castSkill(ee, target, skill, isSpec) {
    if (!target) return;

    // 시전자 위 차징 이펙트
    skillEffects.push({ type:"cast", x: ee.x, y: ee.y - 18, life: 20, maxLife: 20, color: skill.color });
    // 스킬 이름 텍스트
    coinTexts.push({ x: ee.x, y: ee.y - 35, text: skill.name, life: 50, color: skill.color });

    if (skill.effect === "single") {
        applySkillDamage(target, ee, skill, isSpec);
        // 큰 폭발 (확장 링)
        skillEffects.push({ type:"burst", x: target.x, y: target.y, life: 30, maxLife: 30, color: skill.color, radius: 28 });
        // 충격파 (작은 링)
        skillEffects.push({ type:"shockwave", x: target.x, y: target.y, life: 22, maxLife: 22, color: skill.color, radius: 40 });
        // 시전자→타겟 광선
        skillEffects.push({ type:"beam", x: ee.x, y: ee.y - 5, x2: target.x, y2: target.y, life: 12, maxLife: 12, color: skill.color });
        // 큰 파티클 분출
        for (let k = 0; k < 12; k++) {
            const a = Math.random() * Math.PI * 2;
            const sp = 1.5 + Math.random() * 3;
            particles.push({
                x: target.x, y: target.y,
                vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5,
                color: skill.color, life: 25 + Math.random() * 15, maxLife: 35,
                size: 2 + Math.random() * 2.5,
            });
        }
    } else if (skill.effect === "melee") {
        // 근접 물기/엄니 - 빔 없음, 타겟 위치에서 강력한 폭발 + 이빨 마크
        applySkillDamage(target, ee, skill, isSpec);
        skillEffects.push({ type:"bite", x: target.x, y: target.y, life: 20, maxLife: 20, color: skill.color });
        skillEffects.push({ type:"burst", x: target.x, y: target.y, life: 22, maxLife: 22, color: skill.color, radius: 22 });
        // 임팩트 파티클
        for (let k = 0; k < 10; k++) {
            const a = Math.random() * Math.PI * 2;
            const sp = 2 + Math.random() * 2.5;
            particles.push({
                x: target.x, y: target.y,
                vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5,
                color: skill.color, life: 22, maxLife: 22,
                size: 2 + Math.random() * 2,
            });
        }
    } else if (skill.effect === "dash") {
        // 돌진 - 시전자에서 타겟까지 잔상 라인 + 임팩트
        applySkillDamage(target, ee, skill, isSpec);
        skillEffects.push({ type:"dashTrail", x: ee.x, y: ee.y - 5, x2: target.x, y2: target.y, life: 18, maxLife: 18, color: skill.color });
        skillEffects.push({ type:"burst", x: target.x, y: target.y, life: 22, maxLife: 22, color: skill.color, radius: 22 });
        for (let k = 0; k < 8; k++) {
            const a = Math.random() * Math.PI * 2;
            particles.push({
                x: target.x, y: target.y,
                vx: Math.cos(a) * 2.5, vy: Math.sin(a) * 2.5 - 1,
                color: skill.color, life: 20, maxLife: 20,
                size: 1.5 + Math.random() * 2,
            });
        }
    } else if (skill.effect === "aoe") {
        const r = skill.aoeRadius || 70;
        for (const m of monsters) {
            if (m.hp <= 0) continue;
            const dx = m.x - target.x, dy = (m.y - target.y) / ISO_Y;
            if (dx * dx + dy * dy < r * r) {
                applySkillDamage(m, ee, skill, isSpec);
            }
        }
        // 메인 광역 (확장 원)
        skillEffects.push({ type:"aoe", x: target.x, y: target.y, life: 40, maxLife: 40, color: skill.color, radius: r });
        // 보조 링 두 개 (다른 속도)
        skillEffects.push({ type:"shockwave", x: target.x, y: target.y, life: 25, maxLife: 25, color: skill.color, radius: r * 1.2 });
        skillEffects.push({ type:"shockwave", x: target.x, y: target.y, life: 18, maxLife: 18, color: skill.color, radius: r * 0.6 });
        // 회오리 파티클
        for (let k = 0; k < 24; k++) {
            const a = (k / 24) * Math.PI * 2;
            const sp = 2 + Math.random() * 2;
            particles.push({
                x: target.x + Math.cos(a) * 10, y: target.y + Math.sin(a) * 10 * ISO_Y,
                vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * ISO_Y - 1,
                color: skill.color, life: 30 + Math.random() * 15, maxLife: 45,
                size: 2 + Math.random() * 2.5,
            });
        }
    } else if (skill.effect === "chain") {
        const range = skill.chainRange || 90;
        const count = skill.chainCount || 3;
        let cur = target;
        const hit = new Set();
        let prevX = ee.x, prevY = ee.y;
        for (let i = 0; i < count && cur; i++) {
            applySkillDamage(cur, ee, skill, isSpec);
            hit.add(cur.id);
            // 체인 번개 라인
            skillEffects.push({ type:"line", x: prevX, y: prevY, x2: cur.x, y2: cur.y, life: 22, maxLife: 22, color: skill.color });
            // 임팩트
            skillEffects.push({ type:"burst", x: cur.x, y: cur.y, life: 18, maxLife: 18, color: skill.color, radius: 18 });
            // 스파크 파티클
            for (let k = 0; k < 6; k++) {
                const a = Math.random() * Math.PI * 2;
                particles.push({
                    x: cur.x, y: cur.y,
                    vx: Math.cos(a) * 2, vy: Math.sin(a) * 2 - 1,
                    color: skill.color, life: 20, maxLife: 20,
                    size: 1.5 + Math.random() * 1.5,
                });
            }
            prevX = cur.x; prevY = cur.y;
            // 다음 타겟
            let next = null, bestD = Infinity;
            for (const m of monsters) {
                if (m.hp <= 0 || hit.has(m.id)) continue;
                const dx = m.x - cur.x, dy = (m.y - cur.y) / ISO_Y;
                const d = dx * dx + dy * dy;
                if (d < range * range && d < bestD) { bestD = d; next = m; }
            }
            cur = next;
        }
    }
}

// 레벨업 배율 (복리)
function lvAtkMul(level)   { return Math.pow(1.16, level - 1); }
function lvSpdMul(level)   { return Math.pow(0.94, level - 1); }
function lvRangeMul(level) { return Math.pow(1.05, level - 1); }

function levelUpEevee(ee) {
    const cost = getLevelUpCost(ee);
    if (coins < cost) return;
    coins -= cost;
    ee.level++;
    // 복리 능력치 상승
    ee.atk = Math.max(1, Math.floor(ee.baseAtk * lvAtkMul(ee.level)));
    if (ee.baseSpAtk) ee.spAtk = Math.max(1, Math.floor(ee.baseSpAtk * lvAtkMul(ee.level)));
    ee.atkSpeed = Math.max(8, Math.floor(ee.baseAtkSpeed * lvSpdMul(ee.level)));
    ee.range = Math.floor(ee.baseRange * lvRangeMul(ee.level));
    // 레벨업 이펙트
    for (let k = 0; k < 12; k++) {

}

function spawnMonster(name, sprite, hp, mDef, sDef, spd, typeOrTypes, isBoss, opts) {
    // typeOrTypes: 문자열 또는 배열
    const types = Array.isArray(typeOrTypes) ? typeOrTypes : [typeOrTypes];
    const dirIdx = Math.floor(Math.random() * 8);
    const dirAngle = (dirIdx / 8) * Math.PI * 2;
    const startDist = Math.max(CW, CH) * 0.7;
    const startX = FARM_CX + Math.cos(dirAngle) * startDist;
    const startY = FARM_CY + Math.sin(dirAngle) * startDist * ISO_Y;
    const m = {
        id: monsterIdCounter++,
        name, sprite, hp, maxHp: hp, mDef, sDef, spd,
        type: types[0], types,
        isBoss: !!isBoss,
        isRaid: opts && opts.isRaid ? true : false,
        phase2Data: opts && opts.phase2 ? opts.phase2 : null,
        phase: "enter",
        x: startX, y: startY,
        entryAngle: dirAngle,
        orbitAngle: 0,
        hitAnim: 0,
        deathAnim: 0,
        statuses: {},
    };
    monsters.push(m);
    return m;
}

// ═══════════════════════════════════════════
// 상태이상 시스템
// ═══════════════════════════════════════════
function applyStatus(target, type, data) {
    if (!target || target.hp <= 0) return;
    target.statuses = target.statuses || {};
    target.statuses[type] = { ...data };
}

function updateStatuses() {
    for (const m of monsters) {
        if (m.hp <= 0 || !m.statuses) continue;
        for (const key in m.statuses) {
            const s = m.statuses[key];
            s.duration--;
            // DOT 처리 (매 30프레임마다 데미지)
            if ((key === "burn" || key === "poison") && s.duration % 30 === 0) {
                m.hp -= s.dmg;
                m.hitAnim = 4;
                // 작은 파티클
                const c = key === "burn" ? "#FF7043" : "#9C27B0";
                for (let k = 0; k < 2; k++) {
                    const a = Math.random() * Math.PI * 2;
                    particles.push({
                        x: m.x, y: m.y,
                        vx: Math.cos(a) * 1, vy: Math.sin(a) * 1 - 1,
                        color: c, life: 15, maxLife: 15,
                        size: 1.5 + Math.random(),
                    });
                }
            }
            if (s.duration <= 0) delete m.statuses[key];
        }
    }
}

// 몬스터 effective 이동속도 (상태이상 적용)
function getMonsterSpdMul(m) {
    if (!m.statuses) return 1;
    if (m.statuses.paralysis) return 0;  // 마비 = 완전 정지
    if (m.statuses.sleep) return 0;       // 잠듦 = 정지
    if (m.statuses.freeze) return 0.4;    // 빙결 = 느려짐
    return 1;
}

// 몬스터 effective 방어력
function getMonsterDef(m, isSpec) {
    let d = isSpec ? (m.sDef || 0) : (m.mDef || 0);
    if (m.statuses && m.statuses.defDown) d *= 0.7;
    return d;
}

function setupWave(w) {
    waveSpawnQueue = [];

    // 웨이브별 레벨 디자인
    // 초반(진화 전): 매우 약함, 중반(진화 시작): 부드럽게, 후반(풀세팅): 가속
    let waveMul;
    if (w <= 7) {
        waveMul = 0.25 + (w - 1) * 0.06;   // W1:0.25 W4:0.43 W7:0.61
    } else if (w <= 15) {
        waveMul = 0.7 + (w - 8) * 0.12;    // W8:0.7 W12:1.18 W15:1.54
    } else {
        waveMul = 1.7 + (w - 16) * 0.20;   // W16:1.7 W20:2.5 W30:4.5 W40:6.5
    }
    const spdBase = 0.010;
    let count, unlocked;

    // 몬스터 종류 해금: 1웨이브당 1종씩 (W1: 1종, W2: 2종, ... W9+: 9종)
    unlocked = Math.min(w, monPool.length);

    // 마릿수: 부드럽게 증가
    if (w <= 4) {
        count = 2 + w;                   // W1:3 W2:4 W3:5 W4:6
    } else if (w <= 9) {
        count = 6 + w;                   // W5:11 W9:15
    } else if (w <= 20) {
        count = 10 + w;                  // W10:20 W20:30
    } else {
        count = 14 + w;                  // W30:44
    }

    // 레이드 웨이브 (100의 배수) — 페이즈2 변신 보스 단독
    if (w > 0 && w % 100 === 0) {
        const raid = raidPool[Math.floor(Math.random() * raidPool.length)];
        waveSpawnQueue.push({
            name: raid.name, sprite: raid.sprite, types: raid.types,
            hp: Math.floor(raid.baseHp * waveMul * 12),
            mDef: Math.floor(raid.baseMDef * waveMul * 0.25),
            sDef: Math.floor(raid.baseSDef * waveMul * 0.25),
            spd: spdBase * (raid.baseSpd / 100) * 0.4,
            isBoss: true, isRaid: true, phase2: raid.phase2,
            waveMul: waveMul,
            delay: 0,
        });
        count = 0; // 레이드는 단독
    }
    // 보스 웨이브 (10의 배수, 100 제외) — 재앙 4종 중 랜덤 1마리
    else if (w > 0 && w % 10 === 0) {
        const cal = calamityPool[Math.floor(Math.random() * calamityPool.length)];
        waveSpawnQueue.push({
            name: cal.name, sprite: cal.sprite, types: cal.types,
            hp: Math.floor(cal.baseHp * waveMul * 8),
            mDef: Math.floor(cal.baseMDef * waveMul * 0.2),
            sDef: Math.floor(cal.baseSDef * waveMul * 0.2),
            spd: spdBase * (cal.baseSpd / 100) * 0.4,
            isBoss: true,
            delay: 0,
        });
        count = Math.floor(count * 0.4);
    }

    for (let i = 0; i < count; i++) {
        const m = monPool[Math.floor(Math.random() * unlocked)];
        const hpRoll = 0.85 + Math.random() * 0.3;
        waveSpawnQueue.push({
            name: m.name, sprite: m.sprite, types: m.types,
            hp: Math.floor(m.baseHp * waveMul * hpRoll),
            mDef: Math.floor(m.baseMDef * waveMul * 0.12),
            sDef: Math.floor(m.baseSDef * waveMul * 0.12),
            spd: spdBase * (m.baseSpd / 100) * (0.9 + Math.random() * 0.2),
            delay: i * 135 + Math.floor(Math.random() * 25) + (w % 10 === 0 ? 90 : 0),
        });
    }
    waveTimer = getWaveTime(w);
    waveSpawnTimer = 0;
    gameState = "playing";
}

let dragging = null;

function update() {
    frame++;

    // 파티클 업데이트
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = hitEffects.length - 1; i >= 0; i--) {
        hitEffects[i].life--;
        if (hitEffects[i].life <= 0) hitEffects.splice(i, 1);
    }
    for (let i = skillEffects.length - 1; i >= 0; i--) {
        skillEffects[i].life--;
        if (skillEffects[i].life <= 0) skillEffects.splice(i, 1);
    }

    if (gameState === "splash") return;
    if (gameState === "gameover") return;

    // 튜토리얼: 일부 단계에서 시범 몬스터 1마리 등장
    if (gameState === "tutorial") {
        // Step 1~2: 이브이 배회 비활성화 (드래그로만 이동)
        if (tutorialStep <= 1 && eevees[0]) {
            eevees[0].wanderTimer = 9999;
            eevees[0].idleTimer = 9999;
        }
        // Step 3: 시범 몬스터 1마리 (이브이 옆에 등장 + 거의 안 움직임)
        if (tutorialStep === 2 && monsters.length === 0 && !tutorialMobSpawned) {
            const m = spawnMonster("차곡차곡", "mon/차곡차곡.png", 20, 0, 0, 0.001, ["normal"], false);
            // 이브이 사거리 안에 즉시 배치
            const ee = eevees[0];
            if (ee && m) {
                m.phase = "orbit";
                m.x = ee.x + 50;
                m.y = ee.y;
                m.orbitAngle = 0;
            }
            tutorialMobSpawned = true;
        }
    }

    if (gameState === "cutscene") {
        cutsceneTimer--;
        // 컷신: 몬스터들이 농장 안쪽으로 직진 침투
        for (const m of monsters) {
            if (!m.invadeTargetX) {
                // 농장 중심부 랜덤 위치 타겟 지정
                const a = Math.random() * Math.PI * 2;
                const r = Math.random() * (FARM_RADIUS - 40);
                m.invadeTargetX = FARM_CX + Math.cos(a) * r;
                m.invadeTargetY = FARM_CY + Math.sin(a) * r * ISO_Y;
            }
            const dx = m.invadeTargetX - m.x;
            const dy = m.invadeTargetY - m.y;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d > 1) {
                const spd = 1.5;
                m.x += (dx / d) * spd;
                m.y += (dy / d) * spd;
            }
            m.invading = true; // 떨림 애니메이션 트리거
        }
        if (cutsceneTimer <= 0) gameState = "gameover";
        return;
    }

    // 튜토리얼 중엔 웨이브 진행 / 과포화 비활성
    if (gameState !== "tutorial") {

    // 첫 게임 시작 (wave_interval 초기 상태에서 1회만)
    if (gameState === "wave_interval") {
        wave++;
        setupWave(wave);
        // 친밀도 증가 (기본 이브이만)
        for (const ee of eevees) {
            if (ee.sprite === "이브이.png") ee.friendship++;
        }
    }

    waveTimer--;

    // 라운드 시간 종료 → 즉시 다음 라운드 시작
    if (waveTimer <= 0) {
        wave++;
        setupWave(wave);
        for (const ee of eevees) {
            if (ee.sprite === "이브이.png") ee.friendship++;
        }
    }

    // 침입 카운트다운 체크 (몬스터 50+ OR 보스 2+)
    const aliveMons = monsters.filter(m => m.hp > 0);
    const monsterCount = aliveMons.length;
    const bossCount = aliveMons.filter(m => m.isBoss).length;
    const overflowTriggered = monsterCount >= OVERFLOW_LIMIT || bossCount >= 2;
    if (overflowTriggered) {
        if (!overflowActive) {
            overflowActive = true;
            overflowTimer = OVERFLOW_COUNTDOWN;
            overflowReason = bossCount >= 2 ? "boss" : "overflow";
        } else {
            overflowTimer--;
            if (overflowTimer <= 0) {
                gameState = "cutscene";
                cutsceneTimer = 180;
                return;
            }
        }
    } else {
        overflowActive = false;
        overflowTimer = 0;
    }

    } // end if !tutorial

    // 몬스터 스폰
    waveSpawnTimer++;
    for (let i = waveSpawnQueue.length - 1; i >= 0; i--) {
        if (waveSpawnTimer >= waveSpawnQueue[i].delay) {
            const m = waveSpawnQueue[i];
            spawnMonster(m.name, m.sprite, m.hp, m.mDef || 0, m.sDef || 0, m.spd, m.types || m.type, m.isBoss, { isRaid: m.isRaid, phase2: m.phase2 ? { ...m.phase2, waveMul: m.waveMul } : null });
            waveSpawnQueue.splice(i, 1);
        }
    }

    // 몬스터 이동
    for (const m of monsters) {
        if (m.hitAnim > 0) m.hitAnim--;
        if (m.phase === "enter") {
            // 울퉁불퉁멧: 진입 중 매초 도트 (60프레임마다)
            if (hasItem("helmet") && frame % 60 === 0) {
                const dot = 5 + Math.floor(wave * 0.5);
                m.hp -= dot;
                m.hitAnim = 4;
                coinTexts.push({ x: m.x, y: m.y - 12, text: `-${dot}`, life: 25, color: "#FFAB91" });
            }
            // 진입 각도에 맞춰 궤도 진입점으로 이동
            const targetX = FARM_CX + Math.cos(m.entryAngle) * ORBIT_RADIUS;
            const targetY = FARM_CY + Math.sin(m.entryAngle) * ORBIT_RADIUS * ISO_Y;
            const dx = targetX - m.x, dy = targetY - m.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const enterSpd = 1 + m.spd * 80;
            if (dist > enterSpd) {
                m.x += (dx / dist) * enterSpd;
                m.y += (dy / dist) * enterSpd;
            } else {
                m.phase = "orbit";
                m.orbitAngle = m.entryAngle; // 궤도 시작 각도
            }
        } else {
            // 얼음바위 디버프 (인접 몬스터 속도 -50%)
            let spdMult = 1;
            for (const r of rocks) {
                if (r.type !== "ice") continue;
                const iceR = getRockBuffRadius("ice");
                const dxR = m.x - r.x, dyR = (m.y - r.y) / ISO_Y;
                if (dxR * dxR + dyR * dyR < iceR * iceR) {
                    spdMult = 0.5;
                    break;
                }
            }
            // 상태이상 효과
            spdMult *= getMonsterSpdMul(m);
            m.orbitAngle += m.spd * spdMult;
            m.x = FARM_CX + Math.cos(m.orbitAngle) * ORBIT_RADIUS;
            m.y = FARM_CY + Math.sin(m.orbitAngle) * ORBIT_RADIUS * ISO_Y;
        }
    }

    // 상태이상 갱신 (DOT, 지속시간)
    updateStatuses();

    // 이브이 AI
    for (const ee of eevees) {
        ee.animTimer++;
        if (ee.boostBuff > 0) ee.boostBuff--;
        if (ee === dragging) continue;

        // --- 타겟 탐색 (사정거리 1.5배 이내만) ---
        const detectRange = getEeveeRange(ee) * 1.5;
        let target = null, bestDist = Infinity;
        for (const m of monsters) {
            if (m.hp <= 0) continue;
            const d = Math.sqrt((m.x - ee.x) ** 2 + ((m.y - ee.y) / ISO_Y) ** 2);
            if (d > detectRange) continue;
            if (d < bestDist) { bestDist = d; target = m; }
        }
        ee.targetId = target ? target.id : null;

        const effRange = getEeveeRange(ee);
        const effSpd = getEeveeAtkSpeed(ee);

        // --- 스킬 쿨다운 감소 (매 프레임) ---
        if (ee.skill1Cd > 0) ee.skill1Cd--;
        if (ee.skill2Cd > 0) ee.skill2Cd--;

        // --- 공격 (평타 발동 시점에 스킬 발동도 체크) ---
        if (ee.atkCooldown > 0) ee.atkCooldown--;
        if (target && ee.atkCooldown <= 0) {
            const d = Math.sqrt((target.x - ee.x) ** 2 + ((target.y - ee.y) / ISO_Y) ** 2);
            if (d <= effRange) {
                // 평타 데미지 (예리한이빨 크리)
                let atkVal = getEeveeAtk(ee);
                if (hasItem("fang") && Math.random() < 0.15) atkVal = Math.floor(atkVal * 1.8);
                fireProjectile(ee.x, ee.y - 5, target.id, atkVal, ee.bulletType, ee.category || "phys", ee.type || "normal", ee);
                // 겨냥표적 더블샷
                if (hasItem("target") && Math.random() < 0.3) {
                    fireProjectile(ee.x, ee.y - 5, target.id, atkVal, ee.bulletType, ee.category || "phys", ee.type || "normal", ee);
                }
                ee.atkCooldown = effSpd;
                ee.facing = target.x > ee.x ? 1 : -1;

                // 스킬 발동 (평타 시 10% 확률, 쿨다운 + 레벨 조건)
                if (ee.skill1 && ee.level >= 5 && ee.skill1Cd <= 0 && Math.random() < 0.10) {
                    castSkill(ee, target, ee.skill1, false);
                    ee.skill1Cd = ee.skill1.cd;
                }
                if (ee.skill2 && ee.level >= 10 && ee.skill2Cd <= 0 && Math.random() < 0.10) {
                    castSkill(ee, target, ee.skill2, true);
                    ee.skill2Cd = ee.skill2.cd;
                }
            }
        }

        // --- 나인이볼부스트 (기본 이브이 Lv50, 패시브 발동) ---
        if (ee.sprite === "이브이.png" && ee.level >= 50) {
            if (ee.boostCd === undefined) ee.boostCd = 600;
            if (ee.boostCd > 0) ee.boostCd--;
            if (ee.boostCd <= 0 && Math.random() < 0.02) {
                castNineEvolveBoost(ee);
                ee.boostCd = 1200; // 20초 쿨
            }
        }

        // --- 이동 ---
        // 공격 중(사거리 내 타겟)이면 멈춤
        if (target && bestDist <= effRange) continue;

        // 이끼바위 버프 (인접 이브이 이동속도 +50%)
        let mossBuff = 1;
        const mossR = getRockBuffRadius("moss");
        for (const r of rocks) {
            if (r.type !== "moss") continue;
            const dxR = ee.x - r.x, dyR = (ee.y - r.y) / ISO_Y;
            if (dxR * dxR + dyR * dyR < mossR * mossR) {
                mossBuff = 1.5;
                break;
            }
        }

        // 타겟이 있지만 사거리 밖 → 추적
        if (target) {
            const chaseX = target.x, chaseY = target.y;
            const cdx = chaseX - ee.x, cdy = chaseY - ee.y;
            const cdist = Math.sqrt(cdx * cdx + cdy * cdy);
            if (cdist > 3) {
                const spd = ee.moveSpeed * 1.3 * mossBuff;
                ee.x += (cdx / cdist) * spd;
                ee.y += (cdy / cdist) * spd;
                if (cdx > 0.5) ee.facing = 1;
                else if (cdx < -0.5) ee.facing = -1;
            }
            ee.wanderTimer = 0;
            ee.idleTimer = 0;
        } else if (ee.idleTimer > 0) {
            // 대기
            ee.idleTimer--;
        } else {
            // 배회
            const dxW = ee.wanderX - ee.x, dyW = ee.wanderY - ee.y;
            const distW = Math.sqrt(dxW * dxW + dyW * dyW);

            if (ee.wanderTimer <= 0 || distW < 3) {
                const wa = Math.random() * Math.PI * 2;
                const wr = Math.random() * (FARM_RADIUS - 30);
                ee.wanderX = FARM_CX + Math.cos(wa) * wr;
                ee.wanderY = FARM_CY + Math.sin(wa) * wr * ISO_Y;
                ee.wanderTimer = 120 + Math.floor(Math.random() * 180);
                ee.idleTimer = 30 + Math.floor(Math.random() * 90);
            } else {
                ee.x += (dxW / distW) * ee.moveSpeed * mossBuff;
                ee.y += (dyW / distW) * ee.moveSpeed * mossBuff;
                ee.wanderTimer--;
                if (dxW > 0.5) ee.facing = 1;
                else if (dxW < -0.5) ee.facing = -1;
            }
        }

        // 농장 경계 클램프
        const edx = ee.x - FARM_CX, edy = ee.y - FARM_CY;
        const normD = Math.sqrt((edx / FARM_RADIUS) ** 2 + (edy / (FARM_RADIUS * ISO_Y)) ** 2);
        if (normD > 0.85) {
            const s = 0.85 / normD;
            ee.x = FARM_CX + edx * s;
            ee.y = FARM_CY + edy * s;
            ee.wanderTimer = 0;
        }
    }

    // 이브이끼리 충돌 분리 (드래그 중인 이브이 제외) — 2프레임마다 1회
    if (frame % 2 === 0) {
    const minDist = 26;
    for (let i = 0; i < eevees.length; i++) {
        const a = eevees[i];
        for (let j = i + 1; j < eevees.length; j++) {
            const b = eevees[j];
            const dx = b.x - a.x, dy = b.y - a.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < minDist && dist > 0.001) {
                const overlap = (minDist - dist) / 2;
                const nx = dx / dist, ny = dy / dist;
                if (a !== dragging) { a.x -= nx * overlap; a.y -= ny * overlap; }
                if (b !== dragging) { b.x += nx * overlap; b.y += ny * overlap; }
            } else if (dist < 0.001) {
                // 완전히 같은 위치 → 랜덤 방향으로 살짝 밀기
                if (b !== dragging) {
                    b.x += (Math.random() - 0.5) * 4;
                    b.y += (Math.random() - 0.5) * 4;
                }
            }
        }
    }
    } // end if frame%2

    // 투사체 이동
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.life--;
        if (p.life <= 0) { projectiles.splice(i, 1); continue; }

        const target = monsters.find(m => m.id === p.targetId && m.hp > 0);
        if (!target) { projectiles.splice(i, 1); continue; }

        const dx = target.x - p.x, dy = target.y - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        p.angle = Math.atan2(dy, dx);

        p.trail.push({ x: p.x, y: p.y, life: 8 });
        if (p.trail.length > 6) p.trail.shift();
        for (const t of p.trail) t.life--;

        if (dist < 10) {
            // 카테고리별 방어력 (defDown 상태이상 반영)
            const defStat = getMonsterDef(target, p.category === "spec");
            const baseDmg = Math.max(1, p.atk - defStat * 0.3);
            // 타입 상성
            const mul = totalTypeMul(p.attackerType, target);
            const dmg = Math.max(1, Math.round(baseDmg * mul));
            const wasAlive = target.hp > 0;
            target.hp -= dmg;
            // 라스트힛 카운트
            if (wasAlive && target.hp <= 0 && p.attackerEe) {
                p.attackerEe.kills = (p.attackerEe.kills || 0) + 1;
                p.attackerEe.killNames = p.attackerEe.killNames || {};
                p.attackerEe.killNames[target.name] = (p.attackerEe.killNames[target.name] || 0) + 1;
            }
            // 효과 표시
            if (mul > 1) {
                coinTexts.push({ x: target.x, y: target.y - 20, text: "효과적!", life: 35, color: "#FFEB3B" });
            } else if (mul < 1) {
                coinTexts.push({ x: target.x, y: target.y - 20, text: "별로...", life: 35, color: "#9E9E9E" });
            }
            target.hitAnim = 8;
            const bt = BULLET_TYPES[p.bulletType] || BULLET_TYPES.normal;
            hitEffects.push({ x: target.x, y: target.y, color: bt.glow, life: 12, maxLife: 12 });
            for (let k = 0; k < 4; k++) {
                const a = Math.random() * Math.PI * 2;
                particles.push({
                    x: target.x, y: target.y,
                    vx: Math.cos(a) * (1 + Math.random() * 2),
                    vy: Math.sin(a) * (1 + Math.random() * 2) - 1,
                    color: bt.color, life: 15 + Math.random() * 10, maxLife: 25,
                    size: 2 + Math.random() * 2,
                });
            }
            projectiles.splice(i, 1);
            continue;
        }
        p.x += (dx / dist) * p.speed;
        p.y += (dy / dist) * p.speed;
    }

    // 몬스터 사망
    for (let i = monsters.length - 1; i >= 0; i--) {
        if (monsters[i].hp <= 0) {
            const m = monsters[i];

            // === 레이드 페이즈 1 → 페이즈 2 변신 ===
            if (m.isRaid && m.phase2Data && !m.transformed) {
                const p2 = m.phase2Data;
                const wm = p2.waveMul || 1;
                m.transformed = true;
                m.name = p2.name;
                m.sprite = p2.sprite;
                m.types = p2.types;
                m.type = p2.types[0];
                m.hp = Math.floor(p2.baseHp * wm * 12);
                m.maxHp = m.hp;
                m.mDef = Math.floor(p2.baseMDef * wm * 0.25);
                m.sDef = Math.floor(p2.baseSDef * wm * 0.25);
                m.spd = 0.010 * (p2.baseSpd / 100) * 0.4;
                m.statuses = {};
                // 변신 이펙트
                coinTexts.push({ x: m.x, y: m.y - 35, text: `${p2.name} 변신!`, life: 90, color: "#E91E63" });
                skillEffects.push({ type:"aoe", x: m.x, y: m.y, life: 60, maxLife: 60, color: "#E91E63", radius: 100 });
                skillEffects.push({ type:"shockwave", x: m.x, y: m.y, life: 40, maxLife: 40, color: "#fff", radius: 120 });
                for (let k = 0; k < 40; k++) {
                    const a = Math.random() * Math.PI * 2;
                    const sp = 2 + Math.random() * 4;
                    particles.push({
                        x: m.x, y: m.y,
                        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
                        color: "#E91E63", life: 50, maxLife: 50,
                        size: 3 + Math.random() * 3,
                    });
                }
                continue;
            }

            // 보스 카운트
            if (m.isBoss) bossKillCount++;
            // 코인 보상
            let reward;
            if (m.isRaid) reward = 150 + wave * 20;
            else if (m.isBoss) reward = 60 + wave * 12;
            else reward = 6 + Math.floor(wave * 1.0);
            coins += reward;
            coinTexts.push({ x: m.x, y: m.y - 15, text: `+${reward}`, life: 50 });

            // 보스/레이드 처치 시 아이템 드롭 (레이드는 100%, 보스는 25%)
            const dropChance = m.isRaid ? 1.0 : (m.isBoss ? BOSS_DROP_RATE : 0);
            if (dropChance > 0 && Math.random() < dropChance) {
                const unowned = ITEMS.filter(it => !inventory.has(it.id));
                if (unowned.length > 0) {
                    const drop = unowned[Math.floor(Math.random() * unowned.length)];
                    inventory.add(drop.id);
                    coinTexts.push({ x: m.x, y: m.y - 35, text: `${drop.name} 획득!`, life: 90, color: "#FFEB3B" });
                    for (let k = 0; k < 20; k++) {
                        const a = Math.random() * Math.PI * 2;
                        particles.push({
                            x: m.x, y: m.y,
                            vx: Math.cos(a) * 3, vy: Math.sin(a) * 3 - 2,
                            color: "#FFD700", life: 50, maxLife: 50,
                            size: 2 + Math.random() * 2,
                        });
                    }
                }
            }
            // 사망 파티클
            for (let k = 0; k < 8; k++) {
                const a = Math.random() * Math.PI * 2;
                particles.push({
                    x: m.x, y: m.y,
                    vx: Math.cos(a) * (1.5 + Math.random() * 2),
                    vy: Math.sin(a) * (1.5 + Math.random() * 2) - 1,
                    color: "#FF8A65", life: 20 + Math.random() * 15, maxLife: 35,
                    size: 3 + Math.random() * 3,
                });
            }
            monsters.splice(i, 1);
        }
    }

    // 튜토리얼 단계 진행 체크
    if (gameState === "tutorial") {
        // Step 3+ 부터는 이브이가 항상 선택되어 있도록 강제
        if (tutorialStep >= 2 && eevees[0]) {
            selectedEevee = eevees[0];
            selectedMonster = null; selectedItem = null; selectedRock = null;
        }
        if (tutorialStep === 0 && selectedEevee) tutorialStep = 1;
        else if (tutorialStep === 1) {
            // 드래그로 일정 거리 이동했는지 (드래그 시작 위치 필요)
            if (eevees[0] && tutorialDragStart) {
                const dx = eevees[0].x - tutorialDragStart.x;
                const dy = eevees[0].y - tutorialDragStart.y;
                if (dx * dx + dy * dy > 30 * 30) tutorialStep = 2;
            }
        }
        else if (tutorialStep === 2 && tutorialMobSpawned && monsters.length === 0) {
            tutorialStep = 3;
            coins = Math.max(coins, 100); // 레벨업 자금 확보
        }
        else if (tutorialStep === 3) {
            if (eevees[0] && eevees[0].level > tutorialPrevLevel) tutorialStep = 4;
        }
    }

    // 코인 텍스트 업데이트
    for (let i = coinTexts.length - 1; i >= 0; i--) {
        coinTexts[i].y -= 0.5;
        coinTexts[i].life--;
        if (coinTexts[i].life <= 0) coinTexts.splice(i, 1);
    }
}

// ═══════════════════════════════════════════
// 렌더링 (아이소메트릭)
// ═══════════════════════════════════════════

// ═══════════════════════════════════════════
// 아이소메트릭 배경 (RPG 스타일 탑뷰)
// ═══════════════════════════════════════════
const BG_TW = 56, BG_TH = Math.round(BG_TW * ISO_Y);

function bgRand(a, b) {
    let n = a * 374761393 + b * 668265263;
    n = ((n ^ (n >> 13)) * 1274126177) | 0;
    return ((n ^ (n >> 16)) & 0x7fffffff) / 0x7fffffff;
}

// 배경을 오프스크린 캔버스에 미리 렌더
const bgCanvas = document.createElement("canvas");
bgCanvas.width = CW;
bgCanvas.height = CH;
const bgCtx = bgCanvas.getContext("2d");

(function renderStaticBG() {
    const ox = CW / 2, oy = -80;
    const rows = 50, cols = 50;
    const farmIso = toIso(FARM_CX, FARM_CY);

    bgCtx.fillStyle = "#4A7A3A";
    bgCtx.fillRect(0, 0, CW, CH);

    // --- 타일 그리기 ---
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const sx = ox + (c - r) * BG_TW / 2;
            const sy = oy + (c + r) * BG_TH / 2;
            if (sx < -BG_TW || sx > CW + BG_TW || sy < -BG_TH || sy > CH + BG_TH) continue;

            const rnd = bgRand(c, r);
            const ri = (c * 7 + r * 13) % 4;
            const dx = sx - farmIso.x;
            const dy = (sy - farmIso.y) * 1.8;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const edgeDist = Math.min(sx + 30, CW - sx + 30, sy + 50, CH - sy + 30);

            let fill, stroke;

            if (edgeDist < 30) {
                // 절벽 타일 — 측면 벽 먼저 그리기
                const cliffH = 12 + (30 - edgeDist) * 0.6;
                bgCtx.fillStyle = "#5E503E";
                bgCtx.beginPath();
                bgCtx.moveTo(sx + BG_TW / 2, sy);
                bgCtx.lineTo(sx, sy + BG_TH / 2);
                bgCtx.lineTo(sx, sy + BG_TH / 2 + cliffH);
                bgCtx.lineTo(sx + BG_TW / 2, sy + cliffH);
                bgCtx.fill();
                bgCtx.fillStyle = "#4A3E2E";
                bgCtx.beginPath();
                bgCtx.moveTo(sx - BG_TW / 2, sy);
                bgCtx.lineTo(sx, sy + BG_TH / 2);
                bgCtx.lineTo(sx, sy + BG_TH / 2 + cliffH);
                bgCtx.lineTo(sx - BG_TW / 2, sy + cliffH);
                bgCtx.fill();
                // 절벽 돌 디테일
                bgCtx.strokeStyle = "rgba(0,0,0,0.15)";
                bgCtx.lineWidth = 0.5;
                for (let li = 1; li < cliffH; li += 4) {
                    bgCtx.beginPath();
                    bgCtx.moveTo(sx - BG_TW / 2 + 2, sy + li);
                    bgCtx.lineTo(sx + BG_TW / 2 - 2, sy + li);
                    bgCtx.stroke();
                }
                fill = ["#8A7A65", "#7A6B58", "#96876F", "#847560"][ri];
                stroke = "#6A5B48";
            } else if (edgeDist < 55 && rnd < 0.35) {
                // 절벽 근처 바위 지형
                fill = ["#8A7A65", "#7E7058", "#917E68"][ri % 3];
                stroke = "#6A5B48";
            } else if (dist < 100) {
                // 농장 근처 흙길
                fill = ["#C4A56A", "#B89B62", "#D1AE72", "#BFA168"][ri];
                stroke = "#A89058";
            } else if (dist < 155 && rnd < 0.4) {
                // 흙/잔디 전환 구간
                fill = rnd < 0.2
                    ? ["#C4A56A", "#B89B62"][ri % 2]
                    : ["#7AAA50", "#6B9B45"][ri % 2];
                stroke = rnd < 0.2 ? "#A89058" : "#5A8A38";
            } else {
                // 잔디
                if (rnd < 0.12) {
                    fill = ["#5A9A45", "#4F8E3D", "#558F42"][ri % 3];
                    stroke = "#4A8235";
                } else {
                    fill = ["#6AAF55", "#5FA04D", "#72B85E", "#68A852"][ri];
                    stroke = "#5A9A45";
                }
            }

            // 다이아몬드 타일
            bgCtx.beginPath();
            bgCtx.moveTo(sx, sy - BG_TH / 2);
            bgCtx.lineTo(sx + BG_TW / 2, sy);
            bgCtx.lineTo(sx, sy + BG_TH / 2);
            bgCtx.lineTo(sx - BG_TW / 2, sy);
            bgCtx.closePath();
            bgCtx.fillStyle = fill;
            bgCtx.fill();
            bgCtx.strokeStyle = stroke;
            bgCtx.lineWidth = 0.5;
            bgCtx.stroke();
        }
    }

    // --- 길 (농장으로 이어지는 흙길) ---
    // 우측에서 농장까지 이어지는 진입로
    for (let px = farmIso.x + 90; px < CW + 30; px += 18) {
        const py = farmIso.y;
        bgCtx.fillStyle = `rgba(180,150,90,${0.3 + bgRand(px, 0) * 0.2})`;
        bgCtx.beginPath();
        bgCtx.ellipse(px, py, 14, 7, -0.4, 0, Math.PI * 2);
        bgCtx.fill();
    }

    // --- 나무 (배경) ---
    const treePlacements = [];
    for (let i = 0; i < 35; i++) {
        const tr = Math.floor(bgRand(i * 3, 777) * rows);
        const tc = Math.floor(bgRand(777, i * 3) * cols);
        const tsx = ox + (tc - tr) * BG_TW / 2;
        const tsy = oy + (tc + tr) * BG_TH / 2;
        const tdx = tsx - farmIso.x;
        const tdy = (tsy - farmIso.y) * 1.8;
        const tdist = Math.sqrt(tdx * tdx + tdy * tdy);
        if (tdist < 185) continue;
        if (tsx < 40 || tsx > CW - 40 || tsy < 30 || tsy > CH - 40) continue;
        const edgeDist = Math.min(tsx + 30, CW - tsx + 30, tsy + 50, CH - tsy + 30);
        if (edgeDist < 55) continue;
        treePlacements.push({ sx: tsx, sy: tsy, i });
    }

    // 나무를 Y 좌표 기준 정렬 (화가 알고리즘)
    treePlacements.sort((a, b) => a.sy - b.sy);

    for (const tp of treePlacements) {
        const h = 24 + bgRand(tp.i, tp.i) * 20;
        const w = 16 + bgRand(tp.i + 1, tp.i) * 8;
        const sx = tp.sx, sy = tp.sy;

        // 그림자
        bgCtx.fillStyle = "rgba(0,0,0,0.18)";
        bgCtx.beginPath();
        bgCtx.ellipse(sx + 5, sy + 3, w * 0.55, w * 0.22, -0.3, 0, Math.PI * 2);
        bgCtx.fill();

        // 줄기
        bgCtx.fillStyle = "#5A3A1A";
        bgCtx.fillRect(sx - 2, sy - h * 0.35, 4, h * 0.42);

        // 잎 (둥근 나무)
        const g = bgRand(tp.i, tp.i + 2);
        bgCtx.fillStyle = g < 0.33 ? "#2D6B1E" : g < 0.66 ? "#357A25" : "#2A5E18";
        bgCtx.beginPath();
        bgCtx.ellipse(sx, sy - h * 0.5, w * 0.58, h * 0.42, 0, 0, Math.PI * 2);
        bgCtx.fill();

        // 잎 하이라이트
        bgCtx.fillStyle = "rgba(110,195,65,0.3)";
        bgCtx.beginPath();
        bgCtx.ellipse(sx - 3, sy - h * 0.62, w * 0.32, h * 0.22, 0, 0, Math.PI * 2);
        bgCtx.fill();

        // 잎 어두운 부분
        bgCtx.fillStyle = "rgba(0,50,0,0.15)";
        bgCtx.beginPath();
        bgCtx.ellipse(sx + 3, sy - h * 0.4, w * 0.4, h * 0.2, 0, 0, Math.PI * 2);
        bgCtx.fill();
    }

    // --- 물 웅덩이 (우하단) ---
    const wx = CW * 0.82, wy = CH * 0.78;
    bgCtx.fillStyle = "rgba(70,165,210,0.55)";
    bgCtx.beginPath();
    bgCtx.ellipse(wx, wy, 45, 22, -0.4, 0, Math.PI * 2);
    bgCtx.fill();
    bgCtx.fillStyle = "rgba(120,200,240,0.35)";
    bgCtx.beginPath();
    bgCtx.ellipse(wx - 8, wy - 4, 25, 12, -0.4, 0, Math.PI * 2);
    bgCtx.fill();
    bgCtx.strokeStyle = "rgba(55,130,170,0.4)";
    bgCtx.lineWidth = 1.5;
    bgCtx.beginPath();
    bgCtx.ellipse(wx, wy, 46, 23, -0.4, 0, Math.PI * 2);
    bgCtx.stroke();
    // 물 반짝임
    bgCtx.fillStyle = "rgba(200,240,255,0.3)";
    bgCtx.beginPath();
    bgCtx.ellipse(wx - 15, wy - 8, 8, 3, -0.5, 0, Math.PI * 2);
    bgCtx.fill();

    // --- 잔디 디테일 (타일 위 풀잎) ---
    for (let i = 0; i < 80; i++) {
        const gx = bgRand(i * 2, 555) * CW;
        const gy = bgRand(555, i * 2) * CH;
        const gdx = gx - farmIso.x;
        const gdy = (gy - farmIso.y) * 1.8;
        const gdist = Math.sqrt(gdx * gdx + gdy * gdy);
        if (gdist < 120) continue;
        const edgeDist = Math.min(gx + 30, CW - gx + 30, gy + 50, CH - gy + 30);
        if (edgeDist < 55) continue;

        bgCtx.strokeStyle = "rgba(80,160,50,0.25)";
        bgCtx.lineWidth = 1;
        for (let g = -1; g <= 1; g++) {
            bgCtx.beginPath();
            bgCtx.moveTo(gx + g * 2, gy);
            bgCtx.lineTo(gx + g * 2 + g * 0.5, gy - 4 - bgRand(i, g + 5) * 3);
            bgCtx.stroke();
        }
    }

    // --- 작은 꽃 ---
    for (let i = 0; i < 20; i++) {
        const fx = bgRand(i, 888) * CW;
        const fy = bgRand(888, i) * CH;
        const fdx = fx - farmIso.x;
        const fdy = (fy - farmIso.y) * 1.8;
        const fdist = Math.sqrt(fdx * fdx + fdy * fdy);
        if (fdist < 130) continue;
        const edgeDist = Math.min(fx + 30, CW - fx + 30, fy + 50, CH - fy + 30);
        if (edgeDist < 55) continue;

        const colors = ["#FF6B8A", "#FFD54F", "#CE93D8", "#64B5F6", "#FF8A65"];
        bgCtx.fillStyle = colors[i % colors.length];
        bgCtx.beginPath();
        bgCtx.arc(fx, fy, 2, 0, Math.PI * 2);
        bgCtx.fill();
        bgCtx.fillStyle = "#FFE082";
        bgCtx.beginPath();
        bgCtx.arc(fx, fy, 0.8, 0, Math.PI * 2);
        bgCtx.fill();
    }
})();

function drawBackground() {
    ctx.drawImage(bgCanvas, 0, 0);

    // 밤 배경 톤 (잔디/지형 어둡게)
    if (!isDayWave()) {
        ctx.fillStyle = "rgba(30,40,80,0.28)";
        ctx.fillRect(0, 0, CW, CH);
    }

    // 구름 그림자 (애니메이션)
    ctx.save();
    for (const cs of cloudShadows) {
        const cx = ((cs.baseX + frame * cs.speed) % (CW + cs.w * 2)) - cs.w;
        ctx.fillStyle = isDayWave() ? "rgba(0,0,0,0.06)" : "rgba(0,0,30,0.15)";
        ctx.beginPath();
        ctx.ellipse(cx, cs.y, cs.w / 2, cs.h / 2, -0.4, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    // 밤이면 별 배경
    if (!isDayWave()) {
        for (let i = 0; i < 30; i++) {
            const sx = (i * 197 + 33) % CW;
            const sy = (i * 53 + 13) % 200;
            const tw = 0.5 + 0.5 * Math.sin(frame * 0.05 + i);
            ctx.fillStyle = `rgba(255,255,200,${0.4 + tw * 0.4})`;
            ctx.beginPath();
            ctx.arc(sx, sy, 1 + tw, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

function drawFarmPlatform() {
    // 배경과 동일 좌표계 — 평면 타일, 벽 없음
    const farmRX = FARM_RADIUS;            // 타원 X반경
    const farmRY = FARM_RADIUS * ISO_Y;    // 타원 Y반경 (아이소 압축)

    // --- 농장 타일 (타원 영역) ---
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(FARM_CX, FARM_CY, farmRX + 5, farmRY + 3, 0, 0, Math.PI * 2);
    ctx.clip();

    for (let r = -8; r <= 8; r++) {
        for (let c = -8; c <= 8; c++) {
            const sx = FARM_CX + (c - r) * BG_TW / 2;
            const sy = FARM_CY + (c + r) * BG_TH / 2;
            const nx = (sx - FARM_CX) / (farmRX + 10);
            const ny = (sy - FARM_CY) / (farmRY + 5);
            if (nx * nx + ny * ny > 1.1) continue;

            const ri = ((c + 8) * 7 + (r + 8) * 13) & 3;
            const rnd = bgRand(c + 200, r + 200);
            let color;
            if (rnd < 0.06) color = "#4E9842";
            else if (rnd < 0.14) color = "#62B055";
            else color = ["#58A84E", "#54A44A", "#5DAD52", "#50A046"][ri];

            ctx.beginPath();
            ctx.moveTo(sx, sy - BG_TH / 2);
            ctx.lineTo(sx + BG_TW / 2, sy);
            ctx.lineTo(sx, sy + BG_TH / 2);
            ctx.lineTo(sx - BG_TW / 2, sy);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = "rgba(40,80,30,0.2)";
            ctx.lineWidth = 0.5;
            ctx.stroke();
        }
    }
    ctx.restore();

    // --- 테두리 ---
    ctx.strokeStyle = "#9A8A6A";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(FARM_CX, FARM_CY, farmRX, farmRY, 0, 0, Math.PI * 2);
    ctx.stroke();

    // --- 울타리 (타원형) ---
    const fRX = farmRX * 0.93, fRY = farmRY * 0.93;
    const posts = 20;
    // 레일 2줄
    ctx.strokeStyle = "#C4A882";
    ctx.lineWidth = 1.2;
    for (const hOff of [-4, -9]) {
        ctx.beginPath();
        for (let i = 0; i <= 64; i++) {
            const a = (i / 64) * Math.PI * 2;
            const px = FARM_CX + Math.cos(a) * fRX;
            const py = FARM_CY + Math.sin(a) * fRY + hOff;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
    }
    // 기둥
    ctx.fillStyle = "#A08060";
    ctx.strokeStyle = "#7A6040";
    ctx.lineWidth = 0.8;
    for (let i = 0; i < posts; i++) {
        const a = (i / posts) * Math.PI * 2;
        const px = FARM_CX + Math.cos(a) * fRX;
        const py = FARM_CY + Math.sin(a) * fRY;
        ctx.fillRect(px - 1.5, py - 12, 3, 14);
        ctx.strokeRect(px - 1.5, py - 12, 3, 14);
        // 캡
        ctx.fillStyle = "#B89870";
        ctx.fillRect(px - 2.5, py - 13, 5, 2);
        ctx.fillStyle = "#A08060";
    }

    // --- 장식 ---
    // 건초
    ctx.fillStyle = "#D4A84A";
    ctx.beginPath(); ctx.ellipse(FARM_CX + 60, FARM_CY + 25, 10, 5, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#C49838";
    ctx.beginPath(); ctx.ellipse(FARM_CX + 60, FARM_CY + 28, 10, 3.5, -0.4, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "#D4A84A";
    ctx.beginPath(); ctx.ellipse(FARM_CX + 75, FARM_CY + 18, 8, 4, -0.3, 0, Math.PI * 2); ctx.fill();

    // 상자
    ctx.fillStyle = "#C4A882";
    ctx.fillRect(FARM_CX - 70, FARM_CY + 15, 10, 10);
    ctx.strokeStyle = "#8B7355"; ctx.lineWidth = 0.8;
    ctx.strokeRect(FARM_CX - 70, FARM_CY + 15, 10, 10);

    // 물통
    ctx.fillStyle = "#7A8A9A";
    ctx.beginPath(); ctx.ellipse(FARM_CX - 50, FARM_CY - 25, 9, 4.5, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(100,180,230,0.5)";
    ctx.beginPath(); ctx.ellipse(FARM_CX - 50, FARM_CY - 26, 7, 3, -0.4, 0, Math.PI * 2); ctx.fill();

    // 꽃
    const flowers = [[-40,-35],[25,30],[-80,8],[45,-30],[85,-5],[-15,38]];
    const fColors = ["#FF6B8A","#FFD54F","#CE93D8","#64B5F6","#FF8A65","#FF6B8A"];
    for (let i = 0; i < flowers.length; i++) {
        const fx = FARM_CX + flowers[i][0], fy = FARM_CY + flowers[i][1];
        ctx.fillStyle = fColors[i];
        ctx.beginPath(); ctx.arc(fx, fy, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#FFE082";
        ctx.beginPath(); ctx.arc(fx, fy, 1, 0, Math.PI * 2); ctx.fill();
    }
}
