// 오프스크린 캔버스로 스프라이트 틴트 (원본 + 색 오버레이 합성)
const _tintCanvas = document.createElement("canvas");
const _tintCtx = _tintCanvas.getContext("2d");
function getTintCanvas(img, size, tint, dx, dy) {
    if (_tintCanvas.width !== size) { _tintCanvas.width = size; _tintCanvas.height = size; }
    _tintCtx.clearRect(0, 0, size, size);
    // 1) 원본 스프라이트
    _tintCtx.globalCompositeOperation = "source-over";
    _tintCtx.drawImage(img, 0, 0, size, size);
    // 2) 알파 영역에만 색 오버레이 (source-atop)
    _tintCtx.globalCompositeOperation = "source-atop";
    _tintCtx.fillStyle = tint;
    _tintCtx.fillRect(0, 0, size, size);
    _tintCtx.globalCompositeOperation = "source-over";
    ctx.drawImage(_tintCanvas, dx, dy);
}

// 상태이상 외곽 글로우 (저비용 — 단순 ellipse + alpha 펄스)
const STATUS_GLOW_COLORS = {
    freeze:    "#4FC3F7",
    burn:      "#FF5722",
    poison:    "#9C27B0",
    paralysis: "#FFEB3B",
    sleep:     "#90A4AE",
    slow:      "#90CAF9",
    mDefDown:  "#EC407A",
    sDefDown:  "#BA68C8",
};
function drawStatusGlow(m, sx, sy, size) {
    if (!m.statuses) return;
    let glowColor = null;
    for (const k in STATUS_GLOW_COLORS) {
        if (m.statuses[k]) { glowColor = STATUS_GLOW_COLORS[k]; break; }
    }
    if (!glowColor) return;
    const pulse = 0.5 + 0.5 * Math.sin(frame * 0.18);
    ctx.save();
    ctx.globalAlpha = 0.18 + pulse * 0.18;
    ctx.fillStyle = glowColor;
    ctx.beginPath();
    ctx.ellipse(sx, sy, size * 0.55, size * 0.55 * 0.85, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawMonsterAt(m) {
    if (m.hp <= 0) return;
    const sx = m.x, sy = m.y;
    const img = images[m.sprite];
    const size = m.isRaid ? 112 : (m.isBoss ? 84 : 68);
    let shake = m.hitAnim > 0 ? Math.sin(m.hitAnim * 4) * 4 : 0;
    let shakeY = 0;
    if (m.invading) {
        // 침입 컷신: 강하게 떨림
        shake += (Math.random() - 0.5) * 6;
        shakeY += (Math.random() - 0.5) * 6;
    }
    const breathe = Math.sin(frame * 0.04 + m.id * 2) * 1.5;

    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath();
    ctx.ellipse(sx, sy + size / 2 - 2, 14, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // 상태이상 외곽 글로우 (스프라이트 뒤에 깔림)
    drawStatusGlow(m, sx, sy + breathe, size);

    if (img && img.complete) {
        ctx.save();
        if (m.hitAnim > 0) {
            ctx.globalAlpha = 0.6 + Math.sin(m.hitAnim * 5) * 0.4;
        }
        const drawX = sx - size / 2 + shake;
        const drawY = sy - size / 2 + breathe + shakeY;

        // 상태이상 색상 결정 (약한 알파)
        let tint = null;
        if (m.statuses) {
            const pulse = 0.25 + 0.1 * Math.sin(frame * 0.18);
            if (m.statuses.freeze)         tint = `rgba(100,200,255,${pulse + 0.1})`;
            else if (m.statuses.burn)      tint = `rgba(255,80,30,${pulse})`;
            else if (m.statuses.poison)    tint = `rgba(170,60,200,${pulse})`;
            else if (m.statuses.paralysis) tint = `rgba(255,235,59,${pulse})`;
            else if (m.statuses.sleep)     tint = `rgba(150,170,200,${pulse + 0.05})`;
            else if (m.statuses.slow)      tint = `rgba(140,200,250,${pulse - 0.05})`;
            else if (m.statuses.defDown || m.statuses.mDefDown || m.statuses.sDefDown) tint = `rgba(244,143,177,${pulse})`;
        }

        if (tint) {
            getTintCanvas(img, size, tint, drawX, drawY);
        } else {
            ctx.drawImage(img, drawX, drawY, size, size);
        }
        ctx.restore();
    }

    const hpRatio = m.hp / m.maxHp;
    const barW = 38, barH = 5, barR = 2;
    const barX = sx - barW / 2, barY = sy - size / 2 - 8 + breathe;

    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.beginPath();
    ctx.roundRect(barX - 1, barY - 1, barW + 2, barH + 2, barR + 1);
    ctx.fill();

    ctx.fillStyle = "#333";
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW, barH, barR);
    ctx.fill();

    ctx.fillStyle = hpRatio > 0.5 ? "#4CAF50" : hpRatio > 0.2 ? "#FF9800" : "#F44336";
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW * hpRatio, barH, barR);
    ctx.fill();

    // 상태이상 아이콘 (몬스터 위)
    if (m.statuses) {
        const keys = Object.keys(m.statuses);
        let ix = sx - (keys.length * 8) / 2;
        const iy = barY - 10;
        for (const k of keys) {
            let icColor, icText;
            if (k === "burn")        { icColor = "#FF5722"; icText = "🔥"; }
            else if (k === "poison") { icColor = "#9C27B0"; icText = "☠"; }
            else if (k === "freeze") { icColor = "#4FC3F7"; icText = "❄"; }
            else if (k === "paralysis"){ icColor = "#FFEB3B"; icText = "⚡"; }
            else if (k === "sleep")  { icColor = "#90A4AE"; icText = "💤"; }
            else if (k === "slow")   { icColor = "#90CAF9"; icText = "↘"; }
            else if (k === "defDown"){ icColor = "#F48FB1"; icText = "↓"; }
            else if (k === "mDefDown"){ icColor = "#EC407A"; icText = "▼"; }
            else if (k === "sDefDown"){ icColor = "#BA68C8"; icText = "▽"; }
            ctx.fillStyle = icColor;
            ctx.beginPath();
            ctx.arc(ix + 4, iy, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#fff"; ctx.font = "bold 7px system-ui";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(icText, ix + 4, iy + 0.5);
            ix += 9;
        }
    }

    // 보스 표식
    if (m.isRaid) {
        const pulse = 0.7 + 0.3 * Math.sin(frame * 0.2);
        ctx.fillStyle = `rgba(233,30,99,${pulse})`; ctx.font = "bold 11px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("⚡ RAID ⚡", sx, barY - 18);
    } else if (m.isBoss) {
        ctx.fillStyle = "#FFD700"; ctx.font = "bold 9px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("★ BOSS ★", sx, barY - 18);
    }
}

function drawEeveeAt(ee) {
    const isDrag = ee === dragging;
    const sx = ee.x, sy = ee.y;
    const img = images[ee.sprite];
    const size = isDrag ? 54 : 48;
    const bounce = Math.sin(ee.animTimer * 0.06) * 2;

    // 부스트 버프 오라
    if (ee.boostBuff > 0) {
        const pulse = 0.5 + 0.5 * Math.sin(frame * 0.2);
        ctx.save();
        ctx.fillStyle = `rgba(255,215,0,${0.15 + pulse * 0.15})`;
        ctx.beginPath();
        ctx.ellipse(sx, sy + 5, 22, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = `rgba(255,235,59,${0.5 + pulse * 0.3})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
    }

    if (isDrag) {
        ctx.beginPath();
        ctx.ellipse(sx, sy, ee.range, ee.range * ISO_Y, 0, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(100,200,255,0.08)";
        ctx.fill();
        ctx.strokeStyle = "rgba(100,200,255,0.4)";
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.beginPath();
    ctx.ellipse(sx, sy + size / 2 - 3, 12, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    if (img && img.complete) {
        ctx.save();
        ctx.globalAlpha = isDrag ? 0.8 : 1;
        ctx.translate(sx, sy + (isDrag ? -8 : bounce));
        if (ee.facing < 0) ctx.scale(-1, 1);
        ctx.drawImage(img, -size / 2, -size / 2, size, size);
        ctx.restore();
    }

    // 레벨 배지 (10단위 색상 + 50+ 무지개)
    if (ee.level > 1) {
        const lv = ee.level;
        // 단계별 색상
        let bg, border;
        if (lv >= 50)      { bg = `hsl(${(frame * 4) % 360}, 80%, 55%)`; border = "#fff"; } // 무지개
        else if (lv >= 40) { bg = "#E91E63"; border = "#FFEBEE"; } // 핑크
        else if (lv >= 30) { bg = "#9C27B0"; border = "#F3E5F5"; } // 보라
        else if (lv >= 20) { bg = "#3F51B5"; border = "#E8EAF6"; } // 인디고
        else if (lv >= 10) { bg = "#00BCD4"; border = "#E0F7FA"; } // 시안
        else               { bg = "#FFC107"; border = "#fff"; }   // 노랑 (기본)
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.arc(sx + 12, sy - size / 2 + 4, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = border; ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.fillStyle = "#fff";
        ctx.font = "bold 9px system-ui";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(`${lv}`, sx + 12, sy - size / 2 + 4);
    }

    if (!isDrag) {
        ctx.beginPath();
        ctx.ellipse(sx, sy, ee.range, ee.range * ISO_Y, 0, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(100,200,255,0.06)";
        ctx.lineWidth = 1;
        ctx.stroke();
    }
}

function drawEntities() {
    // Collect all entities for depth sorting
    const allEntities = [];
    for (const m of monsters) {
        if (m.hp <= 0) continue;
        allEntities.push({ type: "monster", obj: m, gameY: m.y });
    }
    for (const ee of eevees) {
        allEntities.push({ type: "eevee", obj: ee, gameY: ee.y });
    }
    // Sort by game Y (painters algorithm - farther back drawn first)
    allEntities.sort((a, b) => a.gameY - b.gameY);

    for (const ent of allEntities) {
        if (ent.type === "monster") drawMonsterAt(ent.obj);
        else drawEeveeAt(ent.obj);
    }
}

function drawProjectiles() {
    for (const p of projectiles) {
        const bt = BULLET_TYPES[p.bulletType] || BULLET_TYPES.normal;

        // Trail
        for (const t of p.trail) {
            if (t.life <= 0) continue;
            const alpha = t.life / 8 * 0.4;
            ctx.fillStyle = bt.trail;
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(t.x, t.y, bt.size * 0.6, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Glow
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);

        ctx.beginPath();
        ctx.arc(0, 0, bt.size + 3, 0, Math.PI * 2);
        ctx.fillStyle = bt.glow;
        ctx.globalAlpha = 0.3;
        ctx.fill();
        ctx.globalAlpha = 1;

        // Bullet body
        ctx.beginPath();
        ctx.ellipse(0, 0, bt.size * 1.5, bt.size, 0, 0, Math.PI * 2);
        ctx.fillStyle = bt.color;
        ctx.fill();

        // Highlight
        ctx.beginPath();
        ctx.ellipse(-bt.size * 0.3, -bt.size * 0.2, bt.size * 0.5, bt.size * 0.3, 0, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.fill();

        ctx.restore();
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI * 2);
        ctx.fill();
    }
    for (const h of hitEffects) {
        const progress = 1 - h.life / h.maxLife;
        ctx.globalAlpha = (1 - progress) * 0.5;
        ctx.fillStyle = h.color;
        ctx.beginPath();
        ctx.arc(h.x, h.y, 8 + progress * 15, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function drawRocks() {
    for (const r of rocks) {
        // 버프 오라
        ctx.save();
        const buffR = getRockBuffRadius(r.type);
        const auraColor = r.type === "moss" ? "rgba(120,200,80,"
            : r.type === "metal" ? "rgba(180,200,210,"
            : "rgba(140,210,255,";
        ctx.fillStyle = auraColor + "0.08)";
        ctx.beginPath();
        ctx.ellipse(r.x, r.y, buffR, buffR * ISO_Y, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = auraColor + "0.3)";
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.ellipse(r.x, r.y, buffR, buffR * ISO_Y, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();

        // 그림자
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath();
        ctx.ellipse(r.x, r.y + 8, 18, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // 바위 본체
        if (r.type === "moss") {
            // 이끼바위 - 회색 + 초록 이끼
            ctx.fillStyle = "#6B6258";
            ctx.beginPath();
            ctx.ellipse(r.x, r.y, 18, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#5A4F45";
            ctx.beginPath();
            ctx.ellipse(r.x, r.y + 4, 18, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#4E8A38";
            ctx.beginPath();
            ctx.ellipse(r.x - 6, r.y - 6, 8, 4, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(r.x + 7, r.y - 4, 9, 4, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(r.x + 2, r.y - 9, 6, 3, 0, 0, Math.PI * 2);
            ctx.fill();
        } else if (r.type === "metal") {
            // 강철바위 - 메탈 광택
            ctx.fillStyle = "#90A4AE";
            ctx.beginPath();
            ctx.ellipse(r.x, r.y, 18, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#607D8B";
            ctx.beginPath();
            ctx.ellipse(r.x, r.y + 4, 18, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            // 광택
            ctx.fillStyle = "#CFD8DC";
            ctx.beginPath();
            ctx.ellipse(r.x - 5, r.y - 4, 7, 3, -0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(r.x + 5, r.y - 7, 5, 2, 0.4, 0, Math.PI * 2);
            ctx.fill();
            // 볼트
            ctx.fillStyle = "#37474F";
            ctx.beginPath(); ctx.arc(r.x - 10, r.y + 4, 1.8, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(r.x + 10, r.y + 4, 1.8, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(r.x, r.y + 8, 1.8, 0, Math.PI * 2); ctx.fill();
        } else {
            // 얼음바위 - 푸른 결정
            ctx.fillStyle = "#A8D8F0";
            ctx.beginPath();
            ctx.moveTo(r.x, r.y - 14);
            ctx.lineTo(r.x + 16, r.y);
            ctx.lineTo(r.x + 8, r.y + 10);
            ctx.lineTo(r.x - 8, r.y + 10);
            ctx.lineTo(r.x - 16, r.y);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = "#7AB8E0";
            ctx.beginPath();
            ctx.moveTo(r.x, r.y - 14);
            ctx.lineTo(r.x - 16, r.y);
            ctx.lineTo(r.x - 8, r.y + 10);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,0.6)";
            ctx.beginPath();
            ctx.moveTo(r.x, r.y - 14);
            ctx.lineTo(r.x + 4, r.y - 4);
            ctx.lineTo(r.x - 2, r.y);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#5599C8"; ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(r.x, r.y - 14);
            ctx.lineTo(r.x + 16, r.y);
            ctx.lineTo(r.x + 8, r.y + 10);
            ctx.lineTo(r.x - 8, r.y + 10);
            ctx.lineTo(r.x - 16, r.y);
            ctx.closePath();
            ctx.stroke();
        }
    }
}

function drawSkillEffects() {
    for (const e of skillEffects) {
        // 공통 시작 지연 처리 (모든 이펙트 타입)
        if (e.delay && e.delay > 0) { e.delay--; continue; }
        const t = e.life / e.maxLife;
        const a = t;
        ctx.save();
        if (e.type === "burst") {
            // 확장 링 + 글로우
            const r = e.radius * (1 - t) + 4;
            ctx.globalAlpha = a;
            ctx.shadowColor = e.color; ctx.shadowBlur = 12 * SHADOW_BLUR_MUL;
            ctx.strokeStyle = e.color;
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.ellipse(e.x, e.y, r, r * ISO_Y, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.shadowBlur = 0;
            // 안쪽 채움
            ctx.globalAlpha = a * 0.4;
            ctx.fillStyle = e.color;
            ctx.beginPath();
            ctx.ellipse(e.x, e.y, r * 0.6, r * 0.6 * ISO_Y, 0, 0, Math.PI * 2);
            ctx.fill();
            // 흰색 코어
            ctx.globalAlpha = a * 0.8;
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.ellipse(e.x, e.y, r * 0.25, r * 0.25 * ISO_Y, 0, 0, Math.PI * 2);
            ctx.fill();
        } else if (e.type === "shockwave") {
            // 충격파 - 빠르게 확장하는 얇은 링
            const r = e.radius * (1.4 - t * 0.4);
            ctx.globalAlpha = a * 0.6;
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2 * a + 0.5;
            ctx.beginPath();
            ctx.ellipse(e.x, e.y, r, r * ISO_Y, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = a * 0.5;
            ctx.strokeStyle = e.color;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.ellipse(e.x, e.y, r + 2, (r + 2) * ISO_Y, 0, 0, Math.PI * 2);
            ctx.stroke();
        } else if (e.type === "aoe") {
            // 광역 - 큰 원형 + 그라데이션 + 방사선
            const r = e.radius * (1.3 - t * 0.5);
            const grd = ctx.createRadialGradient(e.x, e.y, 5, e.x, e.y, r);
            grd.addColorStop(0, e.color + "");
            grd.addColorStop(0.6, e.color);
            grd.addColorStop(1, "rgba(0,0,0,0)");
            ctx.globalAlpha = a * 0.6;
            ctx.fillStyle = grd;
            ctx.beginPath();
            ctx.ellipse(e.x, e.y, r, r * ISO_Y, 0, 0, Math.PI * 2);
            ctx.fill();
            // 외곽 링
            ctx.globalAlpha = a;
            ctx.strokeStyle = e.color;
            ctx.lineWidth = 3.5;
            ctx.shadowColor = e.color; ctx.shadowBlur = 10 * SHADOW_BLUR_MUL;
            ctx.beginPath();
            ctx.ellipse(e.x, e.y, r, r * ISO_Y, 0, 0, Math.PI * 2);
            ctx.stroke();
            // 방사선
            ctx.globalAlpha = a * 0.5;
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 8; i++) {
                const ang = (i / 8) * Math.PI * 2 + frame * 0.02;
                ctx.beginPath();
                ctx.moveTo(e.x + Math.cos(ang) * r * 0.3, e.y + Math.sin(ang) * r * 0.3 * ISO_Y);
                ctx.lineTo(e.x + Math.cos(ang) * r * 0.95, e.y + Math.sin(ang) * r * 0.95 * ISO_Y);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
        } else if (e.type === "line") {
            // 체인 번개 - 두꺼운 외곽 + 흰 내부
            ctx.globalAlpha = a;
            ctx.shadowColor = e.color; ctx.shadowBlur = 12 * SHADOW_BLUR_MUL;
            // 외곽 (색상)
            ctx.strokeStyle = e.color;
            ctx.lineWidth = 5 * a + 2;
            ctx.beginPath();
            ctx.moveTo(e.x, e.y);
            const segments = 6;
            const points = [{x:e.x, y:e.y}];
            for (let i = 1; i < segments; i++) {
                const tt = i / segments;
                const lx = e.x + (e.x2 - e.x) * tt + (Math.random() - 0.5) * 12;
                const ly = e.y + (e.y2 - e.y) * tt + (Math.random() - 0.5) * 12;
                points.push({x:lx, y:ly});
            }
            points.push({x:e.x2, y:e.y2});
            for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.stroke();
            // 내부 (흰색 코어)
            ctx.shadowBlur = 0;
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2 * a + 0.5;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.stroke();
        } else if (e.type === "beam") {
            // 시전자→타겟 광선
            ctx.globalAlpha = a * 0.8;
            ctx.strokeStyle = e.color;
            ctx.lineWidth = 4 * a + 1;
            ctx.shadowColor = e.color; ctx.shadowBlur = 10 * SHADOW_BLUR_MUL;
            ctx.beginPath();
            ctx.moveTo(e.x, e.y);
            ctx.lineTo(e.x2, e.y2);
            ctx.stroke();
            // 흰 코어
            ctx.shadowBlur = 0;
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 1.5 * a + 0.3;
            ctx.beginPath();
            ctx.moveTo(e.x, e.y);
            ctx.lineTo(e.x2, e.y2);
            ctx.stroke();
        } else if (e.type === "bite") {
            // 이빨 마크 (X 형태 송곳니 두 쌍)
            ctx.globalAlpha = a;
            ctx.shadowColor = e.color; ctx.shadowBlur = 8 * SHADOW_BLUR_MUL;
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 3 * a + 1;
            const r = 14 * (1 + (1 - t) * 0.3);
            // 위 송곳니
            ctx.beginPath();
            ctx.moveTo(e.x - r * 0.6, e.y - r * 0.5);
            ctx.lineTo(e.x - r * 0.3, e.y);
            ctx.moveTo(e.x + r * 0.6, e.y - r * 0.5);
            ctx.lineTo(e.x + r * 0.3, e.y);
            // 아래 송곳니
            ctx.moveTo(e.x - r * 0.6, e.y + r * 0.5);
            ctx.lineTo(e.x - r * 0.3, e.y);
            ctx.moveTo(e.x + r * 0.6, e.y + r * 0.5);
            ctx.lineTo(e.x + r * 0.3, e.y);
            ctx.stroke();
            // 색상 외곽
            ctx.strokeStyle = e.color;
            ctx.lineWidth = 5 * a + 2;
            ctx.globalAlpha = a * 0.5;
            ctx.beginPath();
            ctx.moveTo(e.x - r * 0.6, e.y - r * 0.5);
            ctx.lineTo(e.x - r * 0.3, e.y);
            ctx.moveTo(e.x + r * 0.6, e.y - r * 0.5);
            ctx.lineTo(e.x + r * 0.3, e.y);
            ctx.moveTo(e.x - r * 0.6, e.y + r * 0.5);
            ctx.lineTo(e.x - r * 0.3, e.y);
            ctx.moveTo(e.x + r * 0.6, e.y + r * 0.5);
            ctx.lineTo(e.x + r * 0.3, e.y);
            ctx.stroke();
            ctx.shadowBlur = 0;
        } else if (e.type === "dashTrail") {
            // 잔상 라인 - 흐릿한 두꺼운 띠
            ctx.globalAlpha = a * 0.6;
            ctx.strokeStyle = e.color;
            ctx.lineWidth = 8 * a;
            ctx.lineCap = "round";
            ctx.shadowColor = e.color; ctx.shadowBlur = 10 * SHADOW_BLUR_MUL;
            ctx.beginPath();
            ctx.moveTo(e.x, e.y);
            ctx.lineTo(e.x2, e.y2);
            ctx.stroke();
            ctx.globalAlpha = a;
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2 * a + 0.5;
            ctx.beginPath();
            ctx.moveTo(e.x, e.y);
            ctx.lineTo(e.x2, e.y2);
            ctx.stroke();
            ctx.lineCap = "butt";
            ctx.shadowBlur = 0;
        } else if (e.type === "cast") {
            // 시전 차징 (이브이 위)
            const r = 6 + (1 - t) * 6;
            ctx.globalAlpha = a;
            ctx.fillStyle = e.color;
            ctx.shadowColor = e.color; ctx.shadowBlur = 8 * SHADOW_BLUR_MUL;
            ctx.beginPath();
            ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = a * 0.6;
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(e.x, e.y, r * 0.4, 0, Math.PI * 2);
            ctx.fill();
        } else if (e.type === "pierceBeam") {
            // 관통 빔 - 두꺼운 광선 + 흰 코어
            ctx.globalAlpha = a;
            ctx.shadowColor = e.color; ctx.shadowBlur = 14 * SHADOW_BLUR_MUL;
            ctx.strokeStyle = e.color;
            ctx.lineWidth = 14 * a + 4;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(e.x, e.y);
            ctx.lineTo(e.x2, e.y2);
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 5 * a + 1;
            ctx.beginPath();
            ctx.moveTo(e.x, e.y);
            ctx.lineTo(e.x2, e.y2);
            ctx.stroke();
            ctx.lineCap = "butt";
        } else if (e.type === "field") {
            // 지속장 - 회전하는 원형 영역
            const r = e.radius;
            ctx.globalAlpha = 0.25 + 0.15 * Math.sin(frame * 0.15);
            ctx.fillStyle = e.color;
            ctx.beginPath();
            ctx.ellipse(e.x, e.y, r, r * ISO_Y, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 0.5;
            ctx.strokeStyle = e.color;
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 4]);
            ctx.beginPath();
            ctx.ellipse(e.x, e.y, r, r * ISO_Y, frame * 0.02, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
        } else if (e.type === "delayed") {
            // 딜레이 폭발 - 점점 커지는 경고 원
            const r = e.radius;
            const progress = 1 - t; // 0 → 1
            const pulse = 0.4 + 0.4 * Math.sin(frame * 0.3);
            ctx.globalAlpha = 0.3 + pulse * 0.3;
            ctx.fillStyle = e.color;
            ctx.beginPath();
            ctx.ellipse(e.x, e.y, r * progress, r * progress * ISO_Y, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 0.7 + pulse * 0.3;
            ctx.strokeStyle = e.color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(e.x, e.y, r, r * ISO_Y, 0, 0, Math.PI * 2);
            ctx.stroke();
            // 카운트 표시
            ctx.globalAlpha = 1;
            ctx.fillStyle = "#fff";
            ctx.font = "bold 18px system-ui";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(Math.ceil(e.life / 60).toString(), e.x, e.y);
        } else if (e.type === "fx") {
            // 회전 누적
            if (e.rotSpeed) e.rotation = (e.rotation || 0) + e.rotSpeed;
            // orbit 위치 회전 (아이콘은 안 돌고 위치만)
            if (e.orbitSpeed != null) {
                e.orbitAngle = (e.orbitAngle || 0) + e.orbitSpeed;
                e.x = e.orbitCx + Math.cos(e.orbitAngle) * e.orbitR;
                e.y = e.orbitCy + Math.sin(e.orbitAngle) * e.orbitR * ISO_Y;
            }
            // 중력 (rain 모드)
            if (e.gravity) {
                e.vy = (e.vy || 0) + e.gravity;
                e.y += e.vy;
            } else if (e.vy) {
                e.y += e.vy; // 상승/하강
            }
            // 바닥 클램프 (낙하류) — y가 groundY를 넘으면 정지 (상승 중일 땐 무시)
            if (e.groundY != null && e.y >= e.groundY && (e.vy || 0) >= 0) {
                e.y = e.groundY;
                e.vy = 0;
                e.gravity = 0;
            }
            // 펄스 (burst 모드)
            let drawScale = e.scale * (1 + (1 - t) * 0.2);
            if (e.pulse) {
                drawScale *= 1 + Math.sin((1 - t) * Math.PI * 2.5) * 0.18;
            }
            // beam 모드 — scaleX 따로
            if (e.scaleX) {
                ctx.save();
                ctx.translate(e.x, e.y);
                if (e.rotation) ctx.rotate(e.rotation);
                ctx.scale(e.scaleX, e.scaleY || 1);
                drawFx(e.fxKey, 0, 0, {
                    scale: drawScale,
                    rotation: 0,
                    alpha: a,
                    color: e.color,
                });
                ctx.restore();
            } else {
                drawFx(e.fxKey, e.x, e.y, {
                    scale: drawScale,
                    rotation: e.rotation,
                    alpha: a,
                    color: e.color,
                });
            }
        }
        ctx.restore();
    }
    ctx.globalAlpha = 1;
}

function drawCoinTexts() {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const ct of coinTexts) {
        ctx.globalAlpha = Math.min(1, ct.life / 20);
        ctx.fillStyle = ct.color || "#FFD700";
        ctx.font = "bold 13px system-ui";
        ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
        ctx.strokeText(ct.text, ct.x, ct.y);
        ctx.fillText(ct.text, ct.x, ct.y);
    }
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;
}

function drawSelectedHighlight() {
    if (!selectedEevee) return;
    const sx = selectedEevee.x, sy = selectedEevee.y;
    // 선택 링
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(sx, sy + 12, 18, 7, 0, 0, Math.PI * 2);
    ctx.strokeStyle = "#FFD54F";
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 3]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
}

function drawShopItemIcon(item, cx, cy) {
    // 진화 돌, 바위, 친밀도(하트), 리본을 직접 그리기
    if (item.type === "stone") {
        // 진화 돌 (마름모 보석)
        let main, light, dark;
        if (item.id === "water_stone")        { main="#4FC3F7"; light="#B3E5FC"; dark="#0288D1"; }
        else if (item.id === "thunder_stone") { main="#FFEB3B"; light="#FFF59D"; dark="#FBC02D"; }
        else if (item.id === "fire_stone")    { main="#FF5722"; light="#FFAB91"; dark="#D84315"; }
        else if (item.id === "giga_stone")    { main="#FF6F00"; light="#FFAB40"; dark="#BF360C"; }
        else if (item.id === "mega_stone")    { main="#9C27B0"; light="#CE93D8"; dark="#4A148C"; }
        else                                   { main="#888"; light="#ccc"; dark="#444"; }
        ctx.fillStyle = dark;
        ctx.beginPath();
        ctx.moveTo(cx, cy - 14);
        ctx.lineTo(cx + 12, cy);
        ctx.lineTo(cx, cy + 14);
        ctx.lineTo(cx - 12, cy);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = main;
        ctx.beginPath();
        ctx.moveTo(cx, cy - 11);
        ctx.lineTo(cx + 9, cy);
        ctx.lineTo(cx, cy + 11);
        ctx.lineTo(cx - 9, cy);
        ctx.closePath();
        ctx.fill();
        // 하이라이트
        ctx.fillStyle = light;
        ctx.beginPath();
        ctx.moveTo(cx - 3, cy - 7);
        ctx.lineTo(cx + 1, cy - 9);
        ctx.lineTo(cx - 1, cy + 1);
        ctx.lineTo(cx - 5, cy - 1);
        ctx.closePath();
        ctx.fill();
        // 외곽선
        ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx, cy - 14);
        ctx.lineTo(cx + 12, cy);
        ctx.lineTo(cx, cy + 14);
        ctx.lineTo(cx - 12, cy);
        ctx.closePath();
        ctx.stroke();
    } else if (item.type === "rock") {
        // 바위 (이끼/얼음/강철)
        const isMoss = item.id === "moss_rock";
        const isMetal = item.id === "metal_rock";
        // 바위 본체
        ctx.fillStyle = isMetal ? "#90A4AE" : "#6B6258";
        ctx.beginPath();
        ctx.ellipse(cx, cy + 2, 13, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = isMetal ? "#607D8B" : "#5A4F45";
        ctx.beginPath();
        ctx.ellipse(cx, cy + 5, 13, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        if (isMetal) {
            // 강철 광택
            ctx.fillStyle = "#CFD8DC";
            ctx.beginPath();
            ctx.ellipse(cx - 4, cy - 3, 5, 2, -0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 4, cy - 5, 4, 1.5, 0.4, 0, Math.PI * 2);
            ctx.fill();
            // 볼트
            ctx.fillStyle = "#37474F";
            ctx.beginPath(); ctx.arc(cx - 7, cy + 3, 1.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + 7, cy + 3, 1.5, 0, Math.PI * 2); ctx.fill();
        } else if (isMoss) {
            ctx.fillStyle = "#4E8A38";
            ctx.beginPath();
            ctx.ellipse(cx - 4, cy - 4, 6, 3, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 5, cy - 3, 6, 3, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 1, cy - 7, 4, 2, 0, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // 얼음 결정
            ctx.fillStyle = "#A8D8F0";
            ctx.beginPath();
            ctx.moveTo(cx, cy - 12);
            ctx.lineTo(cx + 8, cy - 2);
            ctx.lineTo(cx + 4, cy + 4);
            ctx.lineTo(cx - 4, cy + 4);
            ctx.lineTo(cx - 8, cy - 2);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.beginPath();
            ctx.moveTo(cx, cy - 12);
            ctx.lineTo(cx + 3, cy - 5);
            ctx.lineTo(cx - 1, cy - 1);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#5599C8"; ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(cx, cy - 12);
            ctx.lineTo(cx + 8, cy - 2);
            ctx.lineTo(cx + 4, cy + 4);
            ctx.lineTo(cx - 4, cy + 4);
            ctx.lineTo(cx - 8, cy - 2);
            ctx.closePath();
            ctx.stroke();
        }
    } else if (item.type === "friend") {
        // 친밀도 = 하트 (낮: 노랑, 밤: 보라)
        const day = isDayWave();
        ctx.fillStyle = day ? "#FFD54F" : "#7E57C2";
        ctx.beginPath();
        ctx.moveTo(cx, cy + 10);
        ctx.bezierCurveTo(cx - 14, cy - 2, cx - 8, cy - 13, cx, cy - 5);
        ctx.bezierCurveTo(cx + 8, cy - 13, cx + 14, cy - 2, cx, cy + 10);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.6)";
        ctx.beginPath();
        ctx.ellipse(cx - 4, cy - 5, 3, 2, -0.5, 0, Math.PI * 2);
        ctx.fill();
        // 작은 표식 (낮 ☀ / 밤 ☾)
        ctx.fillStyle = "#fff"; ctx.font = "bold 9px system-ui";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(day ? "☀" : "☾", cx, cy + 1);
    } else if (item.type === "ribbon") {
        // 리본 (분홍 나비매듭)
        ctx.fillStyle = "#F48FB1";
        // 왼쪽 루프
        ctx.beginPath();
        ctx.ellipse(cx - 7, cy, 7, 5, -0.3, 0, Math.PI * 2);
        ctx.fill();
        // 오른쪽 루프
        ctx.beginPath();
        ctx.ellipse(cx + 7, cy, 7, 5, 0.3, 0, Math.PI * 2);
        ctx.fill();
        // 중앙 매듭
        ctx.fillStyle = "#EC407A";
        ctx.fillRect(cx - 3, cy - 4, 6, 8);
        // 꼬리
        ctx.fillStyle = "#F48FB1";
        ctx.beginPath();
        ctx.moveTo(cx - 3, cy + 4);
        ctx.lineTo(cx - 5, cy + 12);
        ctx.lineTo(cx - 1, cy + 10);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(cx + 3, cy + 4);
        ctx.lineTo(cx + 5, cy + 12);
        ctx.lineTo(cx + 1, cy + 10);
        ctx.closePath();
        ctx.fill();
        // 하이라이트
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.beginPath();
        ctx.ellipse(cx - 9, cy - 1, 2, 1, 0, 0, Math.PI * 2);
        ctx.fill();
    } else {
        // 기타(팬메이드 진화 아이템) - 진화체 스프라이트로 표현
        const img = item.sprite ? images[item.sprite] : null;
        if (img && img.complete) {
            ctx.drawImage(img, cx - 14, cy - 14, 28, 28);
        }
    }
}

function drawHUD() {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";

    // === 상단 영역 (0~110) ===
    // 낮/밤 배지 (좌측)
    const day = isDayWave();
    ctx.fillStyle = day ? "rgba(255,193,7,0.9)" : "rgba(40,53,147,0.9)";
    ctx.beginPath();
    ctx.roundRect(10, 10, 90, 36, 18);
    ctx.fill();
    ctx.strokeStyle = day ? "#FFC107" : "#3F51B5"; ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.font = "bold 17px system-ui";
    ctx.fillText(day ? "☀ 낮" : "☾ 밤", 55, 28);

    // 웨이브 배지 (중앙 상단)
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.beginPath();
    ctx.roundRect(CW / 2 - 70, 10, 140, 36, 18);
    ctx.fill();
    ctx.fillStyle = "#FFD54F"; ctx.font = "bold 19px system-ui";
    ctx.fillText(`WAVE ${wave}`, CW / 2, 28);

    // 코인 (우측 상단)
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.beginPath();
    ctx.roundRect(CW - 130, 10, 120, 36, 18);
    ctx.fill();
    const coinX = CW - 112, coinY = 28;
    ctx.fillStyle = "#FFD700";
    ctx.beginPath(); ctx.arc(coinX, coinY, 11, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#B8860B"; ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#B8860B"; ctx.font = "bold 13px system-ui";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("$", coinX, coinY + 1);
    ctx.fillStyle = "#FFD700"; ctx.font = "bold 18px system-ui";
    ctx.textAlign = "left";
    ctx.fillText(`${coins}`, coinX + 16, coinY);
    ctx.textAlign = "center";

    // 리더보드 버튼 (우측, 코인 아래)
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.beginPath();
    ctx.roundRect(LB_BTN.x, LB_BTN.y, LB_BTN.w, LB_BTN.h, 8);
    ctx.fill();
    ctx.strokeStyle = "#FFD700"; ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.fillStyle = "#FFD700"; ctx.font = "bold 18px system-ui";
    ctx.textBaseline = "middle";
    ctx.fillText("🏆", LB_BTN.x + LB_BTN.w / 2, LB_BTN.y + LB_BTN.h / 2);

    // 인벤토리 (낮/밤 배지 아래)
    if (inventory.size > 0) {
        const itemSize = 30;
        const itemGap = 4;
        let ix = 10, iy = 54;
        let cnt = 0;
        for (const it of ITEMS) {
            if (!inventory.has(it.id)) continue;
            ctx.fillStyle = "rgba(0,0,0,0.55)";
            ctx.beginPath();
            ctx.roundRect(ix, iy, itemSize, itemSize, 5);
            ctx.fill();
            ctx.strokeStyle = "rgba(255,215,0,0.5)"; ctx.lineWidth = 1;
            ctx.stroke();
            const img = images[it.sprite];
            if (img && img.complete) ctx.drawImage(img, ix + 2, iy + 2, itemSize - 4, itemSize - 4);
            ix += itemSize + itemGap;
            cnt++;
            if (cnt % 3 === 0) { ix = 10; iy += itemSize + itemGap; }
        }
    }

    // === 타이머 + 필드 카운터 (웨이브 아래) ===
    if (gameState === "playing") {
        const remain = Math.max(0, Math.ceil(waveTimer / 60));
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.beginPath();
        ctx.roundRect(CW / 2 - 50, 52, 100, 32, 16);
        ctx.fill();
        ctx.fillStyle = remain < 10 ? "#F44336" : "#fff";
        ctx.font = "bold 22px system-ui";
        ctx.fillText(`${remain}s`, CW / 2, 68);

        const aliveCount = monsters.filter(m => m.hp > 0).length;
        const queuedCount = waveSpawnQueue.length;
        const fieldColor = aliveCount >= OVERFLOW_LIMIT ? "#F44336"
            : aliveCount >= OVERFLOW_LIMIT - 8 ? "#FF9800"
            : "rgba(255,255,255,0.7)";
        ctx.fillStyle = fieldColor; ctx.font = "bold 14px system-ui";
        ctx.fillText(`필드 ${aliveCount} / 50  ·  잔여 ${aliveCount + queuedCount}`, CW / 2, 95);

        // 라운드 클리어 시 - 화면 전체가 탭 영역, 중앙에 안내 텍스트만
        if (isRoundClear()) {
            const pulse = 0.6 + 0.4 * Math.sin(frame * 0.1);
            ctx.fillStyle = `rgba(0,0,0,${pulse * 0.2})`;
            ctx.fillRect(0, 0, CW, CH);
            ctx.fillStyle = `rgba(255,255,255,${pulse})`;
            ctx.font = "bold 24px system-ui";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.strokeStyle = "rgba(0,0,0,0.7)"; ctx.lineWidth = 4;
            const msg = "▶ 화면을 탭하여 다음 라운드";
            ctx.strokeText(msg, CW / 2, CH / 2);
            ctx.fillText(msg, CW / 2, CH / 2);
        }
    }

    // === 하단 바 ===
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(0, BAR_Y, CW, BAR_H);
    ctx.strokeStyle = "rgba(255,255,255,0.1)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, BAR_Y); ctx.lineTo(CW, BAR_Y); ctx.stroke();

    // 이브이 추가 버튼
    const cost = getEeveeCost();
    const maxSlots = getEeveeMaxSlots();
    const slotFull = eevees.length >= maxSlots;
    const canBuy = coins >= cost && !slotFull;
    ctx.fillStyle = canBuy ? "rgba(76,175,80,0.8)" : "rgba(100,100,100,0.6)";
    ctx.beginPath();
    ctx.roundRect(BUY_BTN.x, BUY_BTN.y, BUY_BTN.w, BUY_BTN.h, 8);
    ctx.fill();
    ctx.strokeStyle = canBuy ? "#66BB6A" : "#666";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // 좌측: + 이브이 버튼
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.font = "bold 14px system-ui";
    ctx.fillText(`이브이 ${eevees.length} / ${maxSlots}`, BUY_BTN.x, BAR_Y + 30);

    ctx.fillStyle = canBuy ? canBuy : "rgba(100,100,100,0.6)";
    ctx.fillStyle = canBuy ? "rgba(76,175,80,0.85)" : "rgba(100,100,100,0.6)";
    ctx.beginPath();
    ctx.roundRect(BUY_BTN.x, BUY_BTN.y, BUY_BTN.w, BUY_BTN.h, 12);
    ctx.fill();
    ctx.strokeStyle = canBuy ? "#66BB6A" : "#666";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = canBuy ? "#fff" : "#999";
    ctx.font = "bold 19px system-ui";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (slotFull) {
        ctx.fillText(`슬롯 가득참`, BUY_BTN.x + BUY_BTN.w / 2, BUY_BTN.y + BUY_BTN.h / 2);
    } else {
        ctx.fillText(`+ 이브이 (${cost})`, BUY_BTN.x + BUY_BTN.w / 2, BUY_BTN.y + BUY_BTN.h / 2);
    }

    // 우측: 선택된 이브이 액션 패널 (레벨업)
    if (selectedEevee) {
        ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
        ctx.fillStyle = "#FFD54F"; ctx.font = "bold 14px system-ui";
        let lvText = `Lv.${selectedEevee.level}`;
        if (selectedEevee.sprite === "이브이.png") {
            const mul = getFriendshipSellMul(selectedEevee);
            lvText += `   ♥${selectedEevee.friendship} (판매×${mul})`;
        }
        ctx.fillText(lvText, LVL_BTN.x, BAR_Y + 30);

        // 레벨업 버튼
        const lvCost = getLevelUpCost(selectedEevee);
        const canLvl = coins >= lvCost;
        ctx.fillStyle = canLvl ? "rgba(255,193,7,0.9)" : "rgba(100,100,100,0.6)";
        ctx.beginPath();
        ctx.roundRect(LVL_BTN.x, LVL_BTN.y, LVL_BTN.w, LVL_BTN.h, 12);
        ctx.fill();
        ctx.strokeStyle = canLvl ? "#FFB300" : "#666"; ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = canLvl ? "#fff" : "#999";
        ctx.font = "bold 19px system-ui";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(`▲ 레벨업 (${lvCost})`, LVL_BTN.x + LVL_BTN.w / 2, LVL_BTN.y + LVL_BTN.h / 2);
    } else {
        ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
        ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.font = "13px system-ui";
        ctx.fillText("이브이를 탭하여 선택", LVL_BTN.x, BAR_Y + 30);
        // 비활성 박스
        ctx.fillStyle = "rgba(60,60,60,0.4)";
        ctx.beginPath();
        ctx.roundRect(LVL_BTN.x, LVL_BTN.y, LVL_BTN.w, LVL_BTN.h, 12);
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.15)"; ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,0.3)";
        ctx.font = "bold 17px system-ui";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(`▲ 레벨업`, LVL_BTN.x + LVL_BTN.w / 2, LVL_BTN.y + LVL_BTN.h / 2);
    }

    // === 상점 패널 (선택된 이브이가 기본 이브이일 때) ===
    if (selectedEevee && selectedEevee.sprite === "이브이.png") {
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.beginPath();
        ctx.roundRect(10, EVO_PANEL_Y, CW - 20, EVO_PANEL_H, 10);
        ctx.fill();
        ctx.strokeStyle = "rgba(255,215,0,0.3)"; ctx.lineWidth = 1;
        ctx.stroke();

        // 정식 8종 모두 진화했으면 팬메이드 상점, 아니면 정식 상점
        const baseAllDone = [0,1,2,3,4,5,6,7].every(i => isEvolutionTaken(i));
        const tier = baseAllDone ? "fan" : "base";

        ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.font = "bold 13px system-ui";
        const tierLabel = baseAllDone ? "★ 팬메이드 ★" : "상점";
        ctx.fillText(`${tierLabel}  |  ${isDayWave() ? "☀ 낮" : "☾ 밤"}`, CW / 2, EVO_PANEL_Y + 14);

        // 현재 티어 + 보유 안한 진화만
        const visibleShop = SHOP_ITEMS.filter(item => {
            if (item.tier !== tier) return false;
            const targetEvoIdx = getEvoIdxFromItem(item);
            return !isEvolutionTaken(targetEvoIdx);
        });
        currentVisibleShop = visibleShop;

        // 동적 아이콘 폭 (많은 슬롯 수용)
        const iconW = Math.min(72, Math.floor((CW - 30) / Math.max(1, visibleShop.length)));
        const totalW = visibleShop.length * iconW;
        const startX = CW / 2 - totalW / 2;

        for (let i = 0; i < visibleShop.length; i++) {
            const item = visibleShop[i];
            const ex = startX + i * iconW + iconW / 2;
            const ey = EVO_PANEL_Y + 60;

            const canAfford = coins >= item.cost;
            const condOk = checkShopItemConditions(selectedEevee, item);
            const canBuyItem = canAfford && condOk;

            // 아이콘 배경 (더 진하게)
            ctx.fillStyle = canBuyItem ? "rgba(255,255,255,0.15)" : "rgba(20,20,20,0.55)";
            ctx.beginPath();
            ctx.roundRect(ex - iconW/2 + 2, ey - 28, iconW - 4, 76, 8);
            ctx.fill();
            if (canBuyItem) {
                ctx.strokeStyle = tier === "fan" ? "rgba(255,100,255,0.65)" : "rgba(255,215,0,0.55)";
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            // 아이콘
            ctx.save();
            if (!canBuyItem) ctx.globalAlpha = 0.45;
            drawShopItemIcon(item, ex, ey - 4);
            ctx.restore();

            // 이름 (가독성 ↑)
            ctx.fillStyle = canBuyItem ? "#fff" : "rgba(255,255,255,0.55)";
            ctx.font = "bold 12px system-ui";
            ctx.fillText(item.name, ex, ey + 26);
            // 비용
            ctx.fillStyle = canAfford ? "#FFD700" : "rgba(200,180,80,0.6)";
            ctx.font = "bold 14px system-ui";
            ctx.fillText(`${item.cost}`, ex, ey + 42);

            // 조건 미충족 표시 (아이콘 위쪽, 배경 안 - 상점 타이틀과 겹치지 않게)
            if (!condOk) {
                let hint = "";
                if (item.reqLevel && selectedEevee.level < item.reqLevel) hint = `Lv${item.reqLevel}`;
                else if (item.reqFriend && selectedEevee.friendship < item.reqFriend) hint = `♥${item.reqFriend}`;
                else if (item.type === "buddy") hint = "메탈리아";
                else if (item.type === "bossKill") hint = `보스${item.reqBossKills}`;
                else if (item.type === "timed") hint = item.reqDay ? "낮" : "밤";
                else if (item.type === "killCount") hint = `처치${item.reqKills}`;
                else if (item.type === "specificKill") hint = item.reqKillName;
                else if (item.type === "itemHeld") {
                    const reqItem = ITEMS.find(it => it.id === item.reqItemId);
                    hint = reqItem ? reqItem.name : "아이템";
                }
                if (hint) {
                    // 배경 작은 박스
                    ctx.font = "bold 10px system-ui";
                    const tw = ctx.measureText(hint).width + 6;
                    ctx.fillStyle = "rgba(244,67,54,0.85)";
                    ctx.beginPath();
                    ctx.roundRect(ex - tw/2, ey - 23, tw, 14, 3);
                    ctx.fill();
                    ctx.fillStyle = "#fff";
                    ctx.fillText(hint, ex, ey - 14);
                }
            }
        }
    } else if (selectedEevee && selectedEevee.sprite !== "이브이.png") {
        // 진화체 정보 + 스킬
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.beginPath();
        ctx.roundRect(10, EVO_PANEL_Y, CW - 20, EVO_PANEL_H, 10);
        ctx.fill();
        ctx.strokeStyle = "rgba(255,215,0,0.3)"; ctx.lineWidth = 1;
        ctx.stroke();

        const img = images[selectedEevee.sprite];
        if (img && img.complete) ctx.drawImage(img, 18, EVO_PANEL_Y + 14, 64, 64);

        ctx.textAlign = "left";
        ctx.fillStyle = "#fff"; ctx.font = "bold 14px system-ui";
        ctx.fillText(`${selectedEevee.name || selectedEevee.sprite.replace(".png","")}`, 88, EVO_PANEL_Y + 18);
        // 타입 배지
        const eeType = selectedEevee.type;
        if (eeType) {
            const eeTypeKo = typeNameKo(eeType);
            ctx.font = "bold 11px system-ui";
            const tw = ctx.measureText(eeTypeKo).width + 12;
            ctx.fillStyle = getTypeColor(eeType);
            ctx.beginPath();
            ctx.roundRect(88, EVO_PANEL_Y + 26, tw, 16, 4);
            ctx.fill();
            ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.lineWidth = 0.8;
            ctx.stroke();
            ctx.fillStyle = "#fff";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(eeTypeKo, 88 + tw / 2, EVO_PANEL_Y + 34);
            ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
            // 카테고리 옆에
            ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.font = "11px system-ui";
            ctx.fillText(selectedEevee.category === "phys" ? "물리" : "특수", 88 + tw + 8, EVO_PANEL_Y + 38);
        }
        ctx.fillStyle = "#FFD54F"; ctx.font = "12px system-ui";
        ctx.fillText(`물리공격 ${selectedEevee.atk}  특수공격 ${selectedEevee.spAtk}  사거리 ${selectedEevee.range}`, 88, EVO_PANEL_Y + 50);

        // 스킬 게이지 (3개)
        const sk1Lv = getSkill1Unlock(selectedEevee);
        const sk2Lv = getSkill2Unlock(selectedEevee);
        const sk3Lv = getSkill3Unlock(selectedEevee);
        const barW = CW - 100;
        const drawSkBar = (skill, cd, lv, label, yOff) => {
            if (!skill) return;
            const unlocked = selectedEevee.level >= lv;
            const r = unlocked ? 1 - cd / skill.cd : 0;
            ctx.fillStyle = "rgba(255,255,255,0.15)";
            ctx.fillRect(88, EVO_PANEL_Y + yOff, barW - 88, 10);
            ctx.fillStyle = unlocked ? skill.color : "rgba(100,100,100,0.5)";
            ctx.fillRect(88, EVO_PANEL_Y + yOff, (barW - 88) * Math.min(1, r), 10);
            ctx.fillStyle = unlocked ? "#fff" : "#888"; ctx.font = "bold 11px system-ui";
            ctx.fillText(unlocked ? `${label} ${skill.name}` : `${label} ${skill.name} (Lv${lv})`, 92, EVO_PANEL_Y + yOff + 5);
        };
        drawSkBar(selectedEevee.skill1, selectedEevee.skill1Cd, sk1Lv, "Ⓟ", 64);
        drawSkBar(selectedEevee.skill2, selectedEevee.skill2Cd, sk2Lv, "Ⓢ", 82);
        drawSkBar(selectedEevee.skill3, selectedEevee.skill3Cd, sk3Lv, "Ⓤ", 100);
        ctx.textAlign = "center";
    }

    // === 선택된 몬스터 정보 ===
    if (selectedMonster && selectedMonster.hp > 0) {
        const m = selectedMonster;
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.beginPath();
        ctx.roundRect(10, EVO_PANEL_Y, CW - 20, EVO_PANEL_H, 10);
        ctx.fill();
        ctx.strokeStyle = "rgba(244,67,54,0.5)"; ctx.lineWidth = 1.5;
        ctx.stroke();

        const img = images[m.sprite];
        if (img && img.complete) ctx.drawImage(img, 18, EVO_PANEL_Y + 14, 64, 64);

        ctx.textAlign = "left";
        ctx.fillStyle = "#fff"; ctx.font = "bold 15px system-ui";
        const tag = m.isRaid ? " ⚡RAID⚡" : (m.isBoss ? " ★" : "");
        ctx.fillText(`${m.name}${tag}`, 88, EVO_PANEL_Y + 18);
        // 타입 배지 (색상)
        const typesArr = m.types && m.types.length > 0 ? m.types : [m.type];
        let tx = 88;
        for (const t of typesArr) {
            const tKo = typeNameKo(t);
            ctx.font = "bold 11px system-ui";
            const tw = ctx.measureText(tKo).width + 12;
            ctx.fillStyle = getTypeColor(t);
            ctx.beginPath();
            ctx.roundRect(tx, EVO_PANEL_Y + 28, tw, 16, 4);
            ctx.fill();
            ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.lineWidth = 0.8;
            ctx.stroke();
            ctx.fillStyle = "#fff";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(tKo, tx + tw / 2, EVO_PANEL_Y + 36);
            tx += tw + 4;
        }
        ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";

        // HP 바
        const hpRatio = m.hp / m.maxHp;
        const barW2 = CW - 100;
        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(88, EVO_PANEL_Y + 46, barW2 - 88, 12);
        ctx.fillStyle = hpRatio > 0.5 ? "#4CAF50" : hpRatio > 0.2 ? "#FF9800" : "#F44336";
        ctx.fillRect(88, EVO_PANEL_Y + 46, (barW2 - 88) * hpRatio, 12);
        ctx.fillStyle = "#fff"; ctx.font = "bold 11px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(`HP ${Math.max(0, Math.ceil(m.hp))} / ${m.maxHp}`, 88 + (barW2 - 88) / 2, EVO_PANEL_Y + 53);

        ctx.textAlign = "left";
        ctx.fillStyle = "#FFD54F"; ctx.font = "12px system-ui";
        ctx.fillText(`물리방어 ${m.mDef}  특수방어 ${m.sDef}`, 88, EVO_PANEL_Y + 76);

        // 상태이상
        const statusList = m.statuses ? Object.keys(m.statuses) : [];
        if (statusList.length > 0) {
            const statusColors = { burn:"#FF5722", poison:"#9C27B0", freeze:"#4FC3F7", paralysis:"#FFEB3B", sleep:"#90A4AE", slow:"#90CAF9", defDown:"#F48FB1", mDefDown:"#EC407A", sDefDown:"#BA68C8" };
            let sx2 = 88;
            for (const k of statusList) {
                const txt = statusNameKo(k);
                ctx.fillStyle = statusColors[k] || "#fff";
                ctx.font = "bold 11px system-ui";
                const w = ctx.measureText(txt).width + 10;
                ctx.fillStyle = `${statusColors[k]}33`;
                ctx.fillRect(sx2, EVO_PANEL_Y + 92, w, 16);
                ctx.fillStyle = statusColors[k];
                ctx.fillText(txt, sx2 + 5, EVO_PANEL_Y + 100);
                sx2 += w + 4;
            }
        } else {
            ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.font = "11px system-ui";
            ctx.fillText("상태이상 없음", 88, EVO_PANEL_Y + 100);
        }
        ctx.textAlign = "center";
    }

    // === 선택된 아이템 정보 ===
    if (selectedItem) {
        const it = ITEMS.find(i => i.id === selectedItem);
        if (it) {
            ctx.fillStyle = "rgba(0,0,0,0.75)";
            ctx.beginPath();
            ctx.roundRect(10, EVO_PANEL_Y, CW - 20, EVO_PANEL_H, 10);
            ctx.fill();
            ctx.strokeStyle = "rgba(255,215,0,0.5)"; ctx.lineWidth = 1.5;
            ctx.stroke();

            const img = images[it.sprite];
            if (img && img.complete) ctx.drawImage(img, 18, EVO_PANEL_Y + 14, 64, 64);

            ctx.textAlign = "left";
            ctx.fillStyle = "#FFD700"; ctx.font = "bold 18px system-ui";
            ctx.fillText(it.name, 92, EVO_PANEL_Y + 30);
            ctx.fillStyle = "#fff"; ctx.font = "14px system-ui";
            const desc = it.desc;
            ctx.fillText(desc, 92, EVO_PANEL_Y + 60);
            ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.font = "11px system-ui";
            ctx.fillText("글로벌 패시브 효과", 78, EVO_PANEL_Y + 56);
            ctx.textAlign = "center";
        }
    }

    // === 선택된 바위 정보 ===
    if (selectedRock) {
        const rt = selectedRock.type;
        const isMoss = rt === "moss";
        const isMetal = rt === "metal";
        const isIce = rt === "ice";
        ctx.fillStyle = "rgba(0,0,0,0.75)";
        ctx.beginPath();
        ctx.roundRect(10, EVO_PANEL_Y, CW - 20, EVO_PANEL_H, 10);
        ctx.fill();
        ctx.strokeStyle = isMoss ? "rgba(120,200,80,0.6)" : isMetal ? "rgba(180,200,210,0.7)" : "rgba(140,210,255,0.6)";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 바위 미니 아이콘
        ctx.save();
        const cx = 50, cy = EVO_PANEL_Y + 50;
        if (isMoss) {
            ctx.fillStyle = "#6B6258";
            ctx.beginPath(); ctx.ellipse(cx, cy, 18, 13, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#4E8A38";
            ctx.beginPath(); ctx.ellipse(cx - 6, cy - 6, 8, 4, -0.3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(cx + 7, cy - 4, 9, 4, 0.3, 0, Math.PI * 2); ctx.fill();
        } else if (isMetal) {
            ctx.fillStyle = "#90A4AE";
            ctx.beginPath(); ctx.ellipse(cx, cy, 18, 13, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#CFD8DC";
            ctx.beginPath(); ctx.ellipse(cx - 5, cy - 4, 7, 3, -0.4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#37474F";
            ctx.beginPath(); ctx.arc(cx - 10, cy + 4, 1.8, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + 10, cy + 4, 1.8, 0, Math.PI * 2); ctx.fill();
        } else {
            ctx.fillStyle = "#A8D8F0";
            ctx.beginPath();
            ctx.moveTo(cx, cy - 14); ctx.lineTo(cx + 16, cy);
            ctx.lineTo(cx + 8, cy + 10); ctx.lineTo(cx - 8, cy + 10);
            ctx.lineTo(cx - 16, cy); ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#5599C8"; ctx.lineWidth = 1; ctx.stroke();
        }
        ctx.restore();

        const name = isMoss ? "이끼바위" : isMetal ? "강철바위" : "얼음바위";
        const desc = isMoss ? "주변 이브이즈 사거리 +20%"
            : isMetal ? "주변 이브이즈 평타 데미지 +10%"
            : "주변 몬스터 이동속도 -60% (빙결)";
        const color = isMoss ? "#9CCC65" : isMetal ? "#B0BEC5" : "#81D4FA";

        ctx.textAlign = "left";
        ctx.fillStyle = color; ctx.font = "bold 18px system-ui";
        ctx.fillText(name, 92, EVO_PANEL_Y + 30);
        ctx.fillStyle = "#fff"; ctx.font = "14px system-ui";
        ctx.fillText(desc, 92, EVO_PANEL_Y + 60);
        ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.font = "11px system-ui";
        ctx.fillText(`효과 반경 ${Math.round(getRockBuffRadius(rt))}px  |  드래그로 이동`, 92, EVO_PANEL_Y + 84);
        ctx.textAlign = "center";
    }

    // === 농장 과포화 경고 (유예 라운드) ===
    if (overflowActive) {
        const isFinalRound = wave > overflowGraceWave; // 유예 라운드 진행 중
        const pulse = 0.3 + 0.2 * Math.sin(frame * 0.2);
        const tint = isFinalRound ? "rgba(244,67,54," : "rgba(255,152,0,";
        ctx.fillStyle = tint + (pulse * 0.15) + ")";
        ctx.fillRect(0, 0, CW, CH);
        // 중앙 경고 박스
        ctx.fillStyle = "rgba(0,0,0,0.78)";
        ctx.beginPath();
        ctx.roundRect(CW / 2 - 150, 130, 300, 78, 14);
        ctx.fill();
        ctx.strokeStyle = isFinalRound ? "#F44336" : "#FF9800"; ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.font = "bold 15px system-ui";
        const warnMsg = overflowReason === "boss" ? "보스 다중 침입!" : "농장 과포화!";
        ctx.fillText(warnMsg, CW / 2, 152);
        ctx.fillStyle = isFinalRound ? "#F44336" : "#FFB74D";
        ctx.font = "bold 13px system-ui";
        if (isFinalRound) {
            ctx.fillText(`마지막 기회! 라운드 종료까지 정리하라`, CW / 2, 178);
        } else {
            ctx.fillText(`다음 라운드 종료까지 정리해야 한다`, CW / 2, 178);
        }
        ctx.fillStyle = "#fff"; ctx.font = "bold 11px system-ui";
        ctx.fillText(`(한 번이라도 안전 시 해제)`, CW / 2, 196);
    }

    // === 컷신 오버레이 ===
    if (gameState === "cutscene") {
        const progress = (180 - cutsceneTimer) / 180;
        ctx.fillStyle = `rgba(100,0,0,${progress * 0.5})`;
        ctx.fillRect(0, 0, CW, CH);

        if (progress > 0.3) {
            ctx.fillStyle = "#fff"; ctx.font = "bold 26px system-ui";
            ctx.strokeStyle = "#000"; ctx.lineWidth = 4;
            ctx.strokeText("농장이 침입당했다!", CW / 2, CH / 2);
            ctx.fillText("농장이 침입당했다!", CW / 2, CH / 2);
        }
    }

    // Game over
    if (gameState === "gameover") {
        ctx.fillStyle = "rgba(0,0,0,0.75)";
        ctx.fillRect(0, 0, CW, CH);

        ctx.fillStyle = "#F44336"; ctx.font = "bold 36px system-ui";
        ctx.strokeStyle = "#000"; ctx.lineWidth = 3;
        ctx.strokeText("GAME OVER", CW / 2, CH / 2 - 30);
        ctx.fillText("GAME OVER", CW / 2, CH / 2 - 30);

        ctx.fillStyle = "#fff"; ctx.font = "16px system-ui";
        ctx.fillText(`Wave ${wave} 도달`, CW / 2, CH / 2 + 10);

        ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.font = "13px system-ui";
        ctx.fillText("터치하여 재시작", CW / 2, CH / 2 + 50);
    }
}

function drawSellZone() {
    if (!dragging || !eevees.includes(dragging)) return;
    const inZone = hitRect({x: dragging.x, y: dragging.y}, SELL_ZONE);
    const pulse = 0.6 + 0.4 * Math.sin(frame * 0.15);
    ctx.save();
    ctx.fillStyle = inZone ? `rgba(244,67,54,${pulse * 0.85})` : "rgba(0,0,0,0.6)";
    ctx.beginPath();
    ctx.roundRect(SELL_ZONE.x, SELL_ZONE.y, SELL_ZONE.w, SELL_ZONE.h, 12);
    ctx.fill();
    ctx.strokeStyle = inZone ? "#FFEB3B" : "#F44336";
    ctx.lineWidth = inZone ? 3 : 2;
    ctx.setLineDash(inZone ? [] : [6, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    // 코인 아이콘
    const cx = SELL_ZONE.x + SELL_ZONE.w / 2;
    const cy = SELL_ZONE.y + 22;
    ctx.fillStyle = "#FFD700";
    ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#B8860B"; ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#B8860B"; ctx.font = "bold 13px system-ui";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("$", cx, cy + 1);

    // 텍스트
    ctx.fillStyle = "#fff"; ctx.font = "bold 11px system-ui";
    ctx.fillText("판매", cx, SELL_ZONE.y + 44);
    ctx.fillStyle = "#FFD700"; ctx.font = "bold 13px system-ui";
    ctx.fillText(`+${getSellPrice(dragging)}`, cx, SELL_ZONE.y + 62);
    ctx.restore();
}

function drawSplash() {
    drawBackground();
    // 어두운 오버레이
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, 0, CW, CH);

    // 타이틀
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#FFD54F";
    ctx.font = "bold 44px system-ui";
    ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 6 * SHADOW_BLUR_MUL;
    ctx.fillText("이브이즈 농장", CW / 2, CH / 2 - 100);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#fff";
    ctx.font = "16px system-ui";
    ctx.fillText("Eevee Tower Defense", CW / 2, CH / 2 - 70);

    // 이브이즈 스프라이트 일렬
    const evoNames = ["이브이.png","샤미드.png","쥬피썬더.png","부스터.png","에브이.png","블래키.png","리피아.png","글레이시아.png","님피아.png"];
    const sprW = 46, gap = 4;
    const totalW = evoNames.length * (sprW + gap) - gap;
    let sx = CW / 2 - totalW / 2;
    const sy = CH / 2 - 30;
    for (let i = 0; i < evoNames.length; i++) {
        const img = images[evoNames[i]];
        if (img && img.complete) {
            const bob = Math.sin(frame * 0.05 + i * 0.5) * 4;
            ctx.drawImage(img, sx, sy + bob, sprW, sprW);
        }
        sx += sprW + gap;
    }

    // 안내
    const pulse = 0.5 + 0.5 * Math.sin(frame * 0.08);
    ctx.fillStyle = `rgba(255,255,255,${pulse})`;
    ctx.font = "bold 18px system-ui";
    ctx.fillText("▶ 화면을 탭하여 시작", CW / 2, CH / 2 + 60);

    // TOP 3 미니 표시
    if (rankingData.length > 0) {
        ctx.fillStyle = "#FFD700"; ctx.font = "bold 13px system-ui";
        ctx.fillText("🏆 TOP 3 🏆", CW / 2, CH / 2 + 110);
        ctx.font = "12px system-ui";
        for (let i = 0; i < Math.min(3, rankingData.length); i++) {
            const r = rankingData[i];
            const color = i === 0 ? "#FFD700" : i === 1 ? "#C0C0C0" : "#CD7F32";
            ctx.fillStyle = color;
            const name = (r.nickname || "").toString().slice(0, 12);
            ctx.fillText(`${i + 1}. ${name}  -  W${r.wave}  (${r.evolved}진화)`, CW / 2, CH / 2 + 132 + i * 18);
        }
    }

    // 버전
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.font = "11px system-ui";
    ctx.fillText(GAME_VERSION, CW / 2, CH - 20);

    // 튜토리얼 다시 보기 버튼 (우측 하단)
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.beginPath();
    ctx.roundRect(CW - 60, CH - 60, 44, 44, 22);
    ctx.fill();
    ctx.strokeStyle = "#FFD700"; ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#FFD700"; ctx.font = "bold 22px system-ui";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("?", CW - 38, CH - 38);
}

function drawTutorialOverlay() {
    if (!tutorialActive) return;
    const step = TUTORIAL_STEPS[tutorialStep];
    if (!step) return;

    // 강조 펄스 (대상 위치)
    const pulse = 0.5 + 0.5 * Math.sin(frame * 0.1);

    // 단계별 강조 위치
    if (tutorialStep === 0) {
        // 이브이 강조
        const ee = eevees[0];
        if (ee) {
            ctx.save();
            ctx.strokeStyle = `rgba(255,215,0,${0.6 + pulse * 0.4})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(ee.x, ee.y, 30 + pulse * 8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }
    } else if (tutorialStep === 1) {
        // 이브이 강조 + 목표 위치 강조 + 화살표
        const ee = eevees[0];
        const tg = getTutorialTargetPos();
        if (ee) {
            ctx.save();
            // 이브이
            ctx.strokeStyle = `rgba(255,215,0,${0.5 + pulse * 0.3})`;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(ee.x, ee.y, 26, 0, Math.PI * 2);
            ctx.stroke();
            // 목표 지점 (펄스 원형)
            ctx.fillStyle = `rgba(76,175,80,${0.2 + pulse * 0.2})`;
            ctx.beginPath();
            ctx.ellipse(tg.x, tg.y, 32 + pulse * 8, 32 * ISO_Y + pulse * 4, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = `rgba(76,175,80,${0.7 + pulse * 0.3})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(tg.x, tg.y, 32, 32 * ISO_Y, 0, 0, Math.PI * 2);
            ctx.stroke();
            // 가운데 +
            ctx.fillStyle = `rgba(255,255,255,${0.7 + pulse * 0.3})`;
            ctx.font = "bold 22px system-ui";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText("◎", tg.x, tg.y);
            // 화살표 (이브이 → 목표)
            const dx = tg.x - ee.x, dy = tg.y - ee.y;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d > 50) {
                const ang = Math.atan2(dy, dx);
                const sx2 = ee.x + Math.cos(ang) * 28;
                const sy2 = ee.y + Math.sin(ang) * 28;
                const ex2 = tg.x - Math.cos(ang) * 36;
                const ey2 = tg.y - Math.sin(ang) * 36;
                ctx.strokeStyle = `rgba(255,235,59,${0.6 + pulse * 0.3})`;
                ctx.lineWidth = 3;
                ctx.setLineDash([8, 6]);
                ctx.beginPath();
                ctx.moveTo(sx2, sy2);
                ctx.lineTo(ex2, ey2);
                ctx.stroke();
                ctx.setLineDash([]);
                // 화살촉
                ctx.fillStyle = `rgba(255,235,59,${0.8 + pulse * 0.2})`;
                ctx.beginPath();
                ctx.moveTo(ex2, ey2);
                ctx.lineTo(ex2 - Math.cos(ang - 0.5) * 12, ey2 - Math.sin(ang - 0.5) * 12);
                ctx.lineTo(ex2 - Math.cos(ang + 0.5) * 12, ey2 - Math.sin(ang + 0.5) * 12);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }
    } else if (tutorialStep === 3) {
        // 레벨업 버튼 강조
        ctx.save();
        ctx.strokeStyle = `rgba(255,215,0,${0.6 + pulse * 0.4})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(LVL_BTN.x - 4, LVL_BTN.y - 4, LVL_BTN.w + 8, LVL_BTN.h + 8, 8);
        ctx.stroke();
        ctx.restore();
    } else if (tutorialStep === 4) {
        // 이브이 구매 버튼 강조
        ctx.save();
        ctx.strokeStyle = `rgba(255,215,0,${0.6 + pulse * 0.4})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(BUY_BTN.x - 4, BUY_BTN.y - 4, BUY_BTN.w + 8, BUY_BTN.h + 8, 10);
        ctx.stroke();
        ctx.restore();
    }

    // 메시지 박스 (상단)
    const boxY = 110, boxH = 80;
    ctx.fillStyle = "rgba(0,0,0,0.78)";
    ctx.beginPath();
    ctx.roundRect(20, boxY, CW - 40, boxH, 12);
    ctx.fill();
    ctx.strokeStyle = "#FFD700"; ctx.lineWidth = 2;
    ctx.stroke();

    // 단계 표시
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#FFD700"; ctx.font = "bold 11px system-ui";
    ctx.fillText(`STEP ${tutorialStep + 1} / ${TUTORIAL_STEPS.length}`, CW / 2, boxY + 16);

    // 메시지 (개행 지원)
    ctx.fillStyle = "#fff"; ctx.font = "bold 15px system-ui";
    const lines = step.msg.split("\n");
    let ty = boxY + 40;
    for (const ln of lines) {
        ctx.fillText(ln, CW / 2, ty);
        ty += 20;
    }

    // 스킵 버튼 (상단 메시지 우측)
    ctx.fillStyle = "rgba(100,100,100,0.85)";
    ctx.beginPath();
    ctx.roundRect(CW - 90, 200, 80, 40, 10);

    ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 1.5;
