const ISO_SCALE_Y = 0.5;
const ISO_OFFSET_Y = -40; // shift farm up a bit so walls are visible

function toIso(gx, gy) {
    const dx = gx - FARM_CX;
    const dy = gy - FARM_CY;
    return {
        x: FARM_CX + (dx - dy) * 0.866,
        y: FARM_CY + (dx + dy) * 0.5 * ISO_SCALE_Y + ISO_OFFSET_Y
    };
}

function fromIso(sx, sy) {
    const rx = sx - FARM_CX;
    const ry = (sy - FARM_CY - ISO_OFFSET_Y) / ISO_SCALE_Y;
    return {
        x: FARM_CX + (rx / 0.866 + ry) / 2,
        y: FARM_CY + (ry - rx / 0.866) / 2
    };
}

// Convert a game-space circle to isometric diamond points
function isoCirclePoints(cx, cy, radius, segments) {
    const pts = [];
    for (let i = 0; i < segments; i++) {
        const a = (i / segments) * Math.PI * 2;
        const gx = cx + Math.cos(a) * radius;
        const gy = cy + Math.sin(a) * radius;
        pts.push(toIso(gx, gy));
    }
    return pts;
}

// 아이템 적용된 effective 스탯
function getEeveeRange(ee) {
    let r = ee.range * (hasItem("wide") ? 1.08 : 1);
    if (ee.boostBuff > 0) r *= 1.3;
    if (ee.skillBuff && ee.skillBuff.range > 0) r *= 1.20;
    // 이끼바위 주변 사거리 +20%
    const mossR = getRockBuffRadius("moss");
    for (const rk of rocks) {
        if (rk.type !== "moss") continue;
        const dx = ee.x - rk.x, dy = (ee.y - rk.y) / ISO_Y;
        if (dx * dx + dy * dy < mossR * mossR) { r *= 1.20; break; }
    }
    return r;
}
function getEeveeAtkSpeed(ee) {
    let s = ee.atkSpeed * (hasItem("claw") ? 0.92 : 1);
    if (ee.boostBuff > 0) s *= 0.65;
    if (ee.skillBuff && ee.skillBuff.spd > 0) s *= 0.75;
    return Math.max(4, Math.floor(s));
}
function getEeveeAtk(ee) {
    let v = ee.atk;
    if (ee.boostBuff > 0) v *= 1.5;
    if (ee.skillBuff && ee.skillBuff.atk > 0) v *= 1.3;

        if (dx * dx + dy * dy < metalR * metalR) { v *= 1.06; break; }
    }
    return v;

}

function typeMul(atkType, defType) {
    if (!atkType || !defType) return 1;
    if (atkType === "normal" || defType === "normal") return 1; // 노멀은 항상 1배
    const row = TYPE_CHART[atkType];
    if (!row) return 1;
    const v = row[defType];
    if (v === undefined) return 1;
    if (v >= 2) return hasItem("belt") ? 1.3 : 1.2;   // 효과적 (달인의띠 +0.1)
    if (v <= 0.5) return hasItem("focus") ? 0.9 : 0.8; // 별로 (초점렌즈로 완화)
    return 1;
}

// 듀얼 타입 종합 배율 (target.types 또는 target.type 사용)
function totalTypeMul(atkType, target) {
    if (!target) return 1;
    if (target.types && target.types.length > 0) {
        let m = 1;
        for (const t of target.types) m *= typeMul(atkType, t);
        return m;
    }
    return typeMul(atkType, target.type);
}

// 밤낮 보너스 (타입 패시브 + 스킬 오버라이드)
// ═══════════════════════════════════════════
const DAY_TYPES = new Set(["fire","grass","normal","rock","ground","bug","flying"]);
const NIGHT_TYPES = new Set(["dark","ghost","ice","psychic","poison","fairy","dragon"]);
const DAY_TYPE_BONUS = 1.2;
const NIGHT_TYPE_BONUS = 1.2;

// 스킬에 dayMul/nightMul이 있으면 그걸 우선, 없으면 타입 패시브 적용
// 반환: { mul, isDay, isBoosted }
function getDayNightMul(atkType, skill) {
    const day = isDayWave();
    if (skill) {
        if (day && skill.dayMul !== undefined) return { mul: skill.dayMul, isDay: true, isBoosted: skill.dayMul > 1.05 };
        if (!day && skill.nightMul !== undefined) return { mul: skill.nightMul, isDay: false, isBoosted: skill.nightMul > 1.05 };
        // 반대 조건일 때 페널티가 정의돼 있으면 적용 (예: 솔라빔은 밤에 약함)
        if (day && skill.nightMul !== undefined && skill.dayMul === undefined && skill.nightMul > 1.05) {
            // 밤 강화 스킬은 낮엔 평범 (페널티 없음)
        }
        if (!day && skill.dayMul !== undefined && skill.nightMul === undefined && skill.dayMul > 1.05) {
            // 낮 강화 스킬은 밤엔 평범
        }
    }
    if (day && DAY_TYPES.has(atkType)) return { mul: DAY_TYPE_BONUS, isDay: true, isBoosted: true };
    if (!day && NIGHT_TYPES.has(atkType)) return { mul: NIGHT_TYPE_BONUS, isDay: false, isBoosted: true };
    return { mul: 1, isDay: day, isBoosted: false };
}

// FX 틴트 캐시 (fxKey + color → tinted canvas)
const _fxTintCache = new Map();
function getFxTinted(fxKey, img, color) {
    const cacheKey = fxKey + "|" + color;
    let cached = _fxTintCache.get(cacheKey);
    if (cached) return cached;
    const c = document.createElement("canvas");
    c.width = img.naturalWidth || 64;
    c.height = img.naturalHeight || 64;
    const cx = c.getContext("2d");
    cx.drawImage(img, 0, 0);
    cx.globalCompositeOperation = "source-in";
    cx.fillStyle = color;
    cx.fillRect(0, 0, c.width, c.height);
    _fxTintCache.set(cacheKey, c);
    return c;
}

// 개별 PNG로 이펙트 그리기 (틴트 + 키별 보정 + 회전 + 스케일 + 알파)
function drawFx(fxKey, x, y, opts = {}) {
    const img = images[`fx/${fxKey}`];
    if (!img || !img.complete || img.naturalWidth === 0) return false;

    const adj = FX_ADJUST[fxKey] || { rot: 0, scale: 1.0 };
    const baseSize = 64; // 출력 베이스 사이즈
    const scale = (opts.scale || 1) * adj.scale;
    const rotation = (opts.rotation || 0) + adj.rot;
    const alpha = opts.alpha != null ? opts.alpha : 1;
    const tintColor = opts.color || "#FFFFFF";
    const dw = baseSize * scale, dh = baseSize * scale;

    const tinted = getFxTinted(fxKey, img, tintColor);

    ctx.save();
    ctx.globalAlpha = alpha;
    if (rotation) {
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.drawImage(tinted, -dw / 2, -dh / 2, dw, dh);
    } else {
        ctx.drawImage(tinted, x - dw / 2, y - dh / 2, dw, dh);
    }
    ctx.restore();
    return true;
}

// 스킬 이펙트 (시각 효과)
const skillEffects = []; // {type, x, y, life, maxLife, color, radius}

function applySkillDamage(target, ee, skill, isSpec) {
    if (!target || target.hp <= 0) return;
    const baseAtk = isSpec ? getEeveeSpAtk(ee) : ee.atk;
    const defStat = getMonsterDef(target, isSpec);
    const baseDmg = Math.max(1, baseAtk * skill.mul - defStat * 0.3);
    const mul = totalTypeMul(ee.type, target);
    const dn = getDayNightMul(ee.type, skill);
    const dmg = Math.max(1, Math.round(baseDmg * mul * dn.mul));
    const wasAlive = target.hp > 0;
    target.hp -= dmg;
    if (wasAlive && target.hp <= 0 && ee) {
        ee.kills = (ee.kills || 0) + 1;
        ee.killNames = ee.killNames || {};
        ee.killNames[target.name] = (ee.killNames[target.name] || 0) + 1;
    }
    target.hitAnim = 8;

    // 스플래시 (single/melee/dash/chain만, aoe 제외)
    if (skill.effect !== "aoe" && skill.splashRadius !== 0) {
        const splashR = skill.splashRadius || 25;
        const splashMul = 0.4;
        for (const m of monsters) {
            if (m === target || m.hp <= 0) continue;
            const dx = m.x - target.x, dy = (m.y - target.y) / ISO_Y;
            if (dx * dx + dy * dy < splashR * splashR) {
                const sDef = getMonsterDef(m, isSpec);
                const sBase = Math.max(1, baseAtk * skill.mul * splashMul - sDef * 0.3);
                const sMul = totalTypeMul(ee.type, m);
                const sDmg = Math.max(1, Math.round(sBase * sMul * dn.mul));
                const sWasAlive = m.hp > 0;
                m.hp -= sDmg;
                m.hitAnim = 6;
                if (sWasAlive && m.hp <= 0 && ee) {
                    ee.kills = (ee.kills || 0) + 1;
                    ee.killNames = ee.killNames || {};
                    ee.killNames[m.name] = (ee.killNames[m.name] || 0) + 1;
                }
            }
        }
        // 작은 스플래시 링 이펙트
        skillEffects.push({ type:"shockwave", x: target.x, y: target.y, life: 14, maxLife: 14, color: skill.color, radius: splashR + 5 });
    }
    // 상태이상 발동 확률
    if (skill.status && Math.random() < (skill.statusChance || 0)) {
        applyStatus(target, skill.status, {
            duration: skill.statusDur || 120,
            dmg: skill.statusDmg || 0,
        });
    }
    // 효과 표시
    if (mul > 1) coinTexts.push({ x: target.x, y: target.y - 20, text: "효과적!", life: 35, color: "#FFEB3B" });
    else if (mul < 1) coinTexts.push({ x: target.x, y: target.y - 20, text: "별로...", life: 35, color: "#9E9E9E" });
    if (dn.isBoosted) {
        // 시각 이펙트만: 작은 빛 링 + 반짝 파티클
        const dnColor = dn.isDay ? "#FFE082" : "#B39DDB";
        skillEffects.push({ type:"shockwave", x: target.x, y: target.y, life: 16, maxLife: 16, color: dnColor, radius: 22 });
        for (let k = 0; k < 6; k++) {
            const a = Math.random() * Math.PI * 2;
            particles.push({
                x: target.x, y: target.y - 4,
                vx: Math.cos(a) * 1.5, vy: Math.sin(a) * 1.5 - 1.2,
                color: dnColor, life: 18, maxLife: 18, size: 1.5 + Math.random() * 1.5,
            });
        }
    }
    // 피격 파티클
    for (let k = 0; k < 4; k++) {
        const a = Math.random() * Math.PI * 2;
        particles.push({
            x: target.x, y: target.y,
            vx: Math.cos(a) * 2, vy: Math.sin(a) * 2 - 1,
            color: skill.color, life: 18, maxLife: 18,
            size: 2 + Math.random() * 2,
        });
    }
}

// 나인이볼부스트 (이브이 Lv50 패시브)
// ═══════════════════════════════════════════
function castNineEvolveBoost(caster) {
    const radius = 150;
    const buffDur = 600; // 10초
    let buffed = 0;
    for (const ee of eevees) {
        const dx = ee.x - caster.x, dy = (ee.y - caster.y) / ISO_Y;
        if (dx * dx + dy * dy < radius * radius) {
            // 스킬 쿨다운 초기화
            if (ee.skill1Cd) ee.skill1Cd = 0;
            if (ee.skill2Cd) ee.skill2Cd = 0;
            // 버프 적용
            ee.boostBuff = buffDur;
            buffed++;
        }
    }
    // 시각 이펙트
    skillEffects.push({ type:"aoe", x: caster.x, y: caster.y, life: 50, maxLife: 50, color: "#FFD700", radius: radius });
    skillEffects.push({ type:"shockwave", x: caster.x, y: caster.y, life: 35, maxLife: 35, color: "#FFEB3B", radius: radius * 1.1 });
    coinTexts.push({ x: caster.x, y: caster.y - 35, text: "나인이볼부스트!", life: 70, color: "#FFD700" });
    for (let k = 0; k < 30; k++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 2 + Math.random() * 3;
        particles.push({
            x: caster.x, y: caster.y,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
            color: "#FFD700", life: 50, maxLife: 50,
            size: 2 + Math.random() * 2.5,
        });
    }
}

// ═══════════════════════════════════════════
// 자기 회전이 어울리는 FX (대칭/구체/링/별 형태)
// 방향성 있는 모양(송곳니/하트/광선/펀치/메테오 등)은 회전 X
// ═══════════════════════════════════════════
const FX_SPINNABLE = new Set([
    "explosion1", "explosion2", "sparkle",
    "darkPulse", "darkBall",
    "blizzard", // 눈송이는 6각 대칭
    "venom",    // 폭발성 분출
    "sleep",    // Z 표시지만 흩날림 OK
    "leafBlade", // 잎날 — 베는 느낌으로 회전
    "scissor",   // 가위 X자 베기
    "rockSlide", // 바위 회전 낙하
    "metalHead", // 금속 충격
]);
function fxSpin(fx, val)    { return FX_SPINNABLE.has(fx) ? val : 0; }
function fxRandRot(fx)      { return FX_SPINNABLE.has(fx) ? Math.random() * Math.PI * 2 : 0; }

// ═══════════════════════════════════════════
// FX 시각 모드 — effect 타입 + 스킬 이름으로 모드 결정
// ═══════════════════════════════════════════
function getFxMode(skill) {
    if (skill.fxMode) return skill.fxMode; // 명시적 지정 우선
    const eff = skill.effect;
    const name = skill.name || "";
    // 특수 케이스 (스킬 이름 기반)
    if (name === "번개") return "strike";
    if (name === "메테오" || name === "거다이맥스" || name === "대폭발") return "drop";
    if (name === "씨폭탄" || name === "락슬라이드" || name === "눈보라" || name === "블리자드") return "rain";
    // 드래곤계 — dragonPulse 사용 스킬: 시전자 → 타겟 방향 한 번 출력
    if (skill.fx === "dragonPulse") return "facing";
    // 비행계 — airSlash: 여러 각도 베기
    if (skill.fx === "airSlash") return "slashes";
    // effect 타입 기반 자동 매핑
    if (eff === "pierce") return "beam";
    if (eff === "aoe")    return "scatter";
    if (eff === "chain")  return "multi";
    if (eff === "field")  return "orbit";
    if (eff === "buff")   return "rise";
    if (eff === "delayed")return "drop";
    if (eff === "dash")   return "dash";
    if (eff === "melee")  return "burst";
    return "burst"; // single 기본
}

// 모바일은 이펙트 개수 60% 수준으로
const FX_COUNT_MUL = isMobile ? 0.6 : 1.0;
const SKILL_EFFECTS_CAP = isMobile ? 200 : 400;
function fxCount(n) { return Math.max(1, Math.round(n * FX_COUNT_MUL)); }

function spawnFxByMode(skill, ee, target) {
    // 캡 초과 시 가장 오래된 것부터 정리
    if (skillEffects.length > SKILL_EFFECTS_CAP) {
        skillEffects.splice(0, skillEffects.length - SKILL_EFFECTS_CAP);
    }
    const mode = getFxMode(skill);
    const baseScale = skill.fxScale || 1.0;
    const fx = skill.fx;
    const color = skill.color;
    // 모든 fx push에 groundY 자동 적용 (vy>0인데 명시 없으면 target.y로)
    const pushFx = (props) => {
        if ((props.vy != null && props.vy > 0) && props.groundY == null) {
            props.groundY = target.y;
        }
        skillEffects.push(props);
    };

    if (mode === "burst") {
        // melee는 작고 빠르게, single은 약간 더 큼
        const isMelee = skill.effect === "melee";
        const burstScale = isMelee ? 0.55 : 0.75;
        const burstLife  = isMelee ? 22 : 30;
        pushFx({
            type:"fx", fxKey: fx, x: target.x, y: target.y,
            life: burstLife, maxLife: burstLife,
            scale: baseScale * burstScale, rotation: 0,
            rotSpeed: fxSpin(fx, FX_SPINNABLE.has(fx) ? 0.25 : 0), // 잎날/가위 등 빠른 회전
            pulse: true, color,
        });
    }
    else if (mode === "beam") {
        // 기존 광선 (pierceBeam) + 타격 지점에 폭발 fx 여러 개
        // 광선 라인은 절차적 (코드에 이미 pierceBeam 타입 있음)
        skillEffects.push({
            type:"pierceBeam",
            x: ee.x, y: ee.y - 5,
            x2: target.x, y2: target.y,
            life: 14, maxLife: 14, color,
        });
        // 타격 지점 폭발 — 작은 폭발 3개 시차로 파파팡
        for (let i = 0; i < 3; i++) {
            pushFx({
                type:"fx", fxKey: skill.fxImpact || "explosion1",
                x: target.x + (Math.random() - 0.5) * 18,
                y: target.y + (Math.random() - 0.5) * 14,
                life: 20, maxLife: 20,
                scale: baseScale * (0.5 + Math.random() * 0.3),
                rotation: 0,
                rotSpeed: fxSpin(skill.fxImpact || "explosion1", 0.18),
                pulse: true,
                delay: i * 3,
                color,
            });
        }
        // 충격파 링
        skillEffects.push({
            type:"shockwave", x: target.x, y: target.y,
            life: 16, maxLife: 16, color, radius: 30,
        });
    }
    else if (mode === "rain") {
        // 작은 거 많이 (블리자드/씨폭탄/락슬라이드)
        const r = skill.aoeRadius || 70;
        const count = fxCount(14);
        for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI * 2;
            const d = Math.random() * r * 0.9;
            const tx = target.x + Math.cos(a) * d;
            const ty = target.y + Math.sin(a) * d * ISO_Y;
            pushFx({
                type:"fx", fxKey: fx,
                x: tx, y: ty - 60 - Math.random() * 40,
                life: 26, maxLife: 26,
                scale: baseScale * (0.22 + Math.random() * 0.18),
                rotation: fxRandRot(fx),
                rotSpeed: fxSpin(fx, (Math.random() - 0.5) * 0.3),
                vy: 1.5, gravity: 0.15,
                groundY: ty,
                delay: i * 2,
                color,
            });
        }
    }
    else if (mode === "scatter") {
        // 작은 거 많이 영역 내 시차 출현
        const r = skill.aoeRadius || 70;
        const count = fxCount(12);
        for (let i = 0; i < count; i++) {
            const a = Math.random() * Math.PI * 2;
            const d = Math.random() * r * 0.85;
            pushFx({
                type:"fx", fxKey: fx,
                x: target.x + Math.cos(a) * d,
                y: target.y + Math.sin(a) * d * ISO_Y,
                life: 22, maxLife: 22,
                scale: baseScale * (0.28 + Math.random() * 0.2),
                rotation: fxRandRot(fx),
                rotSpeed: fxSpin(fx, 0.1),
                pulse: true,
                delay: i * 2,
                color,
            });
        }
    }
    else if (mode === "multi") {
        // 작은 거 8개 시차 (연쇄/다단)
        const count = fxCount(8);
        for (let i = 0; i < count; i++) {
            pushFx({
                type:"fx", fxKey: fx,
                x: target.x + (Math.random() - 0.5) * 28,
                y: target.y + (Math.random() - 0.5) * 20,
                life: 14, maxLife: 14,
                scale: baseScale * 0.3,
                rotation: fxRandRot(fx),
                pulse: true,
                delay: i * 2,
                color,
            });
        }
    }
    else if (mode === "rise") {
        // 시전자 위에서 떠오름 (버프) — 작게 많이
        const count = fxCount(10);
        for (let i = 0; i < count; i++) {
            pushFx({
                type:"fx", fxKey: fx,
                x: ee.x + (Math.random() - 0.5) * 30,
                y: ee.y - 4 + (Math.random() - 0.5) * 6,
                life: 36, maxLife: 36,
                scale: baseScale * (0.22 + Math.random() * 0.15),
                rotation: 0,
                rotSpeed: fxSpin(fx, 0.06),
                vy: -1.0 - Math.random() * 0.4,
                delay: i * 3,
                color,
            });
        }
    }
    else if (mode === "orbit") {
        // 중심 1개(작게) + 작은 거 10개 둘레 회전
        const r = skill.fieldRadius || 70;
        const dur = Math.min(120, skill.fieldDur || 90);
        pushFx({
            type:"fx", fxKey: fx, x: target.x, y: target.y,
            life: dur, maxLife: dur,
            scale: baseScale * 0.55, rotation: 0,
            pulse: true, color,
        });
        const orbitCount = fxCount(10);
        for (let i = 0; i < orbitCount; i++) {
            const a = (i / orbitCount) * Math.PI * 2;
            pushFx({
                type:"fx", fxKey: fx,
                x: target.x, y: target.y,
                life: dur, maxLife: dur,
                scale: baseScale * 0.25,
                rotation: 0,
                orbitCx: target.x, orbitCy: target.y,
                orbitR: r * 0.75,
                orbitAngle: a,
                orbitSpeed: 0.05,
                color,
            });
        }
    }
    else if (mode === "strike") {
        // 한 번 번쩍! — 위→아래로 길게 늘인 fx, 짧은 life, 아래끝이 target.y
        const strikeImpact = skill.fxImpact || "explosion1";
        pushFx({
            type:"fx", fxKey: fx,
            x: target.x, y: target.y - 50,
            life: 10, maxLife: 10, // 한 번 번쩍
            scale: baseScale,
            scaleX: 0.7,
            scaleY: 2.6, // 세로 길게
            rotation: 0,
            color,
        });
        // 타격 지점 폭발
        pushFx({
            type:"fx", fxKey: strikeImpact,
            x: target.x, y: target.y,
            life: 20, maxLife: 20,
            scale: baseScale * 0.8,
            rotation: 0,
            rotSpeed: fxSpin(strikeImpact, 0.2),
            pulse: true,
            color,
        });
        skillEffects.push({
            type:"shockwave", x: target.x, y: target.y,
            life: 14, maxLife: 14, color, radius: 30,
        });
        for (let k = 0; k < 6; k++) {
            const a = Math.random() * Math.PI * 2;
            const sp = 1.5 + Math.random() * 2;
            particles.push({
                x: target.x, y: target.y,
                vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5,
                color, life: 18, maxLife: 18,
                size: 1.5 + Math.random() * 1.5,
            });
        }
    }
    else if (mode === "slashes") {
        // 여러 각도 베기 (날개/슬래시 — airSlash 등)
        const count = fxCount(5);
        for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
            const dist = 6 + Math.random() * 8;
            pushFx({
                type:"fx", fxKey: fx,
                x: target.x + Math.cos(angle) * dist,
                y: target.y + Math.sin(angle) * dist * ISO_Y,
                life: 18, maxLife: 18,
                scale: baseScale * (0.55 + Math.random() * 0.2),
                rotation: angle + Math.PI / 2, // 베기 방향
                pulse: true,
                delay: i * 2,
                color,
            });
        }
        skillEffects.push({
            type:"shockwave", x: target.x, y: target.y,
            life: 14, maxLife: 14, color, radius: 28,
        });
    }
    else if (mode === "facing") {
        // 시전자 위치에서 타겟 방향 향해 한 번 출력 (용머리/방향성 강한 fx)
        const dx = target.x - ee.x, dy = target.y - ee.y;
        const angle = Math.atan2(dy, dx);
        // 시전자 → 타겟 중간쯤에 한 번
        pushFx({
            type:"fx", fxKey: fx,
            x: ee.x + dx * 0.45, y: ee.y + dy * 0.45,
            life: 22, maxLife: 22,
            scale: baseScale * 1.0,
            rotation: angle,
            pulse: true,
            color,
        });
        // 타격 지점에 충격파만
        skillEffects.push({
            type:"shockwave", x: target.x, y: target.y,
            life: 16, maxLife: 16, color, radius: 30,
        });
    }
    else if (mode === "drop") {
        // 마커 → 낙하 → 충돌 폭발
        const impactFx = skill.fxImpact || "explosion2";
        pushFx({
            type:"fx", fxKey: fx, x: target.x, y: target.y,
            life: 12, maxLife: 12,
            scale: baseScale * 0.35,
            rotation: 0, color,
        });
        pushFx({
            type:"fx", fxKey: fx,
            x: target.x, y: target.y - 100,
            life: 28, maxLife: 28,
            scale: baseScale * 0.8,
            rotation: 0,
            vy: 2.5, gravity: 0.2,
            groundY: target.y,
            delay: 6,
            color,
        });
        pushFx({
            type:"fx", fxKey: impactFx, x: target.x, y: target.y,
            life: 22, maxLife: 22,
            scale: baseScale * 0.95,
            rotation: 0,
            rotSpeed: fxSpin(impactFx, 0.18),
            pulse: true,
            delay: 18,
            color,
        });
        skillEffects.push({
            type:"shockwave", x: target.x, y: target.y,
            life: 18, maxLife: 18, color, radius: 36,
            delay: 18,
        });
        for (let k = 0; k < 10; k++) {
            const a = Math.random() * Math.PI * 2;
            const sp = 1.5 + Math.random() * 2.5;
            particles.push({
                x: target.x, y: target.y,
                vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5,
                color, life: 24, maxLife: 24,
                size: 1.5 + Math.random() * 2,
            });
        }
    }
    else if (mode === "dash") {
        // 시전자→타겟 라인 잔상 3개 + 끝점
        const dx = target.x - ee.x, dy = target.y - ee.y;
        const angle = Math.atan2(dy, dx);
        for (let i = 0; i < 3; i++) {
            const ti = (i + 1) / 4;
            pushFx({
                type:"fx", fxKey: fx,
                x: ee.x + dx * ti, y: ee.y + dy * ti,
                life: 16, maxLife: 16,
                scale: baseScale * 0.55,
                rotation: angle,
                delay: i * 2,
                color,
            });
        }
        pushFx({
            type:"fx", fxKey: fx, x: target.x, y: target.y,
            life: 22, maxLife: 22,
            scale: baseScale * 0.75,
            rotation: angle,
            pulse: true,
            delay: 6,
            color,
        });
    }
}

function castSkill(ee, target, skill, isSpec) {
    if (!target) return;

    // 시전자 위 차징 이펙트
    skillEffects.push({ type:"cast", x: ee.x, y: ee.y - 18, life: 20, maxLife: 20, color: skill.color });
    // 스킬 이름 텍스트
    coinTexts.push({ x: ee.x, y: ee.y - 35, text: skill.name, life: 50, color: skill.color });

    // 스킬 이펙트 아이콘 (skill.fx 키 정의 시) — effect 타입에 따라 시각 모드 선택
    if (skill.fx) {
        spawnFxByMode(skill, ee, target);
    }

    if (skill.effect === "single") {
        applySkillDamage(target, ee, skill, isSpec);
        // 큰 폭발 (확장 링)
        skillEffects.push({ type:"burst", x: target.x, y: target.y, life: 30, maxLife: 30, color: skill.color, radius: 28 });
        // 충격파 (작은 링)
        skillEffects.push({ type:"shockwave", x: target.x, y: target.y, life: 22, maxLife: 22, color: skill.color, radius: 40 });
        // 시전자→타겟 광선
        skillEffects.push({ type:"beam", x: ee.x, y: ee.y - 5, x2: target.x, y2: target.y, life: 12, maxLife: 12, color: skill.color });
        // 큰 파티클 분출
        for (let k = 0; k < 12; k++) {
            const a = Math.random() * Math.PI * 2;
            const sp = 1.5 + Math.random() * 3;
            particles.push({
                x: target.x, y: target.y,
                vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5,
                color: skill.color, life: 25 + Math.random() * 15, maxLife: 35,
                size: 2 + Math.random() * 2.5,
            });
        }
    } else if (skill.effect === "melee") {
        // 근접 물기/엄니 - 빔 없음, 타겟 위치에서 강력한 폭발 + 이빨 마크
        applySkillDamage(target, ee, skill, isSpec);
        skillEffects.push({ type:"bite", x: target.x, y: target.y, life: 20, maxLife: 20, color: skill.color });
        skillEffects.push({ type:"burst", x: target.x, y: target.y, life: 22, maxLife: 22, color: skill.color, radius: 22 });
        // 임팩트 파티클
        for (let k = 0; k < 10; k++) {
            const a = Math.random() * Math.PI * 2;
            const sp = 2 + Math.random() * 2.5;
            particles.push({
                x: target.x, y: target.y,
                vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5,
                color: skill.color, life: 22, maxLife: 22,
                size: 2 + Math.random() * 2,
            });
        }
    } else if (skill.effect === "dash") {
        // 돌진 - 시전자에서 타겟까지 잔상 라인 + 임팩트
        applySkillDamage(target, ee, skill, isSpec);
        skillEffects.push({ type:"dashTrail", x: ee.x, y: ee.y - 5, x2: target.x, y2: target.y, life: 18, maxLife: 18, color: skill.color });
        skillEffects.push({ type:"burst", x: target.x, y: target.y, life: 22, maxLife: 22, color: skill.color, radius: 22 });
        for (let k = 0; k < 8; k++) {
            const a = Math.random() * Math.PI * 2;
            particles.push({
                x: target.x, y: target.y,
                vx: Math.cos(a) * 2.5, vy: Math.sin(a) * 2.5 - 1,
                color: skill.color, life: 20, maxLife: 20,
                size: 1.5 + Math.random() * 2,
            });
        }
    } else if (skill.effect === "aoe") {
        const r = skill.aoeRadius || 70;
        for (const m of monsters) {
            if (m.hp <= 0) continue;
            const dx = m.x - target.x, dy = (m.y - target.y) / ISO_Y;
            if (dx * dx + dy * dy < r * r) {
                applySkillDamage(m, ee, skill, isSpec);
            }
        }
        // 메인 광역 (확장 원)
        skillEffects.push({ type:"aoe", x: target.x, y: target.y, life: 40, maxLife: 40, color: skill.color, radius: r });
        // 보조 링 두 개 (다른 속도)
        skillEffects.push({ type:"shockwave", x: target.x, y: target.y, life: 25, maxLife: 25, color: skill.color, radius: r * 1.2 });
        skillEffects.push({ type:"shockwave", x: target.x, y: target.y, life: 18, maxLife: 18, color: skill.color, radius: r * 0.6 });
        // 회오리 파티클
        for (let k = 0; k < 24; k++) {
            const a = (k / 24) * Math.PI * 2;
            const sp = 2 + Math.random() * 2;
            particles.push({
                x: target.x + Math.cos(a) * 10, y: target.y + Math.sin(a) * 10 * ISO_Y,
                vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * ISO_Y - 1,
                color: skill.color, life: 30 + Math.random() * 15, maxLife: 45,
                size: 2 + Math.random() * 2.5,
            });
        }
    } else if (skill.effect === "chain") {
        const range = skill.chainRange || 90;
        const count = skill.chainCount || 3;
        let cur = target;
        const hit = new Set();
        let prevX = ee.x, prevY = ee.y;
        for (let i = 0; i < count && cur; i++) {
            applySkillDamage(cur, ee, skill, isSpec);
            hit.add(cur.id);
            // 체인 번개 라인
            skillEffects.push({ type:"line", x: prevX, y: prevY, x2: cur.x, y2: cur.y, life: 22, maxLife: 22, color: skill.color });
            // 임팩트
            skillEffects.push({ type:"burst", x: cur.x, y: cur.y, life: 18, maxLife: 18, color: skill.color, radius: 18 });
            // 스파크 파티클
            for (let k = 0; k < 6; k++) {
                const a = Math.random() * Math.PI * 2;
                particles.push({
                    x: cur.x, y: cur.y,
                    vx: Math.cos(a) * 2, vy: Math.sin(a) * 2 - 1,
                    color: skill.color, life: 20, maxLife: 20,
                    size: 1.5 + Math.random() * 1.5,
                });
            }
            prevX = cur.x; prevY = cur.y;
            // 다음 타겟
            let next = null, bestD = Infinity;
            for (const m of monsters) {
                if (m.hp <= 0 || hit.has(m.id)) continue;
                const dx = m.x - cur.x, dy = (m.y - cur.y) / ISO_Y;
                const d = dx * dx + dy * dy;
                if (d < range * range && d < bestD) { bestD = d; next = m; }
            }
            cur = next;
        }
    } else if (skill.effect === "pierce") {
        // 관통: 시전자 → 타겟 방향 직선 위 모든 적
        const dx = target.x - ee.x, dy = target.y - ee.y;
        const ang = Math.atan2(dy, dx);
        const maxDist = getEeveeRange(ee) * 1.6;
        // 라인 양옆 일정 너비 안의 적
        const lineW = 30;
        for (const m of monsters) {
            if (m.hp <= 0) continue;
            const mdx = m.x - ee.x, mdy = m.y - ee.y;
            // 진행 방향 거리 (사거리 안)
            const along = mdx * Math.cos(ang) + mdy * Math.sin(ang);
            if (along < 0 || along > maxDist) continue;
            // 수직 거리 (라인 너비 안)
            const perp = Math.abs(-mdx * Math.sin(ang) + mdy * Math.cos(ang));
            if (perp < lineW) {
                applySkillDamage(m, ee, skill, isSpec);
            }
        }
        // 빔 이펙트
        const ex = ee.x + Math.cos(ang) * maxDist;
        const ey = ee.y - 5 + Math.sin(ang) * maxDist;
        skillEffects.push({ type:"pierceBeam", x: ee.x, y: ee.y - 5, x2: ex, y2: ey, life: 20, maxLife: 20, color: skill.color });
    } else if (skill.effect === "buff") {
        // 자기 + 주변 이브이에 일시 버프
        const r = skill.buffRadius || 100;
        const dur = skill.buffDur || 360; // 6초 기본
        for (const e of eevees) {
            const dx = e.x - ee.x, dy = (e.y - ee.y) / ISO_Y;
            if (dx * dx + dy * dy < r * r) {
                e.skillBuff = e.skillBuff || {};
                if (skill.buffType === "atk") e.skillBuff.atk = Math.max(e.skillBuff.atk || 0, dur);
                else if (skill.buffType === "spd") e.skillBuff.spd = Math.max(e.skillBuff.spd || 0, dur);
                else if (skill.buffType === "range") e.skillBuff.range = Math.max(e.skillBuff.range || 0, dur);
                else if (skill.buffType === "all") {
                    e.skillBuff.atk = Math.max(e.skillBuff.atk || 0, dur);
                    e.skillBuff.spd = Math.max(e.skillBuff.spd || 0, dur);
                    e.skillBuff.range = Math.max(e.skillBuff.range || 0, dur);
                }
            }
        }
        // 이펙트
        skillEffects.push({ type:"aoe", x: ee.x, y: ee.y, life: 30, maxLife: 30, color: skill.color, radius: r });
        skillEffects.push({ type:"shockwave", x: ee.x, y: ee.y, life: 22, maxLife: 22, color: "#fff", radius: r });
        for (let k = 0; k < 16; k++) {
            const a = Math.random() * Math.PI * 2;
            particles.push({
                x: ee.x + Math.cos(a) * 8, y: ee.y + Math.sin(a) * 8,
                vx: Math.cos(a) * 2, vy: Math.sin(a) * 2 - 2,
                color: skill.color, life: 30, maxLife: 30,
                size: 2 + Math.random() * 2,
            });
        }
    } else if (skill.effect === "field") {
        // 지속장 (DOT 영역) — 일정 시간 동안 영역 안 적에게 데미지
        const r = skill.fieldRadius || 80;
        const dur = skill.fieldDur || 180; // 3초
        skillEffects.push({
            type:"field", x: target.x, y: target.y, radius: r,
            life: dur, maxLife: dur, color: skill.color,
            tickEvery: 30, // 0.5초마다 데미지
            tickCounter: 0,
            srcEe: ee, skill, isSpec,
        });
        // 처음 한 번 데미지
        for (const m of monsters) {
            if (m.hp <= 0) continue;
            const dx = m.x - target.x, dy = (m.y - target.y) / ISO_Y;
            if (dx * dx + dy * dy < r * r) {
                applySkillDamage(m, ee, skill, isSpec);
            }
        }
    } else if (skill.effect === "delayed") {
        // 딜레이 폭발 — 시전 후 일정 시간 후 폭발
        skillEffects.push({
            type:"delayed", x: target.x, y: target.y, radius: skill.aoeRadius || 80,
            life: skill.delay || 120, maxLife: skill.delay || 120,
            color: skill.color,
            srcEe: ee, skill, isSpec,
        });
    }
}

function getLevelUpCost(ee) {
    const l = ee.level - 1;
    const isEvolved = ee.sprite !== "이브이.png";
    if (isEvolved) {
        return Math.floor(40 + l * 20 + l * l * 1.5);
    }
    // 기본 이브이도 가속
    return Math.floor(15 + l * 8 + l * l * 0.6);
}

// 레벨업 배율 (복리)
// 가산식 — 진화체 기준 (lv당 +16% atk, -3% 공속)
function lvAtkMul(level)   { return 1 + (level - 1) * 0.16; }
function lvSpdMul(level)   { return Math.max(0.3, 1 - (level - 1) * 0.03); }
function lvRangeMul(level) { return 1; }
// 기본 이브이는 더 낮음 (진화 유도)
function lvAtkMulBase(level)   { return 1 + (level - 1) * 0.08; }
function lvSpdMulBase(level)   { return Math.max(0.5, 1 - (level - 1) * 0.015); }

function levelUpEevee(ee) {
    const cost = getLevelUpCost(ee);
    if (coins < cost) return;
    coins -= cost;
    ee.level++;
    // 능력치 상승 (기본 이브이는 더 약함)
    const isBase = ee.sprite === "이브이.png";
    const atkM = isBase ? lvAtkMulBase(ee.level) : lvAtkMul(ee.level);
    const spdM = isBase ? lvSpdMulBase(ee.level) : lvSpdMul(ee.level);
    ee.atk = Math.max(1, Math.floor(ee.baseAtk * atkM));
    if (ee.baseSpAtk) ee.spAtk = Math.max(1, Math.floor(ee.baseSpAtk * atkM));
    ee.atkSpeed = Math.max(8, Math.floor(ee.baseAtkSpeed * spdM));
    ee.range = Math.floor(ee.baseRange * lvRangeMul(ee.level));
    // 레벨업 이펙트
    for (let k = 0; k < 12; k++) {
        const a = Math.random() * Math.PI * 2;
        particles.push({
            x: ee.x, y: ee.y,
            vx: Math.cos(a) * 2, vy: Math.sin(a) * 2 - 1.5,
            color: "#FFD700", life: 30, maxLife: 30,
            size: 2 + Math.random() * 2,
        });
    }
}

const monsters = [];

function spawnMonster(name, sprite, hp, mDef, sDef, spd, typeOrTypes, isBoss, opts) {
    // typeOrTypes: 문자열 또는 배열
    const types = Array.isArray(typeOrTypes) ? typeOrTypes : [typeOrTypes];
    // 8방향 중 상단 3방향(10시·12시·2시 = 5,6,7)은 하늘 영역이라 제외
    const allowedDirs = [0, 1, 2, 3, 4];
    const dirIdx = allowedDirs[Math.floor(Math.random() * allowedDirs.length)];
    const dirAngle = (dirIdx / 8) * Math.PI * 2;
    const startDist = Math.max(CW, CH) * 0.7;
    const startX = FARM_CX + Math.cos(dirAngle) * startDist;
    const startY = FARM_CY + Math.sin(dirAngle) * startDist * ISO_Y;
    const m = {
        id: monsterIdCounter++,
        name, sprite, hp, maxHp: hp, mDef, sDef, spd,
        type: types[0], types,
        isBoss: !!isBoss,
        isRaid: opts && opts.isRaid ? true : false,
        phase2Data: opts && opts.phase2 ? opts.phase2 : null,
        phase: "enter",
        x: startX, y: startY,
        entryAngle: dirAngle,
        orbitAngle: 0,
        hitAnim: 0,
        deathAnim: 0,
        statuses: {},
    };
    monsters.push(m);
    return m;
}

// ═══════════════════════════════════════════
// 상태이상 시스템
// ═══════════════════════════════════════════
function applyStatus(target, type, data) {
    if (!target || target.hp <= 0) return;
    target.statuses = target.statuses || {};
    target.statuses[type] = { ...data };
}

function updateStatuses() {
    for (const m of monsters) {
        if (m.hp <= 0 || !m.statuses) continue;
        for (const key in m.statuses) {
            const s = m.statuses[key];
            s.duration--;
            // DOT 처리 (매 30프레임마다 데미지)
            if ((key === "burn" || key === "poison") && s.duration % 30 === 0) {
                m.hp -= s.dmg;
                m.hitAnim = 4;
                // 작은 파티클
                const c = key === "burn" ? "#FF7043" : "#9C27B0";
                for (let k = 0; k < 2; k++) {
                    const a = Math.random() * Math.PI * 2;
                    particles.push({
                        x: m.x, y: m.y,
                        vx: Math.cos(a) * 1, vy: Math.sin(a) * 1 - 1,
                        color: c, life: 15, maxLife: 15,
                        size: 1.5 + Math.random(),
                    });
                }
            }
            if (s.duration <= 0) delete m.statuses[key];
        }
    }
}

// 몬스터 effective 이동속도 (상태이상 적용)
function getMonsterSpdMul(m) {
    if (!m.statuses) return 1;
    if (m.statuses.paralysis) return 0;  // 마비 = 완전 정지
    if (m.statuses.sleep) return 0;       // 잠듦 = 정지
    if (m.statuses.freeze) return 0.4;    // 빙결 = 느려짐
    if (m.statuses.slow) return 0.6;      // 둔화 = 약하게 느려짐
    return 1;
}

// 몬스터 effective 방어력
function getMonsterDef(m, isSpec) {
    let d = isSpec ? (m.sDef || 0) : (m.mDef || 0);
    if (m.statuses) {
        // 통합 defDown (양쪽 다)
        if (m.statuses.defDown) d *= 0.7;
        // 분리형: mDefDown/sDefDown
        if (!isSpec && m.statuses.mDefDown) d *= 0.7;
        if (isSpec && m.statuses.sDefDown) d *= 0.7;
    }
    return d;
}

function setupWave(w) {
    waveSpawnQueue = [];

    // 웨이브별 레벨 디자인
    let waveMul;
    if (w <= 7) {
        waveMul = 0.25 + (w - 1) * 0.06;   // W1:0.25 W7:0.61
    } else if (w <= 15) {
        waveMul = 0.7 + (w - 8) * 0.15;    // W8:0.7 W15:1.75
    } else if (w <= 30) {
        waveMul = 1.9 + (w - 16) * 0.30;   // W16:1.9 W20:3.1 W30:6.1
    } else if (w <= 50) {
        waveMul = 6.1 + (w - 30) * 0.55;   // W30:6.1 W40:11.6 W50:17.1
    } else {
        waveMul = 17.1 + (w - 50) * 0.90;  // W50:17.1 W60:26.1 W80:44.1 W100:62.1
    }
    // 10웨이브마다 추가 스탯 부스트 (소폭, 누적)
    waveMul *= 1 + Math.floor(w / 10) * 0.05;
    const spdBase = 0.010;
    let count, unlocked;

    // 몬스터 종류 해금: 7웨이브 구간마다 1종씩 (W1~6: 1종, W7~13: 2종, W14~20: 3종 …)
    unlocked = Math.min(Math.floor((w - 1) / 7) + 1, monPool.length);

    // 마릿수 (W20/W50 점프 제거 — 매 라운드 부드럽게 1마리씩 증가)
    if (w <= 4) {
        count = 2 + w;                   // W1:3 W4:6
    } else if (w <= 30) {
        count = 5 + w;                   // W5:10 W20:25 W30:35
    } else if (w <= 60) {
        count = 5 + Math.floor(w * 1.15); // W31:40 W50:62 W60:74
    } else {
        count = 5 + Math.floor(w * 1.5);  // W61:96 W80:125 W100:155
    }

    // 레이드 웨이브 (100의 배수) — 페이즈2 변신 보스 단독
    if (w > 0 && w % 100 === 0) {
        const raid = raidPool[Math.floor(Math.random() * raidPool.length)];
        waveSpawnQueue.push({
            name: raid.name, sprite: raid.sprite, types: raid.types,
            hp: Math.floor(raid.baseHp * waveMul * 20),
            mDef: Math.floor(raid.baseMDef * waveMul * 0.25),
            sDef: Math.floor(raid.baseSDef * waveMul * 0.25),
            spd: spdBase * (raid.baseSpd / 100) * 0.4,
            isBoss: true, isRaid: true, phase2: raid.phase2,
            waveMul: waveMul,
            delay: 0,
        });
        count = 0; // 레이드는 단독
    }
    // 보스 웨이브 (10의 배수, 100 제외) — 재앙 4종 중 랜덤 1마리
    else if (w > 0 && w % 10 === 0) {
        const cal = calamityPool[Math.floor(Math.random() * calamityPool.length)];
        waveSpawnQueue.push({
            name: cal.name, sprite: cal.sprite, types: cal.types,
            hp: Math.floor(cal.baseHp * waveMul * 14),
            mDef: Math.floor(cal.baseMDef * waveMul * 0.2),
            sDef: Math.floor(cal.baseSDef * waveMul * 0.2),
            spd: spdBase * (cal.baseSpd / 100) * 0.4,
            isBoss: true,
            delay: 0,
        });
        count = Math.floor(count * 0.4);
    }

    // 동적 스폰 간격: 라운드 시간의 70% 안에 모든 몬스터가 등장하도록
    const targetWindow = Math.floor(WAVE_TIME * 0.7);
    const dynGap = Math.max(6, Math.min(45, Math.floor(targetWindow / Math.max(1, count))));
    for (let i = 0; i < count; i++) {
        const m = monPool[Math.floor(Math.random() * unlocked)];
        const hpRoll = 0.85 + Math.random() * 0.3;
        waveSpawnQueue.push({
            name: m.name, sprite: m.sprite, types: m.types,
            hp: Math.floor(m.baseHp * waveMul * hpRoll),
            mDef: Math.floor(m.baseMDef * waveMul * 0.12),
            sDef: Math.floor(m.baseSDef * waveMul * 0.12),
            spd: spdBase * (m.baseSpd / 100) * (0.9 + Math.random() * 0.2),
            delay: i * dynGap + Math.floor(Math.random() * Math.min(15, dynGap)) + (w % 10 === 0 ? 90 : 0),
        });
    }
    waveTimer = getWaveTime(w);
    waveSpawnTimer = 0;
    gameState = "playing";
}

// 첫 웨이브 대기
waveIntervalTimer = WAVE_INTERVAL;

// ═══════════════════════════════════════════
// 업데이트 (게임 로직 - 변경 없음)
// ═══════════════════════════════════════════
let dragging = null;

function update() {
    frame++;

    // 파티클 캡 (모바일 250 / 데스크탑 500)
    const PARTICLE_CAP = isMobile ? 250 : 500;
    if (particles.length > PARTICLE_CAP) {
        particles.splice(0, particles.length - PARTICLE_CAP);
    }
    // 파티클 업데이트
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = hitEffects.length - 1; i >= 0; i--) {
        hitEffects[i].life--;
        if (hitEffects[i].life <= 0) hitEffects.splice(i, 1);
    }
    for (let i = skillEffects.length - 1; i >= 0; i--) {
        const e = skillEffects[i];
        // 지연 중에는 life 깎지 않음 (draw에서 delay 카운트다운)
        if (e.delay && e.delay > 0) continue;
        e.life--;
        // 지속장 (field) 틱 데미지
        if (e.type === "field" && e.srcEe && e.skill) {
            e.tickCounter = (e.tickCounter || 0) + 1;
            if (e.tickCounter >= e.tickEvery) {
                e.tickCounter = 0;
                for (const m of monsters) {
                    if (m.hp <= 0) continue;
                    const dx = m.x - e.x, dy = (m.y - e.y) / ISO_Y;
                    if (dx * dx + dy * dy < e.radius * e.radius) {
                        applySkillDamage(m, e.srcEe, e.skill, e.isSpec);
                    }
                }
            }
        }
        // 딜레이 폭발
        if (e.type === "delayed" && e.life === 0 && e.srcEe && e.skill) {
            for (const m of monsters) {
                if (m.hp <= 0) continue;
                const dx = m.x - e.x, dy = (m.y - e.y) / ISO_Y;
                if (dx * dx + dy * dy < e.radius * e.radius) {
                    applySkillDamage(m, e.srcEe, e.skill, e.isSpec);
                }
            }
            // 폭발 이펙트
            skillEffects.push({ type:"aoe", x: e.x, y: e.y, life: 35, maxLife: 35, color: e.color, radius: e.radius });
        }
        if (e.life <= 0) skillEffects.splice(i, 1);
    }

    if (gameState === "splash") return;
    if (gameState === "gameover") return;

    // 튜토리얼: 일부 단계에서 시범 몬스터 1마리 등장
    if (gameState === "tutorial") {
        // Step 1~2: 이브이 배회 비활성화 (드래그로만 이동)
        if (tutorialStep <= 1 && eevees[0]) {
            eevees[0].wanderTimer = 9999;
            eevees[0].idleTimer = 9999;
        }
        // Step 3: 시범 몬스터 1마리 (목표 위치 옆에 등장 + 거의 안 움직임)
        if (tutorialStep === 2 && monsters.length === 0 && !tutorialMobSpawned) {
            const m = spawnMonster("차곡차곡", "mon/차곡차곡.png", 20, 0, 0, 0.001, ["normal"], false);
            const tg = getTutorialTargetPos();
            if (m) {
                m.phase = "orbit";
                m.x = tg.x + 60;
                m.y = tg.y;
                m.orbitAngle = 0;
            }
            tutorialMobSpawned = true;
        }
    }

    if (gameState === "cutscene") {
        cutsceneTimer--;
        // 컷신: 몬스터들이 농장 안쪽으로 직진 침투
        for (const m of monsters) {
            if (!m.invadeTargetX) {
                // 농장 중심부 랜덤 위치 타겟 지정
                const a = Math.random() * Math.PI * 2;
                const r = Math.random() * (FARM_RADIUS - 40);
                m.invadeTargetX = FARM_CX + Math.cos(a) * r;
                m.invadeTargetY = FARM_CY + Math.sin(a) * r * ISO_Y;
            }
            const dx = m.invadeTargetX - m.x;
            const dy = m.invadeTargetY - m.y;
            const d = Math.sqrt(dx * dx + dy * dy);
            if (d > 1) {
                const spd = 1.5;
                m.x += (dx / d) * spd;
                m.y += (dy / d) * spd;
            }
            m.invading = true; // 떨림 애니메이션 트리거
        }
        if (cutsceneTimer <= 0) gameState = "gameover";
        return;
    }

    // 튜토리얼 중엔 웨이브 진행 / 과포화 비활성
    if (gameState !== "tutorial") {

    // 첫 게임 시작 (wave_interval 초기 상태에서 1회만)
    if (gameState === "wave_interval") {
        wave++;
        setupWave(wave);
        // 친밀도 증가 (기본 이브이만)
        for (const ee of eevees) {
            if (ee.sprite === "이브이.png") ee.friendship++;
        }
    }

    if (!testMode) waveTimer--;

    // 라운드 시간 종료 → 즉시 다음 라운드 시작
    if (!testMode && waveTimer <= 0) {
        wave++;
        setupWave(wave);
        // 라운드 클리어 보상: 라운드 번호 × 3 골드
        const reward = wave * 3;
        coins += reward;
        coinTexts.push({ x: CW / 2, y: 200, text: `라운드 보상 +${reward}`, life: 100, color: "#FFD700" });
        coinTexts.push({ x: CW - 80, y: 80, text: `+${reward}`, life: 60, color: "#FFD700" });
        for (const ee of eevees) {
            if (ee.sprite === "이브이.png") ee.friendship++;
        }
    }

    // 유예 라운드 시스템 (몬스터 50+ OR 보스 2+)
    // 처음 초과 발생 → 그 라운드 + 다음 라운드까지 정리 못하면 패배
    // 한 번이라도 정상화되면 리셋
    const aliveMons = monsters.filter(m => m.hp > 0);
    const monsterCount = aliveMons.length;
    const bossCount = aliveMons.filter(m => m.isBoss).length;
    const overflowTriggered = monsterCount >= OVERFLOW_LIMIT || bossCount >= 2;
    if (overflowTriggered) {
        if (overflowGraceWave === -1) {
            overflowGraceWave = wave; // 초과 발생한 라운드 기록
            overflowReason = bossCount >= 2 ? "boss" : "overflow";
        }
        overflowActive = true;
        // 유예 라운드(=overflowGraceWave + 1) 종료 시점에 여전히 초과 → 게임오버
        if (wave > overflowGraceWave && waveTimer <= 1) {
            gameState = "cutscene";
            cutsceneTimer = 180;
            return;
        }
    } else {
        // 한 번이라도 정상화되면 완전 리셋
        overflowGraceWave = -1;
        overflowActive = false;
    }

    } // end if !tutorial

    // 몬스터 스폰
    waveSpawnTimer++;
    for (let i = waveSpawnQueue.length - 1; i >= 0; i--) {
        if (waveSpawnTimer >= waveSpawnQueue[i].delay) {
            const m = waveSpawnQueue[i];
            spawnMonster(m.name, m.sprite, m.hp, m.mDef || 0, m.sDef || 0, m.spd, m.types || m.type, m.isBoss, { isRaid: m.isRaid, phase2: m.phase2 ? { ...m.phase2, waveMul: m.waveMul } : null });
            waveSpawnQueue.splice(i, 1);
        }
    }

    // 몬스터 이동
    for (const m of monsters) {
        if (m.hitAnim > 0) m.hitAnim--;
        // 테스트 더미: 이동/HP 고정
        if (m.isTestDummy) {
            m.hp = m.maxHp; // HP 회복 (불멸)
            continue;
        }
        if (m.phase === "enter") {
            // 울퉁불퉁멧: 진입 중 매초 도트 (60프레임마다)
            if (hasItem("helmet") && frame % 60 === 0) {
                const dot = 3 + Math.floor(wave * 0.3);
                m.hp -= dot;
                m.hitAnim = 4;
                coinTexts.push({ x: m.x, y: m.y - 12, text: `-${dot}`, life: 25, color: "#FFAB91" });
            }
            // 진입 각도에 맞춰 궤도 진입점으로 이동
            const targetX = FARM_CX + Math.cos(m.entryAngle) * ORBIT_RADIUS;
            const targetY = FARM_CY + Math.sin(m.entryAngle) * ORBIT_RADIUS * ISO_Y;
            const dx = targetX - m.x, dy = targetY - m.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const enterSpd = 1 + m.spd * 80;
            if (dist > enterSpd) {
                m.x += (dx / dist) * enterSpd;
                m.y += (dy / dist) * enterSpd;
            } else {
                m.phase = "orbit";
                m.orbitAngle = m.entryAngle; // 궤도 시작 각도
            }
        } else {
            // 얼음바위 디버프 (인접 몬스터 속도 -50%)
            let spdMult = 1;
            for (const r of rocks) {
                if (r.type !== "ice") continue;
                const iceR = getRockBuffRadius("ice");
                const dxR = m.x - r.x, dyR = (m.y - r.y) / ISO_Y;
                if (dxR * dxR + dyR * dyR < iceR * iceR) {
                    spdMult = 0.5;
                    break;
                }
            }
            // 상태이상 효과
            spdMult *= getMonsterSpdMul(m);
            m.orbitAngle += m.spd * spdMult;
            m.x = FARM_CX + Math.cos(m.orbitAngle) * ORBIT_RADIUS;
            m.y = FARM_CY + Math.sin(m.orbitAngle) * ORBIT_RADIUS * ISO_Y;
        }
    }

    // 상태이상 갱신 (DOT, 지속시간)
    updateStatuses();

    // 이브이 AI
    for (const ee of eevees) {
        ee.animTimer++;
        if (ee.boostBuff > 0) ee.boostBuff--;
        // 스킬 버프 타이머
        if (ee.skillBuff) {
            if (ee.skillBuff.atk > 0) ee.skillBuff.atk--;
            if (ee.skillBuff.spd > 0) ee.skillBuff.spd--;
            if (ee.skillBuff.range > 0) ee.skillBuff.range--;
        }
        if (ee === dragging) continue;

        // --- 타겟 탐색 (사정거리 1.5배 이내만) ---
        const detectRange = getEeveeRange(ee) * 1.5;
        let target = null, bestDist = Infinity;
        for (const m of monsters) {
            if (m.hp <= 0) continue;
            const d = Math.sqrt((m.x - ee.x) ** 2 + ((m.y - ee.y) / ISO_Y) ** 2);
            if (d > detectRange) continue;
            if (d < bestDist) { bestDist = d; target = m; }
        }
        ee.targetId = target ? target.id : null;

        const effRange = getEeveeRange(ee);
        const effSpd = getEeveeAtkSpeed(ee);

        // --- 스킬 쿨다운 감소 (매 프레임) ---
        if (ee.skill1Cd > 0) ee.skill1Cd--;
        if (ee.skill2Cd > 0) ee.skill2Cd--;
        if (ee.skill3Cd > 0) ee.skill3Cd--;

        // --- 공격 (평타 발동 시점에 스킬 발동도 체크) ---
        if (ee.atkCooldown > 0) ee.atkCooldown--;
        if (target && ee.atkCooldown <= 0) {
            const d = Math.sqrt((target.x - ee.x) ** 2 + ((target.y - ee.y) / ISO_Y) ** 2);
            if (d <= effRange) {
                // 평타 데미지 (예리한이빨 크리)
                let atkVal = getEeveeAtk(ee);
                if (hasItem("fang") && Math.random() < 0.06) atkVal = Math.floor(atkVal * 1.6);
                fireProjectile(ee.x, ee.y - 5, target.id, atkVal, ee.bulletType, ee.category || "phys", ee.type || "normal", ee);
                // 겨냥표적 더블샷
                if (hasItem("target") && Math.random() < 0.20) {
                    fireProjectile(ee.x, ee.y - 5, target.id, atkVal, ee.bulletType, ee.category || "phys", ee.type || "normal", ee);
                }
                ee.atkCooldown = effSpd;
                ee.facing = target.x > ee.x ? 1 : -1;

                // 스킬 발동 — 테스트 모드면 1→2→3 순환 강제, 아니면 확률
                if (testMode) {
                    ee.testSkillIdx = ((ee.testSkillIdx || 0) + 1) % 3;
                    if (ee.testSkillIdx === 0 && ee.skill1) {
                        castSkill(ee, target, ee.skill1, false);
                    } else if (ee.testSkillIdx === 1 && ee.skill2) {
                        castSkill(ee, target, ee.skill2, true);
                    } else if (ee.testSkillIdx === 2 && ee.skill3) {
                        castSkill(ee, target, ee.skill3, ee.skill3.effect === "buff" ? false : true);
                    }
                } else {
                    if (ee.skill1 && ee.level >= getSkill1Unlock(ee) && ee.skill1Cd <= 0 && Math.random() < 0.06) {
                        castSkill(ee, target, ee.skill1, false);
                        ee.skill1Cd = ee.skill1.cd;
                    }
                    if (ee.skill2 && ee.level >= getSkill2Unlock(ee) && ee.skill2Cd <= 0 && Math.random() < 0.06) {
                        castSkill(ee, target, ee.skill2, true);
                        ee.skill2Cd = ee.skill2.cd;
                    }
                    if (ee.skill3 && ee.level >= getSkill3Unlock(ee) && ee.skill3Cd <= 0 && Math.random() < 0.06) {
                        castSkill(ee, target, ee.skill3, ee.skill3.effect === "buff" ? false : true);
                        ee.skill3Cd = ee.skill3.cd;
                    }
                }
            }
        }

        // --- 나인이볼부스트 (기본 이브이 Lv50, 패시브 발동) ---
        if (ee.sprite === "이브이.png" && ee.level >= 50) {
            if (ee.boostCd === undefined) ee.boostCd = 600;
            if (ee.boostCd > 0) ee.boostCd--;
            if (ee.boostCd <= 0 && Math.random() < 0.02) {
                castNineEvolveBoost(ee);
                ee.boostCd = 1200; // 20초 쿨
            }
        }

        // --- 이동 ---
        // 공격 중(사거리 내 타겟)이면 멈춤
        if (target && bestDist <= effRange) continue;

        // 타겟이 있지만 사거리 밖 → 추적
        if (target) {
            const chaseX = target.x, chaseY = target.y;
            const cdx = chaseX - ee.x, cdy = chaseY - ee.y;
            const cdist = Math.sqrt(cdx * cdx + cdy * cdy);
            if (cdist > 3) {
                const spd = ee.moveSpeed * 1.3;
                ee.x += (cdx / cdist) * spd;
                ee.y += (cdy / cdist) * spd;
                if (cdx > 0.5) ee.facing = 1;
                else if (cdx < -0.5) ee.facing = -1;
            }
            ee.wanderTimer = 0;
            ee.idleTimer = 0;
        } else if (ee.idleTimer > 0) {
            // 대기
            ee.idleTimer--;
        } else {
            // 배회
            const dxW = ee.wanderX - ee.x, dyW = ee.wanderY - ee.y;
            const distW = Math.sqrt(dxW * dxW + dyW * dyW);

            if (ee.wanderTimer <= 0 || distW < 3) {
                const wa = Math.random() * Math.PI * 2;
                const wr = Math.random() * (FARM_RADIUS - 30);
                ee.wanderX = FARM_CX + Math.cos(wa) * wr;
                ee.wanderY = FARM_CY + Math.sin(wa) * wr * ISO_Y;
                ee.wanderTimer = 120 + Math.floor(Math.random() * 180);
                ee.idleTimer = 30 + Math.floor(Math.random() * 90);
            } else {
                ee.x += (dxW / distW) * ee.moveSpeed;
                ee.y += (dyW / distW) * ee.moveSpeed;
                ee.wanderTimer--;
                if (dxW > 0.5) ee.facing = 1;
                else if (dxW < -0.5) ee.facing = -1;
            }
        }

        // 농장 경계 클램프
        const edx = ee.x - FARM_CX, edy = ee.y - FARM_CY;
        const normD = Math.sqrt((edx / FARM_RADIUS) ** 2 + (edy / (FARM_RADIUS * ISO_Y)) ** 2);
        if (normD > 0.85) {
            const s = 0.85 / normD;
            ee.x = FARM_CX + edx * s;
            ee.y = FARM_CY + edy * s;
            ee.wanderTimer = 0;
        }
    }

    // 이브이끼리 충돌 분리 (드래그 중인 이브이 제외) — 2프레임마다 1회
    if (frame % 2 === 0) {
    const minDist = 26;
    for (let i = 0; i < eevees.length; i++) {
        const a = eevees[i];
        for (let j = i + 1; j < eevees.length; j++) {
            const b = eevees[j];
            const dx = b.x - a.x, dy = b.y - a.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < minDist && dist > 0.001) {
                const overlap = (minDist - dist) / 2;
                const nx = dx / dist, ny = dy / dist;
                if (a !== dragging) { a.x -= nx * overlap; a.y -= ny * overlap; }
                if (b !== dragging) { b.x += nx * overlap; b.y += ny * overlap; }
            } else if (dist < 0.001) {
                // 완전히 같은 위치 → 랜덤 방향으로 살짝 밀기
                if (b !== dragging) {
                    b.x += (Math.random() - 0.5) * 4;
                    b.y += (Math.random() - 0.5) * 4;
                }
            }
        }
    }
    } // end if frame%2

    // 투사체 이동
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.life--;
        if (p.life <= 0) { projectiles.splice(i, 1); continue; }

        const target = monsters.find(m => m.id === p.targetId && m.hp > 0);
        if (!target) { projectiles.splice(i, 1); continue; }

        const dx = target.x - p.x, dy = target.y - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        p.angle = Math.atan2(dy, dx);

        p.trail.push({ x: p.x, y: p.y, life: 8 });
        if (p.trail.length > 6) p.trail.shift();
        for (const t of p.trail) t.life--;

        if (dist < 10) {
            // 카테고리별 방어력 (defDown 상태이상 반영)
            const defStat = getMonsterDef(target, p.category === "spec");
            const baseDmg = Math.max(1, p.atk - defStat * 0.3);
            // 타입 상성
            const mul = totalTypeMul(p.attackerType, target);
            const dn = getDayNightMul(p.attackerType, null);
            const dmg = Math.max(1, Math.round(baseDmg * mul * dn.mul));
            const wasAlive = target.hp > 0;
            target.hp -= dmg;
            // 라스트힛 카운트
            if (wasAlive && target.hp <= 0 && p.attackerEe) {
                p.attackerEe.kills = (p.attackerEe.kills || 0) + 1;
                p.attackerEe.killNames = p.attackerEe.killNames || {};
                p.attackerEe.killNames[target.name] = (p.attackerEe.killNames[target.name] || 0) + 1;
            }
            // 평타 스플래시 (주변 적에게 30% 데미지, 반경 22)
            const splashR = 22, splashMul = 0.30;
            for (const m of monsters) {
                if (m === target || m.hp <= 0) continue;
                const sdx = m.x - target.x, sdy = (m.y - target.y) / ISO_Y;
                if (sdx * sdx + sdy * sdy < splashR * splashR) {
                    const sDef = getMonsterDef(m, p.category === "spec");
                    const sBase = Math.max(1, p.atk * splashMul - sDef * 0.3);
                    const sMul = totalTypeMul(p.attackerType, m);
                    const sDmg = Math.max(1, Math.round(sBase * sMul * dn.mul));
                    const sWasAlive = m.hp > 0;
                    m.hp -= sDmg;
                    m.hitAnim = 5;
                    if (sWasAlive && m.hp <= 0 && p.attackerEe) {
                        p.attackerEe.kills = (p.attackerEe.kills || 0) + 1;
                        p.attackerEe.killNames = p.attackerEe.killNames || {};
                        p.attackerEe.killNames[m.name] = (p.attackerEe.killNames[m.name] || 0) + 1;
                    }
                }
            }
            // 효과 표시
            if (mul > 1) {
                coinTexts.push({ x: target.x, y: target.y - 20, text: "효과적!", life: 35, color: "#FFEB3B" });
            } else if (mul < 1) {
                coinTexts.push({ x: target.x, y: target.y - 20, text: "별로...", life: 35, color: "#9E9E9E" });
            }
            if (dn.isBoosted) {
                const dnColor = dn.isDay ? "#FFE082" : "#B39DDB";
                skillEffects.push({ type:"shockwave", x: target.x, y: target.y, life: 14, maxLife: 14, color: dnColor, radius: 18 });
                for (let k = 0; k < 4; k++) {
                    const a = Math.random() * Math.PI * 2;
                    particles.push({
                        x: target.x, y: target.y - 4,
                        vx: Math.cos(a) * 1.2, vy: Math.sin(a) * 1.2 - 1,
                        color: dnColor, life: 14, maxLife: 14, size: 1.5 + Math.random() * 1,
                    });
                }
            }
            target.hitAnim = 8;
            const bt = BULLET_TYPES[p.bulletType] || BULLET_TYPES.normal;
            hitEffects.push({ x: target.x, y: target.y, color: bt.glow, life: 12, maxLife: 12 });
            for (let k = 0; k < 4; k++) {
                const a = Math.random() * Math.PI * 2;
                particles.push({
                    x: target.x, y: target.y,
                    vx: Math.cos(a) * (1 + Math.random() * 2),
                    vy: Math.sin(a) * (1 + Math.random() * 2) - 1,
                    color: bt.color, life: 15 + Math.random() * 10, maxLife: 25,
                    size: 2 + Math.random() * 2,
                });
            }
            projectiles.splice(i, 1);
            continue;
        }
        p.x += (dx / dist) * p.speed;
        p.y += (dy / dist) * p.speed;
    }

    // 몬스터 사망
    for (let i = monsters.length - 1; i >= 0; i--) {
        if (monsters[i].hp <= 0) {
            const m = monsters[i];

            // === 레이드 페이즈 1 → 페이즈 2 변신 ===
            if (m.isRaid && m.phase2Data && !m.transformed) {
                const p2 = m.phase2Data;
                const wm = p2.waveMul || 1;
                m.transformed = true;
                m.name = p2.name;
                m.sprite = p2.sprite;
                m.types = p2.types;
                m.type = p2.types[0];
                m.hp = Math.floor(p2.baseHp * wm * 20);
                m.maxHp = m.hp;
                m.mDef = Math.floor(p2.baseMDef * wm * 0.25);
                m.sDef = Math.floor(p2.baseSDef * wm * 0.25);
                m.spd = 0.010 * (p2.baseSpd / 100) * 0.4;
                m.statuses = {};
                // 변신 이펙트
                coinTexts.push({ x: m.x, y: m.y - 35, text: `${p2.name} 변신!`, life: 90, color: "#E91E63" });
                skillEffects.push({ type:"aoe", x: m.x, y: m.y, life: 60, maxLife: 60, color: "#E91E63", radius: 100 });
                skillEffects.push({ type:"shockwave", x: m.x, y: m.y, life: 40, maxLife: 40, color: "#fff", radius: 120 });
                for (let k = 0; k < 40; k++) {
                    const a = Math.random() * Math.PI * 2;
                    const sp = 2 + Math.random() * 4;
                    particles.push({
                        x: m.x, y: m.y,
                        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
                        color: "#E91E63", life: 50, maxLife: 50,
                        size: 3 + Math.random() * 3,
                    });
                }
                continue;
            }

            // 보스 카운트
            if (m.isBoss) bossKillCount++;
            // 코인 보상
            let reward;
            if (m.isRaid) reward = 200 + wave * 30;
            else if (m.isBoss) reward = 80 + wave * 18;
            else reward = 8 + Math.floor(wave * 1.6);
            coins += reward;
            coinTexts.push({ x: m.x, y: m.y - 15, text: `+${reward}`, life: 50 });

            // 보스/레이드 처치 시 아이템 드롭 (레이드는 100%, 보스는 25%)
            // 첫 보스(W10)는 75% 드롭, 그 외 25%, 레이드는 100%
            const dropChance = m.isRaid ? 1.0 : (m.isBoss ? (wave <= 10 ? 0.75 : BOSS_DROP_RATE) : 0);
            if (dropChance > 0 && Math.random() < dropChance) {
                const unowned = ITEMS.filter(it => !inventory.has(it.id));
                if (unowned.length > 0) {
                    const drop = unowned[Math.floor(Math.random() * unowned.length)];
                    inventory.add(drop.id);
                    coinTexts.push({ x: m.x, y: m.y - 35, text: `${drop.name} 획득!`, life: 90, color: "#FFEB3B" });
                    for (let k = 0; k < 20; k++) {
                        const a = Math.random() * Math.PI * 2;
                        particles.push({
                            x: m.x, y: m.y,
                            vx: Math.cos(a) * 3, vy: Math.sin(a) * 3 - 2,
                            color: "#FFD700", life: 50, maxLife: 50,
                            size: 2 + Math.random() * 2,
                        });
                    }
                }
            }
            // 사망 파티클
            for (let k = 0; k < 8; k++) {
                const a = Math.random() * Math.PI * 2;
                particles.push({
                    x: m.x, y: m.y,
                    vx: Math.cos(a) * (1.5 + Math.random() * 2),
                    vy: Math.sin(a) * (1.5 + Math.random() * 2) - 1,
                    color: "#FF8A65", life: 20 + Math.random() * 15, maxLife: 35,
                    size: 3 + Math.random() * 3,
                });
            }
            monsters.splice(i, 1);
        }
    }

    // 튜토리얼 단계 진행 체크
    if (gameState === "tutorial") {
        // Step 3+ 부터는 이브이가 항상 선택되어 있도록 강제
        if (tutorialStep >= 2 && tutorialStep < 4 && eevees[0]) {
            selectedEevee = eevees[0];
            selectedMonster = null; selectedItem = null; selectedRock = null;
        }
        if (tutorialStep === 0 && selectedEevee) tutorialStep = 1;
        else if (tutorialStep === 1) {
            // 목표 위치 50px 이내 도달 시
            const tg = getTutorialTargetPos();
            if (eevees[0]) {
                const dx = eevees[0].x - tg.x;
                const dy = eevees[0].y - tg.y;
                if (dx * dx + dy * dy < 50 * 50) tutorialStep = 2;
            }
        }
        else if (tutorialStep === 2 && tutorialMobSpawned && monsters.length === 0) {
            tutorialStep = 3;
            coins = Math.max(coins, 100); // 레벨업 자금 확보
        }
        else if (tutorialStep === 3) {
            if (eevees[0] && eevees[0].level > tutorialPrevLevel) {
                tutorialStep = 4;
                coins = Math.max(coins, 50); // 이브이 추가 자금 확보
                selectedEevee = null; // 선택 해제 (BUY_BTN 강조 잘 보이게)
            }
        }
        else if (tutorialStep === 4) {
            if (eevees.length > 1) {
                // 튜토리얼 완료 → 정식 게임 시작
                endTutorial();
            }
        }
    }

    // 코인 텍스트 업데이트
    for (let i = coinTexts.length - 1; i >= 0; i--) {
        coinTexts[i].y -= 0.5;
        coinTexts[i].life--;
        if (coinTexts[i].life <= 0) coinTexts.splice(i, 1);
    }
}

// 농장 타일 좌표 계산용 (드로우 함수에서 사용)
const BG_TW = 56, BG_TH = Math.round(BG_TW * ISO_Y);
function bgRand(a, b) {
    let n = a * 374761393 + b * 668265263;
    n = ((n ^ (n >> 13)) * 1274126177) | 0;
    return ((n ^ (n >> 16)) & 0x7fffffff) / 0x7fffffff;
}

function drawBackground() {
    // 낮/밤 배경 이미지
    const day = isDayWave();
    const bgImg = day ? images["bg/bg-day.png"] : images["bg/bg-night.png"];
    if (bgImg && bgImg.complete && bgImg.naturalWidth > 0) {
        ctx.drawImage(bgImg, 0, 0, CW, CH);
    } else {
        // fallback: 단색
        ctx.fillStyle = day ? "#5a9a45" : "#1c2540";
        ctx.fillRect(0, 0, CW, CH);
    }
}

// 농장 울타리 — image/bg/fence.png 사용 (낮 원본, 밤 자동 틴트)
// 이미지 로드 실패 시 fallback으로 절차적 그리기
let _fenceNightCache = null; // 밤 틴트 캐시
function getFenceNight(srcImg) {
    if (_fenceNightCache && _fenceNightCache.src === srcImg) return _fenceNightCache.canvas;
    const c = document.createElement("canvas");
    c.width = srcImg.naturalWidth;
    c.height = srcImg.naturalHeight;
    const cx = c.getContext("2d");
    cx.drawImage(srcImg, 0, 0);
    // 밤 톤: source-atop으로 알파 영역에만 푸른빛 오버레이
    // multiply는 알파 마스크를 무시하므로 사용 불가 (사각형 잔상 발생)
    cx.globalCompositeOperation = "source-atop";
    cx.fillStyle = "rgba(40, 50, 110, 0.55)";
    cx.fillRect(0, 0, c.width, c.height);
    cx.globalCompositeOperation = "source-over";
    _fenceNightCache = { src: srcImg, canvas: c };
    return c;
}

function drawFarmPlatform() {
    const fence = images["bg/fence.png"];
    if (fence && fence.complete && fence.naturalWidth > 0) {
        const day = isDayWave();
        // 농장 타원 가로지름 = FARM_RADIUS * 2 = 290
        // 이미지를 농장 폭에 맞춰 그리기 (비율 유지)
        const targetW = FARM_RADIUS * 2 + 20; // 약간의 여유
        const ratio = fence.naturalHeight / fence.naturalWidth;
        const targetH = targetW * ratio;
        const dx = FARM_CX - targetW / 2;
        const dy = FARM_CY - targetH / 2;
        const src = day ? fence : getFenceNight(fence);
        ctx.drawImage(src, dx, dy, targetW, targetH);
        return;
    }
    // === Fallback (이미지 로드 실패 시) ===
    return drawFarmPlatformFallback();
}

function drawFarmPlatformFallback() {
    const farmRX = FARM_RADIUS;
    const farmRY = FARM_RADIUS * ISO_Y;
    const day = isDayWave();

    // 시간대별 톤
    const colLight  = day ? "#F5EEDC" : "#B8B5C8"; // 밝은 면 (낮: 아이보리, 밤: 라벤더 톤)
    const colMid    = day ? "#D9C9A0" : "#7A7A95";
    const colDark   = day ? "#6B5638" : "#2E2E45"; // 외곽선
    const colShadow = "rgba(0,0,0,0.35)";

    const posts = 22;
    // 기둥들을 y 기준으로 정렬해서 뒤(작은 y) → 앞(큰 y) 순으로 그림 → 자연스러운 가림
    const postData = [];
    for (let i = 0; i < posts; i++) {
        const a = (i / posts) * Math.PI * 2;
        const px = FARM_CX + Math.cos(a) * farmRX;
        const py = FARM_CY + Math.sin(a) * farmRY;
        // depth: 0(뒤) ~ 1(앞)
        const depth = (Math.sin(a) + 1) / 2;
        postData.push({ px, py, depth, a });
    }
    postData.sort((a, b) => a.py - b.py);

    // === 1) 가로 레일 (타원 둘레 따라 두 줄) — 뒤쪽 절반 먼저, 앞쪽은 나중에 ===
    function drawRail(yOff, lineW, color) {
        ctx.strokeStyle = color;
        ctx.lineWidth = lineW;
        ctx.beginPath();
        for (let i = 0; i <= 80; i++) {
            const a = (i / 80) * Math.PI * 2;
            const px = FARM_CX + Math.cos(a) * farmRX;
            const py = FARM_CY + Math.sin(a) * farmRY + yOff;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
    }

    // 그림자 베이스 (땅에 닿는 라인 살짝 어두움)
    ctx.save();
    ctx.shadowColor = colShadow;
    ctx.shadowBlur = 4 * SHADOW_BLUR_MUL;
    ctx.shadowOffsetY = 2;
    drawRail(-3, 2.4, colMid);   // 아래쪽 가로레일
    drawRail(-11, 2.4, colMid);  // 위쪽 가로레일
    ctx.restore();

    // 레일 외곽선
    drawRail(-3, 3.0, colDark);
    drawRail(-11, 3.0, colDark);
    // 레일 본체 (밝은 톤)
    drawRail(-3, 1.8, colLight);
    drawRail(-11, 1.8, colLight);

    // === 2) 기둥 — 뒤→앞 순으로, 깊이에 따라 크기/색 보간 ===
    for (const p of postData) {
        // 뒤쪽 기둥은 살짝 작고 어둡게, 앞쪽은 크고 밝게
        const w = 2.6 + p.depth * 1.6;        // 2.6 ~ 4.2
        const h = 14 + p.depth * 4;           // 14 ~ 18
        const top = p.py - h;

        // 그림자
        ctx.fillStyle = colShadow;
        ctx.beginPath();
        ctx.ellipse(p.px, p.py + 1.5, w * 0.9, 1.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // 본체 — 좌(밝) / 우(중간) 두 면으로 픽셀아트 느낌
        const half = w / 2;
        // 좌측 밝은 면
        ctx.fillStyle = colLight;
        ctx.fillRect(p.px - half, top, half, h);
        // 우측 어두운 면
        ctx.fillStyle = colMid;
        ctx.fillRect(p.px, top, half, h);
        // 외곽선
        ctx.strokeStyle = colDark;
        ctx.lineWidth = 1;
        ctx.strokeRect(p.px - half, top, w, h);

        // 캡 (뾰족한 모자)
        ctx.fillStyle = colLight;
        ctx.beginPath();
        ctx.moveTo(p.px - half - 0.5, top);
        ctx.lineTo(p.px, top - 3);
        ctx.lineTo(p.px + half + 0.5, top);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = colDark;
        ctx.stroke();
    }
}
